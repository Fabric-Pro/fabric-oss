            exit 1;
          fi;
          echo 'Retry $$retry_count/$$max_retries: waiting 10s before retry...';
          sleep 10;
        done;
        NEXT_DISABLE_FILE_WATCHING=true pnpm --filter web dev
      "
    ports:
      - "3000:3001"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file: *compose_env_files
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DOCKER_CONTAINER=true
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ==========================================
  # Observability Stack
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: fabric-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: fabric-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3100
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3100:3001"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fabric-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"      # Jaeger UI
      - "4318:4318"        # OTLP HTTP receiver
      - "4317:4317"        # OTLP gRPC receiver
      - "5778:5778"        # Serve configs
      - "14268:14268"      # Accept jaeger.thrift directly
      - "14250:14250"      # Accept model.proto
      - "9411:9411"        # Zipkin compatible endpoint
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:latest
    container_name: fabric-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  postgres_data:
  minio_data:
  temporal_data:
  qdrant_storage:
  redis_data:
  agent_node_modules_1:  # document-generator
  agent_node_modules_2:  # project-document-generator
