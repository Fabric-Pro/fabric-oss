        done;
        echo 'Starting PartyKit server...';
        ./start-dev.sh
      "
    ports:
      - "1999:1999"
    volumes:
      - .:/app
      - partykit_node_modules:/app/party/node_modules
    env_file: *compose_env_files
    environment:
      - NODE_ENV=development
      - PARTYKIT_PORT=1999
      - HOST=0.0.0.0
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1999/parties/health/test',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # Weave multi-agent services (plan, read, implement)

  weave-readers:
    image: node:22-alpine
    container_name: fabric-weave-readers
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        cd /app/agents/langchain/weave-readers &&
        pnpm exec tsx src/index.ts
      "
    ports:
      - "8140:8140"
    volumes:
      - .:/app
    env_file: *compose_env_files
    environment:
      - NODE_ENV=development
      - PORT=8140
      - HOST=0.0.0.0
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8140/health"]
