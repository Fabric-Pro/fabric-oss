x-compose-env-files: &compose_env_files
  - ./.env.compose.example
  - path: ./.env.compose
    required: false

services:
  postgres:
    image: postgres:15-alpine
    container_name: fabric-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fabric
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: fabric-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9003
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  temporal:
    image: temporalio/auto-setup:1.28.0
    container_name: fabric-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"  # gRPC endpoint
    volumes:
      - temporal_data:/etc/temporal
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "workflow", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-ui:
    image: temporalio/ui:2.44.1
    container_name: fabric-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3001
    ports:
      - "8233:8080"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fabric-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Optional: Set API key for authentication
      # QDRANT__SERVICE__API_KEY: "your-api-key-here"

      # Performance tuning (optional)
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: 32
      QDRANT__SERVICE__MAX_WORKERS: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: fabric-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # DOCUMENT GENERATOR AGENT - DUAL PROTOCOL
  # ==========================================
  # AG-UI (LangGraph) on port 8124: For CopilotKit frontend
  # Single unified server handles both AG-UI (CopilotKit) and A2A (orchestrator) protocols

  # Document Generator - Unified Server (AG-UI + A2A)
  document-generator:
    image: node:22-alpine
    container_name: fabric-document-generator
    working_dir: /app/agents/langchain/document-generator
    command: >
      sh -c "
        retry_count=0;
        max_retries=3;
        until corepack enable && pnpm install; do
          retry_count=$$((retry_count + 1));
          if [ $$retry_count -ge $$max_retries ]; then
            echo 'Failed to install dependencies after $$max_retries attempts';
            exit 1;
          fi;
          echo 'Retry $$retry_count/$$max_retries: waiting 10s before retry...';
          sleep 10;
        done;
        echo 'Starting Unified server (AG-UI + A2A)...';
        npx tsx unified-server.ts
      "
    ports:
      - "8124:8124"
    volumes:
      - .:/app
      - agent_node_modules_1:/app/node_modules
    env_file: *compose_env_files
    environment:
      - NODE_ENV=development
      - PORT=8124
      - HOST=0.0.0.0
      - RUNTIME_API_URL=http://web:3001
    restart: on-failure:3
    depends_on:
      temporal:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8124/health',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

