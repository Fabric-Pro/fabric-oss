<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fabric — Strategy &amp; depth (docs mock)</title>
<!-- Real Inter + JetBrains Mono, the app's --font-sans / --font-mono. -->
<link rel="stylesheet" href="../.fonts/fonts.css">
<style>
/* Tokens copied verbatim from tooling/tailwind/theme.css :root (light). */
:root{
  --border:#d8d2cc; --ring:#9f2a3a;
  --background:#f7f6f2; --foreground:#1f1c19;
  --primary:#9f2a3a; --primary-foreground:#fff7f7;
  --muted:#efede8; --muted-foreground:#625c55;
  --accent:#f2e7e7; --card:#fffdf9;
  --radius:0.625rem; --radius-lg:var(--radius);
  --font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased;padding:24px;width:720px}
#shot-depth{width:672px}

/* Section (ProjectQaSettingsForm.tsx) */
section{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);padding:16px}
.head{margin-bottom:12px}
h4{font-size:.875rem;line-height:1.25rem;font-weight:500}
.head p{margin-top:2px;color:var(--muted-foreground);font-size:.75rem;line-height:1rem}

/* the three depth options */
.grid{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:12px;background:transparent;font-family:inherit}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 5%,transparent)}
.opt .row{display:flex;align-items:center;gap:8px}
.dot{display:flex;width:16px;height:16px;flex-shrink:0;align-items:center;justify-content:center;
  border-radius:9999px;border:1px solid color-mix(in srgb,var(--muted-foreground) 40%,transparent)}
.opt.sel .dot{border-color:var(--primary);background:var(--primary);color:var(--primary-foreground)}
.dot svg{width:10px;height:10px}
.name{font-weight:500;font-size:.875rem;line-height:1.25rem}
ul{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px;padding-left:24px;
  list-style:none;color:var(--muted-foreground);font-size:.75rem;line-height:1rem}
</style>
</head>
<body>
<div id="shot-depth">
  <section>
    <div class="head">
      <h4>Strategy &amp; depth</h4>
      <p>The default rigor applied when planning or running tests.</p>
    </div>
    <div class="grid">
      <button class="opt" type="button" aria-pressed="false">
        <span class="row"><span class="dot" aria-hidden="true"></span><span class="name">HARD — Hard</span></span>
        <ul><li>· Functional + integration + E2E</li><li>· Security and accessibility cases</li><li>· Boundary values and concurrency</li><li>· Tenant-isolation cases</li></ul>
      </button>
      <button class="opt sel" type="button" aria-pressed="true">
        <span class="row"><span class="dot" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span><span class="name">AVG — Average</span></span>
        <ul><li>· Functional + integration + E2E</li><li>· Main negative paths</li><li>· Obvious edge cases</li><li>· Security, performance and accessibility only on request</li></ul>
      </button>
      <button class="opt" type="button" aria-pressed="false">
        <span class="row"><span class="dot" aria-hidden="true"></span><span class="name">EASY — Easy</span></span>
        <ul><li>· Functional / acceptance cases only</li><li>· Happy path + the key negative case</li><li>· No integration or E2E cases</li><li>· No security, performance or accessibility cases</li></ul>
      </button>
    </div>
  </section>
</div>
</body>
</html>
