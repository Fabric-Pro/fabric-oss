# Shared product-tree notifier for the private staging -> OSS relay. This
# workflow exists identically in fabric-dev and fabric-oss so exact-ref
# synchronization remains possible, but the repository guard makes it active
# only in Fabric-Pro/fabric-dev. It never checks out or executes PR content.
name: OSS Relay Notifier

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
    branches: [master]
  issue_comment:
    types: [created]

permissions:
  pull-requests: read

jobs:
  notify:
    name: Wake the private relay
    if: >-
      github.repository == 'Fabric-Pro/fabric-dev' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-relay')) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/relay ')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oss-relay-notifier
    steps:
      # pull_request_target is load-bearing: the workflow definition comes
      # from trusted master. Do not add checkout, PR artifacts, caches, or
      # execution of any path from the proposed change. The credential can
      # dispatch one private-repo workflow but carries no product-repo write.
      #
      # The dispatch credential is a GitHub App installation token, minted
      # per run, so the woken run is attributed to the App rather than to
      # whichever person's PAT happens to be stored — a PAT ties every
      # failure notification and the notifier's continued operation to one
      # individual's account.
      - name: Mint the dispatch App token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.OSS_RELAY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.OSS_RELAY_DISPATCH_APP_PRIVATE_KEY }}
          owner: Fabric-Pro
          repositories: fabric
          permission-actions: write

      - name: Dispatch identifiers-only wake-up
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          STAGING_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          STAGING_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$STAGING_PR" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::GitHub supplied an invalid PR number"; exit 1; }
          PR=$(GH_TOKEN="$STAGING_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$STAGING_PR")
          # The relay itself adds the `relayed` label and closes the PR when
          # it finishes, and that label addition re-fires this notifier. A
          # closed PR can never be relayed (ops re-derives authorization from
          # live state regardless), so finding one here is a routine no-op —
          # not an error. Exiting 1 for it made every successfully relayed PR
          # end on a red check, which is exactly the noise that teaches people
          # to ignore the one notifier failure that ever matters.
          PR_STATE=$(jq -er '.state' <<<"$PR")
          case "$PR_STATE" in
            open) ;;
            closed)
              echo "PR #$STAGING_PR is closed — nothing to wake (already relayed or abandoned)."
              exit 0
              ;;
            *)
              echo "::error::GitHub supplied an unrecognized PR state '$PR_STATE'"
              exit 1
              ;;
          esac
          [[ "$(jq -r '.draft // false' <<<"$PR")" == false &&
              "$(jq -r '.base.ref' <<<"$PR")" == master &&
              "$(jq -r '.head.repo.full_name' <<<"$PR")" == "$GITHUB_REPOSITORY" ]] \
            || { echo "::error::relay wake-up requires an open, non-draft same-repository PR targeting master"; exit 1; }
          if ! jq -e '.labels | map(.name) | index("ready-for-relay") != null' <<<"$PR" >/dev/null; then
            echo "PR is not ready-for-relay; a later label event will retry"
            exit 0
          fi
          EXPECTED_HEAD_SHA=$(jq -r '.head.sha' <<<"$PR")
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GitHub supplied an invalid head SHA"; exit 1; }
          if [[ "$EVENT_NAME" == issue_comment ]]; then
            [[ "$COMMENT_BODY" =~ ^/relay\ ([0-9a-f]{40})$ ]] \
              || { echo "Comment is not an exact relay command; no dispatch"; exit 0; }
            [[ "${BASH_REMATCH[1]}" == "$EXPECTED_HEAD_SHA" ]] \
              || { echo "Comment targets a stale PR head; no dispatch"; exit 0; }
          else
            [[ "$EVENT_HEAD_SHA" == "$EXPECTED_HEAD_SHA" ]] \
              || { echo "PR head moved during notifier execution; a synchronize event will retry"; exit 0; }
          fi
          [[ -n "$DISPATCH_TOKEN" ]] \
            || { echo "::error::the dispatch App token was not minted"; exit 1; }
          jq -n --arg pr "$STAGING_PR" --arg head "$EXPECTED_HEAD_SHA" \
            '{ref:"ops",inputs:{mode:"relay",staging_pr:$pr,expected_head_sha:$head}}' \
            >"$RUNNER_TEMP/dispatch.json"
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
            repos/Fabric-Pro/fabric/actions/workflows/oss-relay.yml/dispatches \
            --input "$RUNNER_TEMP/dispatch.json"
