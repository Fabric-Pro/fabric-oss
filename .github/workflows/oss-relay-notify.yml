# Shared product-tree notifier for the private staging -> OSS relay. This
# workflow exists identically in fabric-dev and fabric-oss so exact-ref
# synchronization remains possible, but the repository guard makes it active
# only in Fabric-Pro/fabric-dev. It never checks out or executes PR content.
name: OSS Relay Notifier

on:
  # No `synchronize`. The relay only ever acts on a `/relay <sha>` comment
  # naming the pull request's CURRENT head, so a freshly pushed head cannot be
  # relayed until the author posts a new comment for it — and the
  # `issue_comment` trigger below wakes the notifier the moment they do. Waking
  # on the push itself only re-ran the head check, found the comment stale, and
  # billed a job minute to say so on every push of every labelled PR.
  pull_request_target:
    types: [labeled, reopened, ready_for_review]
    branches: [master]
  issue_comment:
    types: [created]
  # Third wake-up path: a staging check finishing is now a relay-relevant
  # event, because the relay withholds a head whose staging checks are not yet
  # green. Without this trigger a PR authorized (labelled + `/relay <sha>`)
  # before its checks finish would be withheld once and then never re-woken by
  # anything the author does.
  #
  # These six workflow names are the ones fabric-oss master requires; the
  # names match across repos because this is the same tree. Adding a required
  # check on the public side means adding its workflow name here.
  #
  # Every terminal conclusion wakes the relay, not just success. The ops side
  # owns the meaning of a head's state: it re-reads the head's check runs and
  # decides between withholding silently (still pending) and refusing with a
  # report (failed). A notifier that only woke on success would hide a failed
  # head from that machinery and leave the author with no relay-side message
  # at all.
  #
  # workflow_run runs the definition from the default branch, so this file is
  # trusted here for the same reason it is under pull_request_target; the
  # payload still carries attacker-influenced fields, which is why nothing
  # below is interpolated into a shell.
  workflow_run:
    workflows: ['Type Check', 'Unit Tests', 'Code Quality', 'Changeset check', 'DCO', 'Security']
    types: [completed]

permissions:
  pull-requests: read

# Deliberately no `concurrency:` block. Every wake-up gets its own run, and no
# wake-up can cancel or replace another through concurrency configuration.
#
# Grouping every wake-up by pull request number and cancelling in progress made
# fully successful pull requests end on a red check: a cancelled run surfaces as
# an unsuccessful check, which reads to everyone as a failure. Workflow-level
# concurrency applies independently of, and ahead of, a job-level `if` that
# would have skipped the job — so a run that was going to do nothing still
# cancelled a live one. Only `pull_request_target` runs surface on the pull
# request's own checks list, so they were the only corpses anyone could see.
# The relay's own closing comment killed the `relayed` label event's run on
# every single relayed pull request, and the authorizing `/relay` comment and
# `ready-for-relay` label, posted a second apart, killed whichever of the two
# GitHub happened to create first.
#
# Cancelling bought nothing in exchange. Partial job minutes are rounded up, so
# for jobs this short, once execution had started, cancelling after two seconds
# consumed the same single billable minute as finishing within twenty.
#
# Nor did it prevent duplicate dispatches, which are normal here and already
# absorbed. Every terminal staging check wakes the notifier separately, so one
# authorization routinely dispatches many times over; a single relay was
# observed absorbing seven. Those redundant wakes bypass no authorization —
# the ops relay re-derives all of it from live state — and its `oss-relay`
# group absorbs the pending duplicates.
#
# Grouping only the `/relay` comments was tried and rejected. `cancel-in-progress: false`
# does not mean nothing is cancelled: GitHub holds at most one pending run per
# group, and a newer arrival replaces — cancels — the one already waiting. The
# available `startsWith('/relay ')` predicate also admits malformed commands,
# which fail the exact-command test in the dispatch step, so such a comment
# could displace a queued valid command and then dispatch nothing in its place.
# Collapsing redundant wakes is not worth a path that silently drops a real one.
#
# The accepted cost of no grouping: a staging-repository commenter can spawn
# concurrent jobs by posting bodies beginning `/relay `, each minting the App
# token before the exact-command test rejects it. That spends runner minutes,
# but executes no caller-controlled code and exposes no credential, and every
# ordinary comment still skips the job before a runner is allocated.

jobs:
  notify:
    name: Wake the private relay
    # arm64: actions/create-github-app-token is a JS action, and every other
    # step is `gh api` / `jq` — architecture-neutral throughout.
    if: >-
      github.repository == 'Fabric-Pro/fabric-dev' &&
      ((github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'ready-for-relay') &&
        contains(github.event.pull_request.labels.*.name, 'ready-for-relay')) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/relay ')) ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    environment: oss-relay-notifier
    steps:
      # workflow_run carries no pull request context of its own beyond a head
      # SHA and a branch, and what it does carry is a snapshot from when the
      # checks started. Everything that decides relayability — open,
      # non-draft, based on master, same-repository head, labelled, and still
      # at this head — is therefore re-read from the live pull request here
      # rather than trusted from the payload: a run that finishes after a
      # force-push, a label removal or a close must not dispatch. Reading is
      # all this step does; like every other step here it never checks out or
      # executes any path from the proposed change.
      #
      # A branch can legitimately carry more than one open pull request, and
      # nothing in the payload says which one the author meant. Dispatching a
      # guess would relay a change nobody authorized, so ambiguity is a no-op
      # — the author's `/relay` comment and the label event both name the pull
      # request unambiguously and both still wake the relay.
      - name: Resolve the pull request behind the completed staging run
        id: staging-run-pr
        if: github.event_name == 'workflow_run'
        env:
          STAGING_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GitHub supplied an invalid workflow run head SHA"; exit 1; }
          CANDIDATES=$(jq -r '[.[]? | .number] | map(select(. != null)) | unique | .[]' <<<"$RUN_PULL_REQUESTS")
          if [[ -z "$CANDIDATES" ]]; then
            # The payload's pull_requests array is empty for fork pull requests
            # — which the relay never accepts anyway — and for runs GitHub did
            # not attribute to one. Listing open pull requests for the branch
            # covers the second case; the same-repository head check below
            # still rejects the first.
            [[ -n "$RUN_HEAD_BRANCH" ]] \
              || { echo "Completed run names neither a pull request nor a head branch; no dispatch."; exit 0; }
            CANDIDATES=$(GH_TOKEN="$STAGING_TOKEN" gh api --method GET \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f "head=${GITHUB_REPOSITORY%%/*}:$RUN_HEAD_BRANCH" \
              --jq '.[].number')
          fi
          SURVIVORS=()
          for CANDIDATE in $CANDIDATES; do
            [[ "$CANDIDATE" =~ ^[1-9][0-9]*$ ]] || continue
            PR=$(GH_TOKEN="$STAGING_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$CANDIDATE") || continue
            jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$RUN_HEAD_SHA" '
              .state == "open"
              and (.draft // false) == false
              and .base.ref == "master"
              and .head.repo.full_name == $repo
              and .head.sha == $head
              and ((.labels | map(.name) | index("ready-for-relay")) != null)
            ' <<<"$PR" >/dev/null || continue
            SURVIVORS+=("$CANDIDATE")
          done
          if [[ ${#SURVIVORS[@]} -eq 0 ]]; then
            echo "No open, non-draft, ready-for-relay pull request sits at this run's head; no dispatch."
            exit 0
          fi
          if [[ ${#SURVIVORS[@]} -gt 1 ]]; then
            echo "Ambiguous: pull requests ${SURVIVORS[*]} all sit at this run's head; no dispatch."
            exit 0
          fi
          echo "staging_pr=${SURVIVORS[0]}" >>"$GITHUB_OUTPUT"

      # pull_request_target is load-bearing: the workflow definition comes
      # from trusted master. Do not add checkout, PR artifacts, caches, or
      # execution of any path from the proposed change. The credential can
      # dispatch one private-repo workflow but carries no product-repo write.
      #
      # The dispatch credential is a GitHub App installation token, minted
      # per run, so the woken run is attributed to the App rather than to
      # whichever person's PAT happens to be stored — a PAT ties every
      # failure notification and the notifier's continued operation to one
      # individual's account.
      - name: Mint the dispatch App token
        id: dispatch-token
        # A workflow_run wake that resolved to no single pull request has
        # nothing to dispatch, so it does not get a token either.
        if: github.event_name != 'workflow_run' || steps.staging-run-pr.outputs.staging_pr != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.OSS_RELAY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.OSS_RELAY_DISPATCH_APP_PRIVATE_KEY }}
          owner: Fabric-Pro
          repositories: fabric
          permission-actions: write

      - name: Dispatch identifiers-only wake-up
        if: github.event_name != 'workflow_run' || steps.staging-run-pr.outputs.staging_pr != ''
        env:
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          STAGING_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          # Each event names the pull request differently and only one of the
          # three is ever populated, so the fallback chain resolves to exactly
          # one value per event. The checks below re-validate whichever it is
          # against live state, so no event's number is trusted on arrival.
          STAGING_PR: ${{ github.event.pull_request.number || github.event.issue.number || steps.staging-run-pr.outputs.staging_pr }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$STAGING_PR" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::GitHub supplied an invalid PR number"; exit 1; }
          PR=$(GH_TOKEN="$STAGING_TOKEN" gh api "repos/$GITHUB_REPOSITORY/pulls/$STAGING_PR")
          # The relay itself adds the `relayed` label and closes the PR when
          # it finishes, and that label addition re-fires this notifier. A
          # closed PR can never be relayed (ops re-derives authorization from
          # live state regardless), so finding one here is a routine no-op —
          # not an error. Exiting 1 for it made every successfully relayed PR
          # end on a red check, which is exactly the noise that teaches people
          # to ignore the one notifier failure that ever matters.
          PR_STATE=$(jq -er '.state' <<<"$PR")
          case "$PR_STATE" in
            open) ;;
            closed)
              echo "PR #$STAGING_PR is closed — nothing to wake (already relayed or abandoned)."
              exit 0
              ;;
            *)
              echo "::error::GitHub supplied an unrecognized PR state '$PR_STATE'"
              exit 1
              ;;
          esac
          [[ "$(jq -r '.draft // false' <<<"$PR")" == false &&
              "$(jq -r '.base.ref' <<<"$PR")" == master &&
              "$(jq -r '.head.repo.full_name' <<<"$PR")" == "$GITHUB_REPOSITORY" ]] \
            || { echo "::error::relay wake-up requires an open, non-draft same-repository PR targeting master"; exit 1; }
          if ! jq -e '.labels | map(.name) | index("ready-for-relay") != null' <<<"$PR" >/dev/null; then
            echo "PR is not ready-for-relay; a later label event will retry"
            exit 0
          fi
          EXPECTED_HEAD_SHA=$(jq -r '.head.sha' <<<"$PR")
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GitHub supplied an invalid head SHA"; exit 1; }
          if [[ "$EVENT_NAME" == issue_comment ]]; then
            [[ "$COMMENT_BODY" =~ ^/relay\ ([0-9a-f]{40})$ ]] \
              || { echo "Comment is not an exact relay command; no dispatch"; exit 0; }
            [[ "${BASH_REMATCH[1]}" == "$EXPECTED_HEAD_SHA" ]] \
              || { echo "Comment targets a stale PR head; no dispatch"; exit 0; }
          else
            [[ "$EVENT_HEAD_SHA" == "$EXPECTED_HEAD_SHA" ]] \
              || { echo "PR head moved during notifier execution; the next /relay comment for the new head will retry"; exit 0; }
          fi
          [[ -n "$DISPATCH_TOKEN" ]] \
            || { echo "::error::the dispatch App token was not minted"; exit 1; }
          jq -n --arg pr "$STAGING_PR" --arg head "$EXPECTED_HEAD_SHA" \
            '{ref:"ops",inputs:{mode:"relay",staging_pr:$pr,expected_head_sha:$head}}' \
            >"$RUNNER_TEMP/dispatch.json"
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
            repos/Fabric-Pro/fabric/actions/workflows/oss-relay.yml/dispatches \
            --input "$RUNNER_TEMP/dispatch.json"
