# Re-runs the failed jobs of a master snapshot build exactly once. This file
# exists identically in fabric-dev and fabric-oss so exact-ref synchronization
# remains possible, but the repository guard makes it active only in
# Fabric-Pro/fabric-oss. It never checks out or executes repository content.
name: OSS Snapshot Retry

# Why this exists. The dev reconciler deploys staging only from images that
# `Build OSS Snapshot Images` built and attested for the exact master tip, so
# a failed build leaves staging on the previous commit until someone re-runs
# it or a later commit lands. Between 2026-09-03 and 2026-09-23 ten master
# builds failed on their first attempt and one was ever re-run by hand; eight
# of the ten failed after the image had already been pushed, in the SBOM,
# attestation or verification steps, on transient registry or API errors. The
# longest of those stalls kept staging behind master for five and a half
# hours. The remediation the release runbook already prescribes is
# `gh run rerun <id> --failed`; this workflow performs it automatically, once.
#
# workflow_run runs the definition from the default branch, so this file is
# trusted here. The payload fields it reads are the run's own metadata; the
# only value that reaches a shell is the numeric run id, validated first.
on:
  workflow_run:
    workflows: ['Build OSS Snapshot Images']
    types: [completed]

permissions: {}

jobs:
  rerun-failed-jobs:
    name: Re-run failed snapshot jobs once
    # Only a first attempt is retried. `gh run rerun` keeps the run id and
    # bumps `run_attempt`, and the second attempt's completion fires this
    # workflow again with `run_attempt: 2`, which this guard skips. A build
    # that fails twice is left red for a person to read; a genuine break in
    # the tree is not retried indefinitely.
    #
    # `event == 'push'` and `head_branch == 'master'` restrict the retry to
    # the runs the dev reconciler and the release BOM assembler consume. A
    # `workflow_dispatch` run of the build is someone's manual experiment and
    # is theirs to re-run.
    if: >-
      github.repository == 'Fabric-Pro/fabric-oss' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Re-running a workflow run is an Actions write. Nothing else is granted:
      # no contents, no packages, no id-token, so this job cannot build, push
      # or attest anything itself.
      actions: write
    steps:
      - name: Re-run the failed jobs of the first attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::workflow_run id is not numeric"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::workflow_run head_sha is not a full commit SHA"; exit 1; }
          # --failed re-runs only the jobs that failed plus the jobs that were
          # skipped because of them (the aggregate job), so the components
          # that already built, pushed and attested are not rebuilt and their
          # digests do not change.
          gh run rerun "$RUN_ID" --repo "$REPOSITORY" --failed
          echo "::notice::re-ran the failed jobs of snapshot build $RUN_ID for $HEAD_SHA as attempt 2"
