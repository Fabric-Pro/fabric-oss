name: Temporal Replay Validation

# Trusted policy for the required replay-validation context. The
# pull_request_target jobs use event metadata and the Pulls API, without
# checking out or executing PR code. They publish a commit status on the
# validated PR head. Branch protection requires it and the same-name CheckRun
# from temporal-replay-pr-check.yml to pass.
#
# The staging-only snapshot job fetches recent dev histories in private
# fabric-dev and uploads an encrypted artifact. GitHub expires the artifact
# after two days. The pull_request companion decrypts the snapshot and
# replays it against eligible PR code without Temporal service credentials.
#
# Workflow coverage depends on the histories discovered by
# fetch-replay-histories.ts and the exports in src/workflows/index.ts.
# The replay test loads fixtures by workflow type.

on:
  # Use the trusted base workflow for policy and commit status publication.
  pull_request_target:
    types: [opened, synchronize, reopened]
    # Canonical upstream branch is `master` (post-cutover); see
    # docs/deployment.md § Branch cutover checklist.
    branches: [master, staging]
  # Refresh the snapshot from private fabric-dev on staging. Dispatches on
  # other refs or in other repositories skip all jobs.
  workflow_dispatch:
  schedule:
    - cron: '23 3,15 * * *'
  push:
    branches: [staging]
    paths:
      - 'packages/temporal/scripts/fetch-replay-histories.ts'
      - 'packages/temporal/scripts/replay-fixtures.ts'
      - 'packages/temporal/scripts/replay-history.ts'
      - '.github/workflows/temporal-replay-validation.yml'

permissions: {}

concurrency:
  group: temporal-replay-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  promotion_policy:
    # Prefix selects authentication work; only its live REST result permits reuse.
    if: >-
      github.repository == 'Fabric-Pro/fabric-dev' &&
      vars.STAGING_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.pull_request.base.ref == 'master' &&
      startsWith(github.event.pull_request.head.ref, 'promotion/')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/private-promotion-policy.yml

  authorize:
    # One trusted job validates event metadata and reads the PR changed-file
    # list through the Pulls API. The snapshot producer is independent.
    if: >-
      always() && !cancelled() && (needs.promotion_policy.result != 'success' || needs.promotion_policy.outputs.reduced != 'true') && github.event_name == 'pull_request_target'
    needs: [promotion_policy]
    name: Detect workflow changes and authorize private replay
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      secret_eligible: ${{ steps.gate.outputs.secret_eligible }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      # This job intentionally has no environment, secrets, dependency
      # installation, or checkout of PR content. Event fields enter the script
      # only through env so branch/login text cannot alter shell syntax.
      - name: Validate authenticated event metadata
        id: gate
        env:
          REPOSITORY: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          emit_decision() {
            printf 'secret_eligible=%s\nreason=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request head SHA; refusing replay authorization."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            emit_decision false untrusted_head_repository
          elif [[ "$REPOSITORY" == "Fabric-Pro/fabric" ||
                  "$REPOSITORY" == "Fabric-Pro/fabric-dev" ]]; then
            emit_decision true private_same_repository_pr
          elif [[ "$REPOSITORY" == "Fabric-Pro/fabric-oss" &&
                  "$PR_AUTHOR" == "fabric-relay[bot]" &&
                  "$HEAD_REF" == relay/* ]]; then
            emit_decision true authenticated_public_relay_pr
          elif [[ "$REPOSITORY" == "Fabric-Pro/fabric-oss" &&
                  "$PR_AUTHOR" == "fabric-relay[bot]" ]]; then
            emit_decision false public_pr_outside_relay_namespace
          elif [[ "$REPOSITORY" == "Fabric-Pro/fabric-oss" ]]; then
            emit_decision false public_credential_free_not_applicable
          else
            emit_decision false repository_not_allowlisted
          fi

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            workflows:
              # Workflow code imports helpers transitively across the package
              # (e.g. src/workflows/template-execution.ts imports
              # ../activities/lib/safe-expression-evaluator, and the
              # orchestrator workflows pull from ../orchestrator-config,
              # ../risk-assessment, ../execution-waves). Those helpers are
              # bundled into the workflow sandbox by bundleWorkflowCode, so
              # changing them can change deterministic workflow behavior
              # without touching src/workflows/ itself. Scope the filter to
              # the whole package's src/ to avoid silent gaps in coverage.
              - 'packages/temporal/src/**'
              - 'packages/temporal/__tests__/replay-validation.test.ts'
              - 'packages/temporal/scripts/fetch-replay-histories.ts'
              - 'packages/temporal/scripts/replay-fixtures.ts'
              - 'packages/temporal/scripts/replay-history.ts'
              - '.github/scripts/temporal-replay/**'
              - '.github/scripts/staging/promotion-policy.mjs'
              - '.github/workflows/private-promotion-policy.yml'
              - '.github/workflows/temporal-replay-pr-check.yml'
              - '.github/workflows/temporal-replay-validation.yml'

  publish_denial:
    # A pull_request workflow is contributor-controlled. For cases that must
    # block, this trusted legacy failure intentionally shares the required
    # context with any automatic CheckRun: branch protection requires both to
    # pass, so renaming or greening PR-controlled YAML cannot bypass denial.
    name: Publish trusted replay denial
    needs: [authorize, promotion_policy]
    if: >-
      always() && (needs.promotion_policy.result != 'success' || needs.promotion_policy.outputs.reduced != 'true') && (always() && github.event_name == 'pull_request_target' && (needs.authorize.result != 'success' || (needs.authorize.outputs.workflows != 'true' && needs.authorize.outputs.workflows != 'false') || (needs.authorize.outputs.workflows == 'true' && (((github.repository == 'Fabric-Pro/fabric' || github.repository == 'Fabric-Pro/fabric-dev') && needs.authorize.outputs.secret_eligible != 'true') || (github.repository == 'Fabric-Pro/fabric-oss' && needs.authorize.outputs.reason == 'public_pr_outside_relay_namespace')))))
    runs-on: ubuntu-24.04-arm
    # arm64: publishes a commit status via `gh api` — no checkout, no PR code.
    permissions:
      statuses: write
    env:
      REPOSITORY: ${{ github.repository }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      GATE_RESULT: ${{ needs.authorize.result }}
      WORKFLOWS_CHANGED: ${{ needs.authorize.outputs.workflows }}
      SECRET_ELIGIBLE: ${{ needs.authorize.outputs.secret_eligible }}
      AUTHORIZATION_REASON: ${{ needs.authorize.outputs.reason }}
    steps:
      - name: Publish exact-head failure from trusted policy
        run: |
          set -euo pipefail

          description="Temporal replay denied by trusted policy"
          if [[ "$GATE_RESULT" != "success" ]]; then
            description="Trusted Temporal change detection or authorization failed"
          elif [[ "$WORKFLOWS_CHANGED" != "true" &&
                  "$WORKFLOWS_CHANGED" != "false" ]]; then
            description="Trusted Temporal change detection was invalid"
          elif [[ "$WORKFLOWS_CHANGED" == "false" ]]; then
            echo "::error::Trusted denial must not run when no relevant files changed."
            exit 1
          elif [[ ("$REPOSITORY" == "Fabric-Pro/fabric" ||
                   "$REPOSITORY" == "Fabric-Pro/fabric-dev") &&
                  "$SECRET_ELIGIBLE" != "true" ]]; then
            description="Private-repo fork cannot use required Temporal replay"
          elif [[ "$REPOSITORY" == "Fabric-Pro/fabric-oss" &&
                  "$AUTHORIZATION_REASON" == "public_pr_outside_relay_namespace" ]]; then
            description="Relay App PR is outside required relay namespace"
          else
            echo "::error::Trusted denial job reached an unrecognized policy state; no status published."
            exit 1
          fi

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request head SHA; refusing denial publication."
            exit 1
          fi

          gh api --method POST "repos/$REPOSITORY/statuses/$PR_HEAD_SHA" \
            --raw-field state=failure \
            --raw-field context=replay-validation \
            --raw-field description="$description" \
            --raw-field target_url="$RUN_URL" >/dev/null

          echo "::error::$description"
          exit 1

  publish_allowance:
    # Accept the complement of the denial policy on successful authorization.
    # A retry can replace a failed status on the same head after a gate error.
    name: Publish trusted replay allowance
    needs: [authorize, promotion_policy]
    if: >-
      always() && !cancelled() &&
      (needs.promotion_policy.result != 'success' || needs.promotion_policy.outputs.reduced != 'true') &&
      github.event_name == 'pull_request_target' &&
      needs.authorize.result == 'success' &&
      (needs.authorize.outputs.workflows == 'false' ||
       (needs.authorize.outputs.workflows == 'true' &&
        !((github.repository == 'Fabric-Pro/fabric' || github.repository == 'Fabric-Pro/fabric-dev') &&
          needs.authorize.outputs.secret_eligible != 'true') &&
        !(github.repository == 'Fabric-Pro/fabric-oss' &&
          needs.authorize.outputs.reason == 'public_pr_outside_relay_namespace')))
    runs-on: ubuntu-24.04-arm
    permissions:
      statuses: write
    steps:
      - name: Publish exact-head success from trusted policy
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid pull request head SHA; refusing allowance publication."
            exit 1
          fi

          gh api --method POST "repos/$REPOSITORY/statuses/$PR_HEAD_SHA" \
            --raw-field state=success \
            --raw-field context=replay-validation \
            --raw-field description="Trusted policy allows this PR. Replay runs in the replay-validation check when required." \
            --raw-field target_url="$RUN_URL" >/dev/null

  snapshot_histories:
    # Private fabric-dev staging events refresh snapshots on a GitHub-hosted
    # runner. Non-fork, non-Dependabot workflow runs in fabric-dev can read the
    # repository Actions key. Encryption protects artifact downloads from
    # readers who cannot run workflows, including read-only collaborators.
    name: Refresh Temporal replay history snapshot
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'Fabric-Pro/fabric-dev' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/staging'
    runs-on: ${{ github.repository == 'Fabric-Pro/fabric-dev' && 'ubuntu-8core-arm' || 'ubuntu-latest' }}
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true

      - name: Locate pnpm's cache directory
        id: pnpm-cache
        run: echo "dir=$(pnpm cache path)" >> "$GITHUB_OUTPUT"

      - name: Restore lockfile verification log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}/lockfile-verified.jsonl
          key: pnpm-lockfile-verified-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-lockfile-verified-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@repo/temporal..."

      - name: Verify Temporal secrets
        env:
          TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_ADDRESS }}
          TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: |
          if [[ -z "$TEMPORAL_ADDRESS" || -z "$TEMPORAL_NAMESPACE" ]]; then
            echo "::error::Missing TEMPORAL_ADDRESS or TEMPORAL_NAMESPACE in 'dev' environment secrets."
            exit 1
          fi
          if [[ -z "$TEMPORAL_CLOUD_API_KEY" ]]; then
            echo "::error::Missing TEMPORAL_CLOUD_API_KEY in 'dev' environment secrets (or configure mTLS vars in the script)."
            exit 1
          fi

      - name: Fetch replay fixtures from dev
        env:
          TEMPORAL_ADDRESS: ${{ secrets.TEMPORAL_ADDRESS }}
          TEMPORAL_NAMESPACE: ${{ secrets.TEMPORAL_NAMESPACE }}
          TEMPORAL_CLOUD_API_KEY: ${{ secrets.TEMPORAL_CLOUD_API_KEY }}
        run: |
          pnpm --filter @repo/temporal fetch:replay-histories -- \
            --per-type 10 \
            --per-type-running 3 \
            --since-days 3

      - name: Verify histories and write snapshot metadata
        run: |
          set -euo pipefail

          fixtures_dir=packages/temporal/__tests__/__fixtures__
          history_file=$(find "$fixtures_dir/histories" -mindepth 2 -maxdepth 2 -type f -name '*.json' -print -quit)
          if [[ -z "$history_file" ]]; then
            echo "::error::No Temporal history fixtures were fetched. Refusing to publish an empty snapshot."
            exit 1
          fi

          node <<'NODE' > "$fixtures_dir/history-snapshot.json"
          const { GITHUB_SHA, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env;
          console.log(JSON.stringify({
            fetchedAt: new Date().toISOString(),
            sourceSha: GITHUB_SHA,
            runId: GITHUB_RUN_ID,
            runAttempt: GITHUB_RUN_ATTEMPT,
          }));
          NODE

      - name: Encrypt replay history snapshot
        env:
          REPLAY_SNAPSHOT_KEY: ${{ secrets.REPLAY_SNAPSHOT_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${REPLAY_SNAPSHOT_KEY:-}" ]]; then
            echo "::error::Missing REPLAY_SNAPSHOT_KEY. The staging snapshot cannot be encrypted."
            exit 1
          fi

          # Keep the passphrase in the shell and feed GPG on stdin only.
          export -n REPLAY_SNAPSHOT_KEY
          archive=
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/temporal-replay-gnupg.XXXXXX")
          trap '
            rm -f -- "$archive"
            gpgconf --homedir "$GNUPGHOME" --kill all || true
            rm -rf -- "$GNUPGHOME"
          ' EXIT
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          archive=$(mktemp "$RUNNER_TEMP/temporal-replay-snapshot.XXXXXX")
          tar -cf "$archive" -C packages/temporal/__tests__/__fixtures__ histories history-snapshot.json
          gpg --no-options --batch --yes --pinentry-mode loopback --no-symkey-cache \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/temporal-replay-history-snapshot.tar.gpg" "$archive" \
            <<< "$REPLAY_SNAPSHOT_KEY"

      # GitHub automatically deletes the encrypted artifact after two days.
      - name: Upload encrypted replay history snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporal-replay-history-snapshot
          path: ${{ runner.temp }}/temporal-replay-history-snapshot.tar.gpg
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
