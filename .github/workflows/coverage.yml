name: Statement Coverage

# Coverage is an independent report. The required Unit Tests workflow owns
# the test gate. A coverage run fails only if it cannot produce a full report.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [master, staging]
    paths:
      - .github/workflows/coverage.yml
      - tooling/scripts/src/coverage/**

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    if: github.event_name != 'schedule' || github.repository == 'Fabric-Pro/fabric-oss'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: plan
        run: |
          matrix=$(node tooling/scripts/src/coverage/coverage.mjs plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  measure:
    needs: plan
    runs-on: ${{ github.repository != 'Fabric-Pro/fabric-dev' && 'ubuntu-latest' || (github.event_name == 'pull_request' && 'namespace-profile-vitest-amd8' || 'ubuntu-8core-arm') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-install
      - name: Measure package shards
        env:
          COVERAGE_JOB: ${{ matrix.id }}
        run: node tooling/scripts/src/coverage/coverage.mjs job "$COVERAGE_JOB" "$RUNNER_TEMP/coverage-shards"
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statement-shard-${{ matrix.id }}
          path: ${{ runner.temp }}/coverage-shards
          if-no-files-found: error
          overwrite: true

  report:
    needs: [plan, measure]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download shard evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: statement-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-shards
      - name: Publish statement coverage
        run: node tooling/scripts/src/coverage/coverage.mjs aggregate "$RUNNER_TEMP/coverage-shards" "$RUNNER_TEMP/coverage-summary.json"
      - name: Upload JSON summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statement-coverage-summary
          path: ${{ runner.temp }}/coverage-summary.json
          if-no-files-found: error
          overwrite: true
