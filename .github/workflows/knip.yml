name: Knip

# Runs the full knip suite — unused files, unused/unlisted dependencies and
# binaries, unresolved imports, unused exports/types, and duplicate exports —
# on every PR to the canonical branch (`master`).
#
# Rationale: the baselines were cleaned tier by tier (dependencies, files,
# exports) and `pnpm knip` now exits 0 across all issue types. Without a CI
# gate the clean baseline silently regresses one import at a time. Knip's
# configuration hints are informational and never affect the exit code, so
# the small set of documented benign hints does not fail this job.
#
# knip analyzes the whole monorepo graph in one pass, so there is no
# changed-package scoping (same reasoning as the Biome workflow). It needs no
# .env.local or generated artifacts: the generated Prisma zod barrel it treats
# as an entry is tracked in git.
#
# This job starts out NOT in the required-checks set; promote it via branch
# protection once it has proven quiet on real PRs.
#
# Security: no user-controlled fields are interpolated into run: blocks.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Not in the private staging repo: fabric-oss runs this identical job on the
  # relayed change, so running it there too only duplicated the analysis (knip
  # reads the whole graph, so both runs see exactly the same tree). The guard
  # names fabric-dev rather than allow-listing fabric-oss so every other copy
  # of this tree still runs it.
  knip:
    name: Knip (dead code and dependencies)
    if: github.repository != 'Fabric-Pro/fabric-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip
        run: pnpm knip
