          if (todo > 0) { console.error("::error::a case is .todo — coverage silently dropped"); process.exit(1); }
          if (total !== EXPECTED || passed !== EXPECTED) {
            console.error(`::error::expected exactly ${EXPECTED} passing tests. Eleven in publishing-reconcile-activity.test.ts: the module imports no mail path and reads no mail key — asserted on the source, because an import that is merely unreached still couples the module — the activity reaches the activities barrel the worker hands to every Worker.create call, the ABANDONED signal is exactly ONE warn line per RUN carrying the count rather than one line per cycle, a run that abandons nothing still reports at info so a quiet hour stays distinguishable from a schedule that stopped firing, a null-clock PENDING cycle is ENROLLED on this tick and swept on a LATER one — the floor is never earlier than the moment the sweep first saw the row, so a worker clock that trails this one cannot make a live cycle look stale — a non-zero null-clock residual raises the level on its own even when nothing was abandoned, the staleness bound is the suggestion workflow's imported execution timeout rather than a copied literal and a cycle either side of it is treated accordingly, and markCycleFailed — the cycle writer that lives in this package, which the database suite cannot import — is driven for real against a PENDING cycle and leaves its staleness clock exactly where it was; plus 1C-2d-2b-1's three LEDGER cases — the ledger pass expiring, reclaiming and DISCHARGING THE ATTEMPT BOUND with no transactional-email key present in the process, which is what makes the 2b-1/2b-2 split honest because the half that ships the transitions must make progress on exactly the deployment that produced the backlog; the per-transition counts asserted EXHAUSTIVELY on the key set rather than spot-checked, so a fifth transition added later cannot be a number the workflow reports and nothing has ever seen, together with sweptAt pinned to fall INSIDE the call rather than merely being a string; and the states_reclaimed line, exactly one per run, carrying a moved count equal to the sum of the transitions and asserted to be INFO and never warn, because an expired obligation is the sweep working and an alert rule keyed on level would otherwise fire hourly on a healthy deployment. Two in redrive-publishing-notification.test.ts, spawned as a real child process because the script reads an environment a mock cannot supply: the duplicate guard refuses an old DEFERRED obligation still inside its expiry, which the shipped status list could not see and would have re-sent past the provider's idempotency horizon, and it does NOT demand --force-stale for a FAILED row at the attempt bound, which is not re-sendable at all. Plus 1C-2d-2b-2's thirteen in publishing-drain-activity.test.ts: the mail-configuration gate returning with zero counts rather than throwing — a throw would be an hourly red workflow on every deployment without a key, an alert firing on a supported configuration — and leaving every deferred row exactly where it was, since the gate is a RETURN and not a filter; the claim/send/confirm path carrying the same attempt-independent idempotency key the in-band path uses, so an obligation attempted in band and then deferred collapses into that attempt at the provider; a provider rejection returning the row to DEFERRED rather than FAILED, because a FAILED row carrying an expiry is invisible to the drain AND to pass 1; the four per-row gates each terminalizing as SKIPPED with their own reason and consuming no attempt; the gates read FRESH per row, pinned by flipping the project kill switch BETWEEN two rows of one page — the case an implementation that memoizes per run fails and every other gate case passes; the page budget spent with what is left PROBED rather than inferred, at the boundary where an exactly-full backlog and a real one look identical from the inside; and the source assertion that this activity reads the mail configuration while pass 1's still does not. Got total=${total} passed=${passed}`);
            process.exit(1);
          }
          EOF

  # Stable status check name reported on every PR to the canonical branch
  # (`master`). Configure this as the required check in branch protection —
  # not `db-tests` or `temporal-tests`, both of which are conditionally
  # skipped on PRs that don't touch their relevant files.
  db-integration:
    name: db-integration
    needs: [changes, db-tests, temporal-tests]
    if: always()
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DB_CHANGED: ${{ needs.changes.outputs.db }}
      DB_TESTS_RESULT: ${{ needs.db-tests.result }}
      TEMPORAL_CHANGED: ${{ needs.changes.outputs.temporal }}
      TEMPORAL_TESTS_RESULT: ${{ needs.temporal-tests.result }}
    steps:
      - name: Aggregate
        run: |
          # The path-filter job is a prerequisite. If it failed (or was
          # cancelled), DB_CHANGED/TEMPORAL_CHANGED are empty and we can't
          # trust a "no changes" answer — fail closed so PRs don't bypass
          # the gate.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Path-filter job did not succeed (result: $CHANGES_RESULT). Cannot determine whether DB-integration tests are required."
            exit 1
          fi

          failed=0

          # On PRs: db-tests is required only when DB-relevant paths changed.
          # On workflow_dispatch: db-tests always runs, propagate its result.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$DB_CHANGED" == "true" ]]; then
            if [[ "$DB_TESTS_RESULT" == "skipped" ]]; then
              echo "::error::DB-relevant changes detected but the db-tests job did not run."
              failed=1
            elif [[ "$DB_TESTS_RESULT" != "success" ]]; then
              echo "::error::DB-integration tests failed (db-tests job result: $DB_TESTS_RESULT)."
              failed=1
            else
              echo "DB-integration tests passed."
            fi
          else
            echo "No DB-relevant changes — DB-integration tests not required."
          fi

          # Same two-state gate for the temporal publishing suite: required
          # only when packages/temporal/** or packages/database/** changed
          # (or on workflow_dispatch), independent of the db-tests gate above
          # so a PR touching only packages/temporal/** still blocks on this.
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$TEMPORAL_CHANGED" == "true" ]]; then
            if [[ "$TEMPORAL_TESTS_RESULT" == "skipped" ]]; then
              echo "::error::Temporal- or database-relevant changes detected but the temporal-tests job did not run."
              failed=1
            elif [[ "$TEMPORAL_TESTS_RESULT" != "success" ]]; then
              echo "::error::Temporal publishing tests failed (temporal-tests job result: $TEMPORAL_TESTS_RESULT)."
              failed=1
            else
              echo "Temporal publishing tests passed."
            fi
          else
            echo "No temporal- or database-relevant changes — temporal publishing tests not required."
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
