blishing-settings-queries.test.ts on the broadcast target list: the round trip through the upsert and the read, the partial-update contract that keeps an unrelated save (a cadence change) from silently turning chat off, and the empty array reaching the column — that last one is the OFF switch itself, since the design has no separate boolean on the grounds that a second control could disagree with the selection, so nothing else in the suite would notice if the writer folded [] back into unchanged; plus 1C-3b's 9 in publishing-chat-delivery.test.ts on the broadcast ledger's WRITERS, which is a different question from 1C-3a's cases on the same table's constraints — those asked whether the database refuses a bad row, these ask whether the three functions the sender actually calls behave: the claim writing SENDING on an unseen channel, its refusal against an existing row in EACH of the four statuses (four cases and not one, because a single-status case passes just as well against a refusal predicate naming only that status, and the guarantee being pinned is that ANY pre-existing row refuses — a SENDING one included, since that is precisely what a crashed attempt leaves behind after the provider already accepted the message, and re-posting to be sure would put a duplicate in a shared channel), a SECOND channel in the same cycle still claimable so the key is proven per-channel rather than per-cycle, SENT carrying the provider message id and a delivery timestamp, the reason/errorMessage split asserted on both columns because a writer that put the closed classification into the free-text column would satisfy every count in this file and quietly break the only field an operator can filter on, and a mark scoped to its own cycle; plus 2 more in the same file after an adversarial review of the branch moved the SKIP path into the claim — a claim landing straight in SKIPPED with its reason in ONE statement, proven against the real status CHECK because the constraint has to admit that status on an INSERT and not only on the UPDATE the settle used to perform, and the row that claim writes still refusing a later send claim, without which moving the skip into the claim would have quietly opened the door the two-statement version kept shut. The two statements mattered: SENDING is written before any provider is contacted and is counted as delivered, so a failure between claim and settle left a row reading as a delivered broadcast for a channel the send path never even reached; plus 1C-1b's 12 in publishing-preferences-hash-write.test.ts, which are the only place the two encodings of \"counts as a run\" meet: five cases asserting that a terminal carries a preferences fingerprint on EXACTLY the cycles the cadence reader counts — the assertion is the agreement itself, not two independent expectations, so a drift in either the raw SQL here or the TypeScript predicate in persistCycleTerminal reddens this file and changing both together does not; one that the stored hash is DERIVED from the snapshot the caller passed rather than from a hash the caller chose, which is what keeps a single producer; three on the replay-recovery backfill, covering the success and INSUFFICIENT_CONTEXT branches SEPARATELY because a fix applied to one is not a fix applied to the other, the dirty half proving the backfill obeys the counts-as-a-run rule rather than filling any null it finds, and one proving a second replay carrying DIFFERENT preferences cannot overwrite a hash already recorded — without which a retry would rewrite what the recorded run actually used; two on the reader, which must answer for the NEWEST counted cycle including when that cycle carries no hash, staged as an older hash-bearing cycle behind a newer counted null-hash one (the shape a preferencesHash IS NOT NULL filter would silently skip past, matching an ancestor hash and cancelling a recovery run the project needs) and as a dirty INSUFFICIENT_CONTEXT that must not answer at all; and one that a caller