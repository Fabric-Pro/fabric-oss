            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=publishing-email-delivery-results.json

      - name: 'Guard: assert the publishing email delivery suite executed (exact count, zero skips)'
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const EXPECTED = 15;
          const report = JSON.parse(fs.readFileSync("packages/temporal/publishing-email-delivery-results.json","utf8"));
          const files = report.testResults?.length ?? 0;
          const total = report.numTotalTests ?? 0;
          const passed = report.numPassedTests ?? 0;
          const skipped = (report.numSkippedTests ?? 0) + (report.numPendingTests ?? 0);
          const todo = report.numTodoTests ?? 0;
          console.log(`publishing-email-delivery: ${files} file(s), total=${total} passed=${passed} skipped=${skipped} todo=${todo}`);
          if (files !== 1) { console.error("::error::Expected exactly 1 test file (publishing-email-delivery.test.ts)"); process.exit(1); }
          if (skipped > 0) { console.error("::error::suite self-skipped — RUN_DB_INTEGRATION not honored — false pass"); process.exit(1); }
          if (todo > 0) { console.error("::error::a case is .todo — coverage silently dropped"); process.exit(1); }
          if (total !== EXPECTED || passed !== EXPECTED) {
