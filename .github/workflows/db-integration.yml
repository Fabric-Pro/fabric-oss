      - name: 'Guard: assert the publishing reconciliation activity suite executed (exact count, zero skips)'
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const EXPECTED = 26;
          const report = JSON.parse(fs.readFileSync("packages/temporal/publishing-reconcile-activity-results.json","utf8"));
          const files = report.testResults?.length ?? 0;
          const total = report.numTotalTests ?? 0;
