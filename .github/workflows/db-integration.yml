          EOF

      - name: Run the project role-confirmation suites (real Postgres)
        # Fizzy #2264. The trigger CORRECTS rather than raising, which makes it
        # silent by design — the trigger suite is the only thing anywhere that
        # can detect it missing, dropped by a later migration, or installed as
        # AFTER UPDATE. It must never be allowed to self-skip.
        #
        # The confirmation suite alongside it covers what the mocked writer
        # tests structurally cannot: the row lock deciding who reads a
        # committed value, the unique index refusing a second create, and the
        # RLS policy deciding who can see the row at all. Both files run in one
        # step so a single guard below reads one report.
        env:
          RUN_DB_INTEGRATION: '1'
        run: |
          pnpm --filter @repo/database exec vitest run \
            __tests__/project-user-function-tag-version-trigger.test.ts \
            __tests__/project-user-function-tag-confirmation.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=role-tag-trigger-results.json

      - name: 'Guard: assert the role-tag suites executed (exact count, zero skips)'
        # Same anti-false-pass shape as the guards above: both files self-skip
        # via `describe.skipIf(!hasReachableDatabaseUrl())`, so a green step
        # proves nothing on its own.
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "packages/database/role-tag-trigger-results.json";
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          const files = report.testResults?.length ?? 0;
          const total = report.numTotalTests ?? 0;
          const passed = report.numPassedTests ?? 0;
          const skipped =
            (report.numSkippedTests ?? 0) + (report.numPendingTests ?? 0);
          console.log(
            `role-tag-trigger results: ${files} file(s), total=${total} passed=${passed} skipped=${skipped}`,
          );
          if (files !== 2) {
            console.error(
              `::error::Expected exactly 2 test files (project-user-function-tag-version-trigger.test.ts and project-user-function-tag-confirmation.test.ts) to run, got ${files}.`,
            );
            process.exit(1);
          }
          if (skipped > 0) {
            console.error(
              `::error::${skipped} test(s) were skipped — the suite self-skipped instead of executing against Postgres. A green run here would be a false pass.`,
            );
            process.exit(1);
          }
          // 26 = 10 trigger + 16 confirmation, counted from an observed run
          // rather than predicted, so the first failure here is a real change
          // and not a constant somebody has to guess at.
          //
          // 10 in project-user-function-tag-version-trigger.test.ts:
          //   1 INSERT + 3 version-correction + 1 no-double-bump
          //   + 1 untouched-columns + 3 confirmedAt-invariant
          //   + 1 advance-by-more-than-one (the `<=` vs `<>` discriminator).
          //
          // 16 in project-user-function-tag-confirmation.test.ts:
          //   5 admin-path confirmation-clearing — including the two the
          //   trigger cannot cover for the writer, and which are therefore the
          //   only ones in this file that redden when the writer's clear is
          //   deleted: a first row CREATED unconfirmed at version 0 (the
          //   trigger is BEFORE UPDATE, so an INSERT carries whatever the
          //   writer put in it) and an organizationId-only re-home (the tag set
          //   does not move, so invariant 1 never fires)
          //   + 2 applyGlobalDefaultFunctionTags branches + 1 stale-version CAS
          //   + 3 concurrency (same-version race, absent-row race, and the
          //   expectedVersion-null-against-an-existing-row conflict)
          //   + 2 row-lock (the observed 55P03 block and the interleaving that
          //   reddens when `FOR UPDATE` is deleted) + 2 status reads
          //   + 1 RLS cross-organization invisibility.
          if (total !== 26 || passed !== 26) {
            console.error(
              `::error::Expected exactly 26 tests (total and passed), got total=${total} passed=${passed}.`,
            );
            process.exit(1);
          }
          EOF

  temporal-tests:
    name: Temporal publishing tests (real Postgres)
    needs: changes
    # Always run on workflow_dispatch (manual validation); on PRs only when
    # temporal- or database-relevant paths changed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.temporal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        # -h/-p make this a TCP probe, and they are load-bearing. Without
        # them pg_isready checks the UNIX SOCKET, which during container
        # startup is answered by the temporary server the postgres entrypoint
        # runs while executing initdb — a server that listens on the socket
        # only, is not accepting TCP, and is shut down before the real one
        # starts. Docker marks a container healthy on the FIRST successful
        # probe, so --health-retries cannot recover from an early false
        # positive: the job proceeds against a server that is about to
        # disappear, and the first real client (prisma migrate deploy) fails
        # on a connection reset that looks like a flake. Probing 127.0.0.1
        # cannot pass until the real server is accepting TCP connections.
        #
        # --health-start-period is deliberate too. The old unix-socket probe
        # used to succeed in about a second, so the 10 x 5s retry budget was
        # almost entirely spare margin. A TCP probe cannot succeed until
        # initdb, the init scripts, and the real server have all finished —
        # that margin is now incidental, not structural, and would vanish
        # silently if anyone ever trimmed --health-retries.
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    env:
      # Deliberately NOT the unit-tests.yml placeholder
      # (postgresql://test:test@localhost:5432/test) — the two suites in this
      # job are gated on RUN_DB_INTEGRATION=1, not a reachability probe, but
      # they still need a real connection to write through: the ledger's unique
      # (cycleId, recipientUserId, channel) triple, the outcome column's
      # compare-and-swap, and the tenant fence's FOR UPDATE all require an
      # actual Postgres, not a mock. This points at the real `postgres`
      # service above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches root package.json `engines.node` (>=22.19.0) and unit-tests.yml.
          # The suite under test ships on 22, so pinning an older major here would
          # exercise a runtime nobody runs. The db-tests job above still pins 20 —
          # pre-existing, and out of this slice's scope to change.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cache and key as the db-tests job above — one artifact, built
      # once per schema/generator change instead of twice per run.
      - name: Restore generated Prisma client
        id: prisma-client-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/database/prisma/generated
          key: prisma-client-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'packages/database/prisma/zod-generator.config.json', 'packages/database/prisma/tsconfig.generated.json', 'packages/database/scripts/generate-client.mts', 'packages/database/scripts/fix-zod-imports.ts', 'pnpm-lock.yaml') }}

      - name: Generate Prisma client
        # publishing-notify-activity.test.ts imports `db` and the publishing
        # queries from @repo/database directly (not via turbo's task graph,
        # which would generate this automatically as a `test` dependency —
        # see turbo.json). This step is what makes that import resolve.
        if: steps.prisma-client-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/database generate

      - name: Apply migrations
        run: pnpm --filter @repo/database exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Apply RLS policies
        # Invoked directly for the same reason as the db-tests job above:
        # apply:rls wraps itself in `dotenv -c -e ../../.env.local --`, which
        # errors in CI where .env.local does not exist.
        run: pnpm --filter @repo/database exec tsx ./scripts/apply-rls-direct.ts

      - name: Run the publishing contributor-notification activity suite against real Postgres
        env:
          RUN_DB_INTEGRATION: '1'
        # runPublishingTopicsReadyNotification (Fizzy #1850, Phase 1C-2b) is
        # the activity this whole slice exists to ship. Every assertion in
        # this file depends on a real ledger row, a real compare-and-swap on
        # the cycle's notificationOutcome, or a real tenant-scoped query —
        # none of which a mocked Prisma client can exercise. Without this
        # step the file self-skips under unit-tests.yml (which never sets
        # RUN_DB_INTEGRATION) and vitest still exits 0.
        run: |
          pnpm --filter @repo/temporal exec vitest run \
            __tests__/publishing-notify-activity.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=publishing-notify-activity-results.json

      - name: 'Guard: assert the publishing notification activity suite executed (exact count, zero skips)'
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          // 53 -> 58: Fizzy #1850 slice 1C-2d-3b bounds one attempt's email walk
          // at PUBLISHING_NOTIFY_MAX_EMAILS_PER_ATTEMPT and gives it the ledger as
          // a cursor. The four cases pin the bound biting, the retry ADVANCING
          // rather than re-walking, a full bound spent only on recipients who
          // still need one, and a roster inside the bound behaving as before.
          // The fifth pins the "email walk bounded" log line, which the deploy
          // runbook now instructs an operator to grep for and read `remaining`
          // off — an operator-facing line that nothing asserts is the
          // write-only telemetry that hid a month-long outage once already.
          // Taken from an observed run, not from arithmetic.
          const EXPECTED = 58;
          const report = JSON.parse(fs.readFileSync("packages/temporal/publishing-notify-activity-results.json","utf8"));
          const files = report.testResults?.length ?? 0;
          const total = report.numTotalTests ?? 0;
          const passed = report.numPassedTests ?? 0;
          const skipped = (report.numSkippedTests ?? 0) + (report.numPendingTests ?? 0);
          const todo = report.numTodoTests ?? 0;
          console.log(`publishing-notify-activity: ${files} file(s), total=${total} passed=${passed} skipped=${skipped} todo=${todo}`);
          if (files !== 1) { console.error("::error::Expected exactly 1 test file (publishing-notify-activity.test.ts)"); process.exit(1); }
          if (skipped > 0) { console.error("::error::suite self-skipped — RUN_DB_INTEGRATION not honored — false pass"); process.exit(1); }
          if (todo > 0) { console.error("::error::a case is .todo — coverage silently dropped"); process.exit(1); }
          if (total !== EXPECTED || passed !== EXPECTED) {
            console.error(`::error::expected exactly ${EXPECTED} passing tests (the full suite: ledger outcome/status CHECK constraints, activation and completion compare-and-swap incl. stale-version and terminal-downgrade guards, recipient eligibility resolution, exactly-once ledger+bell delivery incl. skip/retry/revoke, delivery-state reads, the per-recipient opt-out re-check, and the delivery/close mutual exclusion — the project row lock held across the closing transaction plus the fence's refusal to write under a cycle terminalized mid-attempt; plus Phase 1C-2c's email cases: the two independent candidate sets and their four flag/preference combinations, the publishingEmails opt-out honored separately from the bell's publishingSuggestions, MAIL_NOT_CONFIGURED written as a forced outcome that wins over SENT while leaving the bell delivered and retryable, SENDING counted as unconfirmed so a held lease cannot close a cycle, and the tenant-moved handling that must stay BELOW the email loop); plus Phase 1C-2d-3a's producer cases: an email-only recipient's obligation DEFERRED rather than dropped and the row read back AFTER the activity returns, which is the only assertion that can fail — every other one passes with the obligation destroyed, since the row exists, its status is terminal, the cycle outcome is right and every count agrees; the intersection recipient NOT deferred, because the bell reached them and a second slower obligation for someone the fast channel is still retrying is how the ledger's own duplicate protection gets defeated; the negative control that a cycle where every email candidate also gets a bell defers nobody, without which a producer deferring the WHOLE candidate set would pass every other case; MAIL_NOT_CONFIGURED still recorded and the bell still delivered, because deferral is an ADDITION to that path rather than a replacement for it; a REJECT when the deferral write fails, injected at the query layer rather than by mocking the writer, since §9.6 names that as the one case the reject rule exists for — the obligation undischarged AND unrecorded; idempotency across a retried attempt, staged so the first attempt REJECTS because an attempt that defers and completes closes the cycle and the second would exit on the already-terminal branch without reaching the writer at all; the in-band claim taking over a deferred row once the key returns, DEFERRED having been a claimable status since 1C-2c; and the pair that pins the accounting — a DEFERRED row the claim cannot take does not hold the cycle open, while a HELD lease still does, which is what stops that exclusion widening into one), got total=${total} passed=${passed}`);
            process.exit(1);
          }
          EOF

      - name: Run the publishing email delivery suite against real Postgres
        env:
          RUN_DB_INTEGRATION: '1'
        # The claim -> send -> confirm module (Fizzy #1850, Phase 1C-2c) and its
        # interleaving cases. This needs its own step for the same reason
        # publishing-notify-activity.test.ts does, and the reason is not
        # theoretical: run this file the way unit-tests.yml runs it — with
        # RUN_DB_INTEGRATION and a real DATABASE_URL both absent — and it
        # reports "1 passed | 12 skipped" and exits 0. The one case that
        # survives is a module-shape assertion; every case that exercises the
        # lease self-skips. Without this step the entire email delivery path
