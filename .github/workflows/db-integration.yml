name: DB Integration

# Real-Postgres, merge-blocking gate for the daily-brief release-notes
# exclusions tenant-XOR suite, which CANNOT run on `unit-tests.yml`.
#
# Why this can't just be a step in unit-tests.yml (the 1869 lesson):
# `unit-tests.yml` sets DATABASE_URL to a well-known PLACEHOLDER
# (postgresql://test:test@localhost:5432/test) purely so the
# @repo/database Prisma singleton can initialize at module load — it is
# never connected to. `daily-brief-exclusions.test.ts` self-skips via
# `describe.skipIf(!hasReachableDatabaseUrl())`, which explicitly rejects
# the placeholder (see packages/database/__tests__/_helpers/db-availability.ts),
# so a green `unit-tests` check proves nothing about the exclusions table's
# create/delete/list, [projectId, targetKey] idempotency, concurrency, and
# XOR org-vs-personal scoping. This workflow spins up a REAL Postgres
# service, applies migrations + RLS policies, and runs that suite so it
# executes (not skip). A pre-flight + post-hoc guard (see the `db-tests`
# job) fails the job outright if the suite would have self-skipped — a
# green run here can never be a false pass.
#
# Scope note (RLS enforcement): the query-level XOR this suite verifies is
# the isolation boundary our feature actually relies on in production — the
# API/worker use the BYPASSRLS base `db` with explicit tenant columns, so
# RLS only bites getTenantDb()/withRLSContext() paths. The RLS-POLICY
# enforcement suite (`rls-isolation.test.ts`) IS now run in this job by the
# dedicated steps below (see "Run the RLS-policy enforcement suite"): its
# setup fixtures are seeded on the privileged `postgres` connection (which
# bypasses RLS), then each assertion drops to the NOBYPASSRLS/NOSUPERUSER
# `fabric_rls_test` role via `SET LOCAL ROLE` (see
# __tests__/_helpers/rls-role.ts), so the tenant_isolation USING/WITH CHECK
# policies are enforced against a connection SUBJECT to RLS. The RLS policy
# is applied here (apply-rls-direct.ts); the same suite also runs locally
# via `pnpm --filter @repo/database test:rls` against a privileged
# (superuser) dev DB — the harness drops role per-assertion via SET LOCAL
# ROLE, so the outer connection must itself be privileged enough to SET
# ROLE (a plain CREATEROLE connection is not sufficient on PG16).
#
# Temporal note: `temporal-tests` gives packages/temporal's own
# RUN_DB_INTEGRATION=1-gated suites (publishing-notify-activity.test.ts,
# Fizzy #1850, Phase 1C-2b) the same real-Postgres execution this file
# already gives packages/database's suites. Without it, that file's
# `it.skipIf(!RUN_DB)` cases self-skip under unit-tests.yml (which never
# sets RUN_DB_INTEGRATION) and vitest exits 0 — the activity implementing
# the whole notification lifecycle would have zero CI signal.
#
# Branch-protection note: mirrors unit-tests.yml's 3-job pattern, plus one
# more parallel test job (`temporal-tests`) gated on its own path filter.
# This workflow always runs on PRs to the canonical branch so the
# `db-integration` status check is reported on every PR; the expensive
# `db-tests` / `temporal-tests` jobs only run when their relevant paths
# actually changed (or on workflow_dispatch). The aggregate job fails
# closed if the path-filter didn't succeed, so `db-integration` is safe to
# mark as a required check even though both test jobs are conditionally
# skipped.

on:
  pull_request:
    # Canonical upstream branch is `master` (post-cutover); see
    # docs/deployment.md § Branch cutover checklist.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter uses the Pulls API on PR events.
  pull-requests: read

concurrency:
  group: db-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      temporal: ${{ steps.filter.outputs.temporal }}
    steps:
      # On pull_request events dorny/paths-filter detects changed files via
      # the Pulls API (the `pull-requests: read` permission above) and does
      # not need the repo on disk. Checkout is only required for the
      # git-based detection used on workflow_dispatch runs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            db:
              - 'packages/database/**'
              - 'packages/database/prisma/schema.prisma'
              - 'packages/database/prisma/migrations/**'
              # The prompt procedures' notification delivery is asserted
              # against a real Postgres here (recipient resolution + the
              # bell rows a reader actually gets), so prompt-API changes
              # are DB-relevant too.
              - 'packages/api/modules/prompts/**'
              - '.github/workflows/db-integration.yml'
            temporal:
              # publishing-notify-activity.test.ts (Fizzy #1850) reads and
              # writes through @repo/database (the ledger's compare-and-swap,
              # the tenant fence, the unique delivery triple) — none of that
              # is mockable, so this suite is as dependent on
              # packages/database/** as it is on packages/temporal/** itself.
              - 'packages/temporal/**'
              - 'packages/database/**'
              - '.github/workflows/db-integration.yml'

  db-tests:
    name: DB/RLS/XOR tests (real Postgres)
    needs: changes
    # Always run on workflow_dispatch (manual validation); on PRs only when
    # DB-relevant paths changed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_test
        ports:
          - 5432:5432
        # -h/-p make this a TCP probe, and they are load-bearing. Without
        # them pg_isready checks the UNIX SOCKET, which during container
        # startup is answered by the temporary server the postgres entrypoint
        # runs while executing initdb — a server that listens on the socket
        # only, is not accepting TCP, and is shut down before the real one
        # starts. Docker marks a container healthy on the FIRST successful
        # probe, so --health-retries cannot recover from an early false
        # positive: the job proceeds against a server that is about to
        # disappear, and the first real client (prisma migrate deploy) fails
        # on a connection reset that looks like a flake. Probing 127.0.0.1
        # cannot pass until the real server is accepting TCP connections.
        #
        # --health-start-period is deliberate too. The old unix-socket probe
        # used to succeed in about a second, so the 10 x 5s retry budget was
        # almost entirely spare margin. A TCP probe cannot succeed until
        # initdb, the init scripts, and the real server have all finished —
        # that margin is now incidental, not structural, and would vanish
        # silently if anyone ever trimmed --health-retries.
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s
    env:
      # Deliberately NOT the unit-tests.yml placeholder
      # (postgresql://test:test@localhost:5432/test) — that value is
      # rejected by hasReachableDatabaseUrl() and would make the exclusion
      # suite self-skip. This points at the real `postgres` service above.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fabric_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches root package.json `engines.node` (>=22.19.0) and the
          # temporal-tests job below. This job used to pin 20; the prompt
          # notification-delivery suite's import graph (undici v8 via the
          # external-delivery path) requires >=22, and shipping on 22 while
          # testing on 20 exercises a runtime nobody runs.
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prisma/generated is gitignored and costs 60-75s to build here, and
      # again in the temporal-tests job, on every run. It is a pure function of
      # the schema, the generator config and the pinned generator versions, so
      # key the cache on exactly those and skip the rebuild when none moved.
      # Both jobs share this key deliberately — they build the same artifact.
      #
      # prisma/zod is NOT cached: it is committed .ts source (see
      # scripts/generate-client.mts) and arrives with the checkout. A schema
      # edit changes this key, misses, and regenerates both.
      - name: Restore generated Prisma client
        id: prisma-client-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/database/prisma/generated
          key: prisma-client-${{ runner.os }}-${{ hashFiles('packages/database/prisma/schema.prisma', 'packages/database/prisma/zod-generator.config.json', 'packages/database/prisma/tsconfig.generated.json', 'packages/database/scripts/generate-client.mts', 'packages/database/scripts/fix-zod-imports.ts', 'pnpm-lock.yaml') }}

      - name: Generate Prisma client
        if: steps.prisma-client-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @repo/database generate

      - name: Apply migrations
        # Applies every migration, including the hand-authored
        # 20260710120000_daily_brief_release_note_exclusions migration,
        # against a real Postgres — this is also the deferred DB
        # revalidation for that migration's offline authoring.
        run: pnpm --filter @repo/database exec prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Apply RLS policies
        # Invoked directly (not via the `apply:rls` npm script) because that
        # script is wrapped in `dotenv -c -e ../../.env.local --`, and
        # .env.local does not exist in CI — dotenv-cli would error before
        # ever reaching the script. apply-rls-direct.ts reads DATABASE_URL
        # from the process environment via the Prisma `db` client, so
        # invoking tsx directly with this job's env is sufficient.
        # WORKER_DB_PASSWORD / WORKER_ROLE_PREPROVISIONED are intentionally
        # left unset so fabric_worker role provisioning is skipped; the
        # tenant_isolation policies under test still apply regardless.
        run: pnpm --filter @repo/database exec tsx ./scripts/apply-rls-direct.ts

      - name: Run the RLS-policy enforcement suite (non-superuser harness)
        env:
          RUN_DB_INTEGRATION: '1'
        run: |
          pnpm --filter @repo/database exec vitest run \
            __tests__/rls-isolation.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=rls-isolation-results.json

      - name: 'Guard: assert the RLS enforcement suite executed (exact count, zero skips)'
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          // 36 -> 37: Fizzy #1749 adds "Attachment retention minimum under RLS",
          // which pins that an RLS-scoped MIN() over `project` reads LARGER than
          // the true minimum — the hazard the purge's BYPASSRLS precondition
          // exists to avoid. Bumping this constant is the intended way to add a
          // case here; the exact pin is what forces the acknowledgement.
          // 37 -> 41: Fizzy #1850 (1C-3a) adds the publishing_chat_delivery
          // broadcast ledger, pinned in BOTH directions in org and personal
          // context. Both directions because that table has no recipient
          // column: the tenant XOR and the user_owned policy over it are the
          // whole of what separates one tenant's posted-message record from
          // another's. Measured before the registration landed, the two
          // positives already passed and only the two negatives failed —
          // which is the asymmetry that shows the negatives are reading the
          // policy rather than an empty table.
          const EXPECTED = 41;
          const j = JSON.parse(fs.readFileSync("packages/database/rls-isolation-results.json","utf8"));
          const files = j.testResults?.length ?? 0;
          const total = j.numTotalTests ?? 0;
          const passed = j.numPassedTests ?? 0;
          const skipped = (j.numSkippedTests ?? 0) + (j.numPendingTests ?? 0);
          const todo = j.numTodoTests ?? 0;
          console.log(`rls-isolation: ${files} file(s), total=${total} passed=${passed} skipped=${skipped} todo=${todo}`);
          if (files !== 1) { console.error("::error::expected exactly 1 test file"); process.exit(1); }
          if (skipped > 0) { console.error("::error::suite self-skipped — false pass"); process.exit(1); }
          if (todo > 0) { console.error("::error::a case is .todo — coverage silently dropped"); process.exit(1); }
          if (total !== EXPECTED || passed !== EXPECTED) {
            console.error(`::error::expected exactly ${EXPECTED} passing tests, got total=${total} passed=${passed}`);
            process.exit(1);
          }
          EOF

      - name: 'Guard: assert DATABASE_URL is a real, reachable Postgres'
        # Anti-false-pass pre-flight. hasReachableDatabaseUrl() (the same
        # predicate the exclusion suite gates on) rejects an unset URL and
        # the well-known unit-tests.yml placeholder
        # (postgresql://test:test@localhost:5432/test). Mirror that check
        # here plus a live pg_isready probe, so a misconfigured env can
        # never silently downgrade this job into skipping the suites while
        # still reporting green.
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL is unset — the DB-integration suites would self-skip and this job would be a false pass."
            exit 1
          fi
          if [[ "$DATABASE_URL" == "postgresql://test:test@localhost:5432/test" ]]; then
            echo "::error::DATABASE_URL is the unit-tests.yml placeholder — hasReachableDatabaseUrl() would return false and the exclusion suite would self-skip."
            exit 1
          fi
          if ! pg_isready -d "$DATABASE_URL" -t 5; then
            echo "::error::Postgres is not reachable at DATABASE_URL — cannot run DB-integration tests."
            exit 1
          fi
          echo "DATABASE_URL is real and reachable — guard passed."

      - name: Run the tenant-XOR suite against real Postgres
        # Runs the exclusion feature's tenant-isolation suite — create /
        # delete / list, [projectId, targetKey] idempotency, concurrency, and
        # XOR org-vs-personal scoping — against a real Postgres (it self-skips
        # on the unit-tests.yml placeholder URL; here it actually executes).
        # This validates the mechanism our feature relies on in production: the
        # API/worker use the BYPASSRLS base `db` with EXPLICIT tenant columns,
        # so query-level XOR is the enforced isolation boundary (RLS only bites
        # getTenantDb()/withRLSContext() paths). --passWithNoTests=false makes
        # "no test files matched" a hard failure, not a silent green pass.
        #
        # Separately, __tests__/rls-isolation.test.ts (the RLS-policy
        # ENFORCEMENT suite) runs in the dedicated "Run the RLS-policy
        # enforcement suite" step above. Its assertions require a connection
        # SUBJECT to RLS: setup fixtures are seeded on the privileged
        # `postgres` connection (which bypasses RLS), then each assertion drops
        # to the NOBYPASSRLS/NOSUPERUSER `fabric_rls_test` role via `SET LOCAL
        # ROLE` (see __tests__/_helpers/rls-role.ts), so the tenant_isolation
        # USING/WITH CHECK policies are actually enforced. The RLS policy is
        # applied above (apply-rls-direct.ts); the same suite also runs locally
        # via `pnpm --filter @repo/database test:rls` against a privileged
        # (superuser) dev DB — the outer connection must be able to SET ROLE.
        run: |
          pnpm --filter @repo/database exec vitest run \
            prisma/queries/projects/__tests__/daily-brief-exclusions.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=db-integration-results.json

      - name: Run the prompt integration suites (real Postgres)
        # Fizzy #2068. Every assertion here is one a mocked suite cannot make,
        # because the contract IS the SQL: whether the approval claim is really
        # a lock (two concurrent approvals must produce exactly ONE winner),
        # what a `jsonb` targets column hands back, and whether the reviewer
        # query selects the right people across two tables and two role fields.
        #
        # Verified by removing the `status: "PENDING"` guard from the claim and
        # watching this suite report `expected 2 to be 1` — both approvals won.
        #
        # The tier-resolution suite answers what the WHERE-clause tests cannot:
        # given these rows, which prompt does a user actually get. It also reads
        # the runtime resolver and the library badge from ONE set of rows, so the
        # two drifting apart fails here — that drift shipped once already.
        # Verified by disabling the personal-first branch: `expected 'USER' to be
        # 'ORG'`.
        run: |
          pnpm --filter @repo/database exec vitest run \
            __tests__/prompt-nominations.integration.test.ts \
            __tests__/prompt-tier-resolution.integration.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=prompt-nominations-results.json

      - name: 'Guard: assert the prompt integration suites executed (zero skips)'
        # The suite self-skips via `describe.skipIf(!hasReachableDatabaseUrl())`.
        # Without this check a drifting predicate would report a trivially green
        # 0-tests-run result and the step above would still succeed — the exact
        # false pass the sibling guards exist to prevent.
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const r = JSON.parse(
            fs.readFileSync("packages/database/prompt-nominations-results.json", "utf8"),
          );
          const skipped = r.numPendingTests ?? 0;
          const passed = r.numPassedTests ?? 0;
          if (skipped > 0) {
            console.error(`::error::${skipped} prompt integration test(s) skipped — the DB gate did not open.`);
            process.exit(1);
          }
          if (passed < 20) {
            console.error(`::error::expected at least 20 prompt integration tests, saw ${passed}.`);
            process.exit(1);
          }
          console.log(`prompt integration suites: ${passed} passed, 0 skipped`);
          EOF

      - name: 'Prompt notification delivery (api package, real Postgres)'
        # The staging rehearsal for Fizzy #2068 stopped one inch short: a
        # self-nomination wrote zero notification rows, and nothing
        # distinguished "pipeline broken" from "the nominator is deliberately
        # excluded". This suite pins that distinction against real rows —
        # recipient resolution excludes the actor, the bell row lands on the
        # tier admin with the AI summary in the snippet, the default-change
        # announce reaches org members with the catalog deep-link, and a
        # refired announce coalesces instead of doubling.
        run: |
          pnpm --filter @repo/api exec vitest run \
            modules/prompts/__tests__/prompt-notify-delivery.integration.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=prompt-notify-delivery-results.json

      - name: 'Guard: assert the delivery suite executed (zero skips)'
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const r = JSON.parse(
            fs.readFileSync("packages/api/prompt-notify-delivery-results.json", "utf8"),
          );
          const skipped = r.numPendingTests ?? 0;
          const passed = r.numPassedTests ?? 0;
          if (skipped > 0) {
            console.error(`::error::${skipped} delivery test(s) skipped — the DB gate did not open.`);
            process.exit(1);
          }
          if (passed < 5) {
            console.error(`::error::expected at least 5 delivery tests, saw ${passed}.`);
            process.exit(1);
          }
          console.log(`delivery suite: ${passed} passed, 0 skipped`);
          EOF

      - name: 'Guard: assert the XOR suite actually executed (zero skips)'
        # Post-hoc anti-false-pass check. `daily-brief-exclusions.test.ts`
        # self-skips via `describe.skipIf(!hasReachableDatabaseUrl())` — if
        # that predicate somehow evaluated false-negative (env drift,
        # future refactor, etc.) the suite would report a trivially green
        # 0-tests-run result and the previous step would still succeed.
        # Parse the JSON reporter output and fail if anything was skipped,
        # if the one file didn't run, or if fewer than 6 tests passed
        # (daily-brief-exclusions.test.ts has 6 cases; a shortfall means the
        # suite failed to collect or silently skipped part of its set).
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "packages/database/db-integration-results.json";
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          const files = report.testResults?.length ?? 0;
          const passed = report.numPassedTests ?? 0;
          const skipped =
            (report.numSkippedTests ?? 0) + (report.numPendingTests ?? 0);
          console.log(
            `db-integration results: ${files} file(s), ${passed} passed, ${skipped} skipped`,
          );
          if (files !== 1) {
            console.error(
              `::error::Expected exactly 1 test file (daily-brief-exclusions.test.ts) to run, got ${files}.`,
            );
            process.exit(1);
          }
          if (skipped > 0) {
            console.error(
              `::error::${skipped} test(s) were skipped — this means the suite self-skipped (e.g. hasReachableDatabaseUrl() returned false) instead of actually executing against Postgres. A green run here would be a false pass.`,
            );
            process.exit(1);
          }
          if (passed < 6) {
            console.error(
              `::error::Only ${passed} test(s) passed — expected at least 6 in daily-brief-exclusions.test.ts. This may indicate the suite failed to collect its full test set.`,
            );
            process.exit(1);
          }
          EOF

      - name: Run the last-edit clock suite against real Postgres
        env:
          RUN_DB_INTEGRATION: '1'
        # `last-edit-clock.integration.test.ts` is the only proof that seeding a
        # feature's Logic Summary moves Prisma's `@updatedAt` row clock while
        # leaving the semantic edit clock alone — the bug the whole
        # lastEditedAt column exists to fix. A mocked test cannot show it,
        # because the thing that moves `updatedAt` is Postgres applying
        # `@updatedAt` on a real write. It also pins the optimistic-concurrency
        # token: a write holding a pre-edit clock must match zero rows.
        run: |
          pnpm --filter @repo/database exec vitest run             prisma/queries/projects/__tests__/last-edit-clock.integration.test.ts             --passWithNoTests=false             --reporter=dot             --reporter=json --outputFile=last-edit-clock-results.json

      - name: 'Guard: assert the last-edit clock suite actually executed (zero skips)'
        # Same anti-false-pass shape as the XOR guard above: the file
        # self-skips via `describe.skipIf(!hasReachableDatabaseUrl())`, so a
        # green step proves nothing on its own.
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "packages/database/last-edit-clock-results.json";
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
          const files = report.testResults?.length ?? 0;
          const passed = report.numPassedTests ?? 0;
          const skipped =
            (report.numSkippedTests ?? 0) + (report.numPendingTests ?? 0);
          console.log(
            `last-edit-clock results: ${files} file(s), ${passed} passed, ${skipped} skipped`,
          );
          if (files !== 1) {
            console.error(
              `::error::Expected exactly 1 test file (last-edit-clock.integration.test.ts) to run, got ${files}.`,
            );
            process.exit(1);
          }
          if (skipped > 0) {
            console.error(
              `::error::${skipped} test(s) were skipped — the suite self-skipped instead of executing against Postgres, so a green run here would be a false pass.`,
            );
            process.exit(1);
          }
          // Bump this floor whenever the suite gains a test. A floor left
          // behind the real count still passes and quietly stops guarding
          // against a test being dropped.
          if (passed < 12) {
            console.error(
              `::error::Only ${passed} test(s) passed — expected at least 12. The suite failed to collect its full set.`,
            );
            process.exit(1);
          }
          EOF

      - name: Run the chat-delivery kind-partitioning suite against real Postgres
        env:
          RUN_DB_INTEGRATION: '1'
        # `chat-delivery-kind.integration.test.ts` is the real-Postgres proof
        # for the widened chat-delivery unique key (Fizzy #2203). The mocked
        # sibling `chat-delivery-kind.test.ts` only proves the queries are
        # BUILT right (kind appears in the where/data passed to Prisma); it
        # cannot prove what the real unique index and a real conditional
        # write do. This hits both: a CONTENT row and an APPROVAL row now
        # coexisting on one channel, per-kind dedup, and that markChatDelivery
        # / listChatDeliveriesForSend correctly scope by kind against real
        # rows. It also asserts the schema itself — that the legacy
        # (sendId, platform, externalTeamId, channelId) index really is gone
        # and the widened key is still enforcing — which is what keeps a green
        # coexistence result from being equally consistent with a weakened
        # assertion.
        run: |
          pnpm --filter @repo/database exec vitest run \
            prisma/queries/projects/__tests__/chat-delivery-kind.integration.test.ts \
            --passWithNoTests=false \
            --reporter=dot \
            --reporter=json --outputFile=chat-delivery-kind-results.json

      - name: 'Guard: assert the chat-delivery kind suite actually executed (zero skips)'
        # Same anti-false-pass shape as the guards above: the file self-skips
        # via `describe.skipIf(!hasReachableDatabaseUrl())`, so a green step
        # proves nothing on its own.
        run: |
          node <<'EOF'
          const fs = require("node:fs");
          const path = "packages/database/chat-delivery-kind-results.json";
          const report = JSON.parse(fs.readFileSync(path, "utf8"));
