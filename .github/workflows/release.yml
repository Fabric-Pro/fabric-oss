name: Release

# Canonical upstream branch is `master` (post-cutover). `main` is archived
# read-only — see COLLABORATION.md and docs/deployment.md § Branch cutover
# checklist.

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.repository == 'Fabric-Pro/fabric-oss'
    # Public repository only, so the standard runner is free; the job builds and
    # type-checks the nine client packages and finishes in a few minutes.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Leave NO credential in the git config. Nothing in this job pushes
          # with git's own credential: changesets/action creates the Version
          # PR's commit, the per-package tags and the GitHub releases through
          # the GitHub API as the release App (its `github-token` input, minted
          # below), and the deploy-tag push further down swaps the App
          # credential in per invocation. A persisted GITHUB_TOKEN header is
          # the one credential git would fall back to, and anything pushed
          # with it is done as github-actions and fires no downstream events —
          # a Version PR pushed that way carries no check runs.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      # No `registry-url` here ON PURPOSE: setting it makes setup-node write an
      # `_authToken=${NODE_AUTH_TOKEN}` line into .npmrc, and a leftover
      # empty-token auth line is known to break npm's trusted-publishing OIDC
      # path (actions/setup-node#1551). npm and changesets both default to
      # registry.npmjs.org, so nothing is lost by omitting it.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      # npm publishes via TRUSTED PUBLISHING (OIDC) — no npm token anywhere in
      # this workflow. The exchange is done by the npm CLI: this job's
      # `id-token: write` lets npm mint a workflow-identity token and swap it
      # at registry.npmjs.org for a short-lived publish credential, valid only
      # for packages whose npmjs.com "Trusted publisher" is configured as
      # (GitHub Actions, this repository, workflow file `release.yml`).
      # Consequences:
      #   - `release.yml` can never be RENAMED without repointing the trusted
      #     publisher config on all @fabricorg packages.
      #   - The chain is: changesets → `pnpm publish` → which shells out to
      #     `npm publish`. Node 22 bundles npm 10.x, but the OIDC exchange
      #     needs npm >= 11.5.1 — hence this upgrade step.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      # Persist Turbo's local cache (.turbo/cache) across runs (official
      # Turborepo CI recipe). Most master pushes don't touch @fabricorg/*,
      # so the build + type-check below become instant cache replays.
      # .turbo is gitignored, so the restored cache can never leak into the
      # commits/pushes changesets/action makes later in this job.
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm turbo build --filter="@fabricorg/*"

      - name: Type-check publishable packages
        run: pnpm turbo type-check --filter="@fabricorg/*"

      # The Version PR is opened, and its branch pushed, AS THE RELEASE APP —
      # never as GITHUB_TOKEN. Two reasons, both deliberate:
      # 1. This repository forbids Actions from creating pull requests
      #    ("GitHub Actions is not permitted to create or approve pull
      #    requests"). That setting stays OFF: turning it on would let every
      #    workflow's token approve pull requests and so satisfy master's
      #    review requirement by itself.
      # 2. A GITHUB_TOKEN push fires no pull_request events, so a Version PR
      #    pushed that way never gets check runs and can only be admin-merged.
      # The token is scoped to THIS repository and to exactly the two
      # permissions changesets/action needs (the App must grant Pull requests:
      # write, or this mint fails loudly). It is minted AFTER install/build so
      # third-party package scripts never coexist with it — only the repo's
      # own version/publish scripts do, which already run as master. It is
      # separate from the tag-step token below, which stays late and
      # contents-only. It reaches the action through its `github-token`
      # INPUT (see the step below) — not an env var.
      - name: Mint the Version-PR App token
        id: version-pr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # changesets/action v2 (pairs with Changesets CLI v3 — the action refuses
      # to run against CLI v2, and the CLI pin lives in the root package.json
      # and in changeset-check.yml; move all three together). Every input was
      # renamed in v2 and the OLD NAMES ARE HARD ERRORS, so do not "tidy" them
      # back: version-script / publish-script / commit-message / pr-title /
      # create-github-releases. The App token goes through the `github-token`
      # INPUT: v2 does not read a GITHUB_TOKEN env var as the token, and one
      # that disagrees with the input fails the step at startup, so the token
      # must not be repeated under `env:` either. The action itself exports
      # GITHUB_TOKEN (= github-token) into the publish script's environment.
      #
      # Release changes go through the GitHub API (v2's default,
      # `push-with-git-cli: false`): the Version PR commit, the per-package
      # tags and the GitHub releases are all created with the App token, so
      # they are attributed to the release App and signed by GitHub. No local
      # `git commit` runs at all, which is why the "unset core.hooksPath" step
      # that used to sit before this one is gone. The root `prepare` script
      # points core.hooksPath at .githooks, whose commit-msg hook requires a
      # DCO `Signed-off-by:` trailer that the bot's fixed `chore: release`
      # message cannot carry (dco.yml exempts this PR at the PR-creator level
      # instead). Under the git CLI that hook rejected the release commit, the
      # action failed before the version bump, no `v*.*.*` tag was pushed and
      # PRODUCTION QUIETLY STOPPED DEPLOYING. If `push-with-git-cli: true` is
      # ever set, the hooksPath unset must come back with it, immediately
      # before this step.
      #
      # Published-package detection: the action hands the publish script a
      # CHANGESETS_OUTPUT file path in its environment, and `changeset publish`
      # (CLI v3) appends one NDJSON `git-tag` event per package it published.
      # The variable is inherited through `pnpm release` → shell → `&&` →
      # `changeset publish` like any other, so the script needs nothing
      # extra — it only must not scrub its environment. If the file is
      # missing, a custom publish script makes the action WARN and create no
      # tags or releases; the positive control after this step turns that
      # into a failure.
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: release"
          pr-title: "chore: release"
          create-github-releases: true
          # The App token, not secrets.GITHUB_TOKEN — see the mint step above.
          github-token: ${{ steps.version-pr-token.outputs.token }}
        env:
          # npm reports WHY a trusted-publishing (OIDC) token exchange was
          # refused only at verbose level ("oidc Failed token exchange request
          # with body message: …" in lib/utils/oidc.js); at the default level
          # the publish just falls through to ENEEDAUTH with no reason, which
          # is what the first automated publish did (2026-09-02, run
          # 33578707540). Verbose costs some log noise on the nine `npm info`
          # calls; npm redacts credentials in its logs.
          NPM_CONFIG_LOGLEVEL: verbose
          # Auth is npm trusted publishing (OIDC) — see the npm-upgrade step
          # above. No NODE_AUTH_TOKEN / NPM_TOKEN on purpose; do not add one
          # back, a configured token would silently take precedence over the
          # OIDC exchange.
          #
          # Provenance is ON: the registry generates a Sigstore attestation for
          # every publish, tied to this workflow and commit. It requires the
          # source repository to be PUBLIC — the registry rejects provenance
          # from private repos with E422 "Only public source repositories are
          # supported" — so this line lands only once the repository is public.
          # If the repository ever goes private again, set the STRING "false".
          NPM_CONFIG_PROVENANCE: "true"

      # Positive control for the publish path. changesets/action v2 learns
      # what `changeset publish` released from the CHANGESETS_OUTPUT file, and
      # when that file is missing under a custom publish script it only warns:
      # the npm publish succeeds, this job goes green, and no
      # `<package>@<version>` tag or GitHub release is ever created. Make that
      # a failure instead: every public package whose version changed in this
      # exact master commit must have its tag on the remote once the step is
      # done. The tags are looked up, never created, so a re-run after a
      # partial failure passes as soon as they exist.
      - name: Verify published packages were tagged
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECKED=0
          MISSING=0
          while IFS= read -r -d '' MANIFEST; do
            # A removed package has nothing to publish.
            git cat-file -e "${GITHUB_SHA}:${MANIFEST}" 2>/dev/null || continue
            NAME=$(git show "${GITHUB_SHA}:${MANIFEST}" | jq -r '.name // empty')
            VERSION=$(git show "${GITHUB_SHA}:${MANIFEST}" | jq -r '.version // empty')
            PRIVATE=$(git show "${GITHUB_SHA}:${MANIFEST}" | jq -r '.private == true')
            [[ "$NAME" == @fabricorg/* && "$PRIVATE" == "false" && -n "$VERSION" ]] || continue
            if git cat-file -e "${GITHUB_SHA}^:${MANIFEST}" 2>/dev/null; then
              PREVIOUS=$(git show "${GITHUB_SHA}^:${MANIFEST}" | jq -r '.version // empty')
              [ "$PREVIOUS" != "$VERSION" ] || continue
            fi
            CHECKED=$((CHECKED + 1))
            TAG="${NAME}@${VERSION}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
              echo "Tag $TAG exists."
            else
              echo "::error::$NAME changed to $VERSION in ${GITHUB_SHA:0:7} but tag $TAG is not on the remote. changesets/action creates it from the CHANGESETS_OUTPUT file that 'changeset publish' writes — look for the output-file warning in the step above."
              MISSING=$((MISSING + 1))
            fi
          done < <(git diff --name-only -z "${GITHUB_SHA}^" "${GITHUB_SHA}" -- 'packages/*/package.json')
          echo "$CHECKED public package version change(s) checked, $MISSING missing tag(s)."
          [ "$MISSING" -eq 0 ]

      # A fresh repository has no v* tags yet. Tagging merely because the
      # current version has no corresponding tag would therefore publish the
      # seed itself on its first master push, even though no Version PR was
      # merged. Bind release tagging to the event that actually authorizes it:
      # packages/fabric-app/package.json changed version in this exact commit.
      # Read from GITHUB_SHA rather than the working tree because
      # changesets/action may have switched HEAD to its Version PR branch.
      - name: Detect fabric-app version release
        id: deploy-version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          export LC_ALL=C
          VERSION_PATH="packages/fabric-app/package.json"
          is_stable_semver() {
            [[ "$1" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          }
          semver_is_greater() {
            local newer_parts older_parts i newer older
            IFS=. read -r -a newer_parts <<< "$1"
            IFS=. read -r -a older_parts <<< "$2"
            for i in 0 1 2; do
              newer="${newer_parts[$i]}"
              older="${older_parts[$i]}"
              if [ "$newer" = "$older" ]; then
                continue
              fi
              if [ "${#newer}" -ne "${#older}" ]; then
                [ "${#newer}" -gt "${#older}" ]
                return
              fi
              [[ "$newer" > "$older" ]]
              return
            done
            return 1
          }

          if ! git cat-file -e "${GITHUB_SHA}:${VERSION_PATH}" 2>/dev/null; then
            echo "::error::${VERSION_PATH} is absent from the pushed master commit ${GITHUB_SHA}."
            exit 1
          fi

          VERSION=$(git show "${GITHUB_SHA}:${VERSION_PATH}" | jq -er '.version | select(type == "string" and length > 0)')
          if ! is_stable_semver "$VERSION"; then
            echo "::error::fabric-app version is not canonical stable semver (<major>.<minor>.<patch>). Refusing to create a tag that release-bom.yml cannot admit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! git cat-file -e "${GITHUB_SHA}^:${VERSION_PATH}" 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No parent version exists (initial seed or path introduction) — refusing to create a release tag."
            exit 0
          fi

          PREVIOUS_VERSION=$(git show "${GITHUB_SHA}^:${VERSION_PATH}" | jq -er '.version | select(type == "string" and length > 0)')
          if ! is_stable_semver "$PREVIOUS_VERSION"; then
            echo "::error::The parent fabric-app version is not canonical stable semver. Refusing an ambiguous release transition."
            exit 1
          fi
          echo "previous-version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "fabric-app remains at $VERSION — no release tag is authorized by this master push."
            exit 0
          fi

          if ! semver_is_greater "$VERSION" "$PREVIOUS_VERSION"; then
            echo "::error::fabric-app version moved backward from $PREVIOUS_VERSION to $VERSION. Refusing to create a release tag."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "fabric-app changed from $PREVIOUS_VERSION to $VERSION — release tagging is authorized."

      # Mint the App installation token, deliberately LATE — after
      # `pnpm install` / build / publish have already run — and scoped to THIS
      # repo only (an unscoped installation token would carry write access to
      # every repo the App is installed on, which this job never needs).
      # Minting late means the write-scoped credential never coexists with
      # dependency or build scripts, and the 1-hour App-token lifetime can't
      # expire before the tag push on a slow run. It is applied JUST-IN-TIME
      # to the one `git push` below as a per-invocation
      # `-c http.<host>.extraheader` override, never written to git config.
      # Checkout persists no credential at all (persist-credentials: false
      # above); pushing the tag as the App is what (a) triggers tag-driven
      # workflows (a GITHUB_TOKEN push never does) and (b) is honoured as the
      # `protect-v-tags` ruleset bypass actor. App needs Contents: write (and
      # Workflows: write if a release ever needs to tag across a
      # workflow-file change).
      - name: Mint GitHub App installation token
        id: release-app-token
        if: steps.deploy-version.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Auto-tag the fabric-app deploy tag (v<version>) after the Version PR
      # is merged. Changesets versions `fabric-app` but neither publishes nor
      # tags it (`privatePackages.tag: false` in .changeset/config.json), and
      # the `<name>@<version>` tags it does create for published packages do
      # NOT match the `v*.*.*` trigger pattern on
      # deploy-azure-container-apps.yml. This step reads the current
      # fabric-app version and pushes `v<version>` so the prod deploy fires.
      #
      # `published: true` is only set when a *public* npm package is published;
      # an app-only release (only fabric-app bumped) skips publish, so we don't
      # gate on it — we rely on the idempotent tag-exists check below.
      #
      # The push below swaps in the App credential just-in-time (minted in
      # the previous step), so the tag is authored by the App and DOES
      # trigger tag-driven workflows — a GITHUB_TOKEN push never would.
      - name: Auto-tag fabric-app deploy tag
        # Canonical branch is `master` (post-cutover); see header comment on
        # `on:` above.
        id: auto-tag
        if: steps.deploy-version.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          RELEASE_TOKEN: ${{ steps.release-app-token.outputs.token }}
          VERSION: ${{ steps.deploy-version.outputs.version }}
        run: |
          # Read the version and tag the commit from $GITHUB_SHA explicitly,
          # NOT from the working tree or HEAD. changesets/action's version
          # step mutates package.json in-place (bumping to the next version)
          # and switches HEAD to the changeset-release/* branch where it
          # committed the bump. Reading from disk would tag the wrong
          # version; tagging HEAD would tag the wrong commit.
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::GitHub App token was not minted — check that the RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY secrets are set and that the App is installed on this repo. See docs/deployment.md § Release Strategy."
            exit 1
          fi
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::The token action returned an invalid App slug: '${APP_SLUG:-<empty>}'. Refusing to create a tag with ambiguous identity."
            exit 1
          fi
          APP_LOGIN="${APP_SLUG}[bot]"
          APP_USER_ID=$(GH_TOKEN="$RELEASE_TOKEN" gh api "users/$APP_LOGIN" --jq '.id')
          if [[ ! "$APP_USER_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve the numeric bot user ID for $APP_LOGIN. Refusing to fall back to github-actions[bot] tag metadata."
            exit 1
          fi
          git config user.name "$APP_LOGIN"
          git config user.email "${APP_USER_ID}+${APP_LOGIN}@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG (auto-tagged from fabric-app version bump)"
          # Authenticate THIS push as the App without persisting the credential
          # in git config (so a compromised dependency postinstall could never
          # read it; install/build already ran above).
          #
          # Checkout now persists nothing (persist-credentials: false), but
          # the reset below is kept as belt and braces: actions/checkout@v7
          # used to leave its GITHUB_TOKEN credential as an
          # `http.<host>.extraheader` in an EXTERNAL file pulled in via
          # `includeIf.gitdir`, NOT in `.git/config`, so `git config --unset-all`
          # on the local config could not remove it (the prior bug: the
          # GITHUB_TOKEN header survived, we added the App header on top, and the
          # push sent two `Authorization` headers → "Duplicate header" / HTTP 400).
          #
          # Override per-invocation instead: `http.extraheader` is multi-valued
          # and an EMPTY value resets the whole list — so the first `-c` clears
          # every inherited header (including the includeIf'd GITHUB_TOKEN one)
          # and the second sets ONLY the App header. Pushing as the App is what
          # makes the tag trigger the prod deploy workflows. The value is masked.
          APP_AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)"
          echo "::add-mask::$APP_AUTH"
          git -c http.https://github.com/.extraheader= \
              -c http.https://github.com/.extraheader="$APP_AUTH" \
              push origin "$TAG"
          echo "Pushed $TAG at ${GITHUB_SHA:0:7} — release-artifacts.yml and release-bom.yml fire off this tag; the container images come from oss-snapshot-images.yml's run of this same commit on master."
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release with CHANGELOG section
        # Mirrors the just-pushed tag onto the GitHub Releases page so /releases
        # surfaces a scannable, dated release log with the full changelog for
        # the team. Only runs when the previous step actually created a new
        # tag (not the "already exists" no-op path).
        #
        # `changesets/action`'s `create-github-releases: true` never covers our
        # deploy meta-package: `fabric-app` is `"private": true`, and
        # `.changeset/config.json` opts private packages into versioning but
        # not tagging (`privatePackages.tag: false`), so changesets publishes
        # nothing for it and creates neither a tag nor a release. So we do it
        # here, extracting the just-published section from
        # `packages/fabric-app/CHANGELOG.md`.
        #
        # CREATED AS A DRAFT — open-sourcing plan §4.1, "artifacts first,
        # publish last". At this moment the release's bill of materials does
        # not exist: the tag was pushed seconds ago and the four workflows it
        # triggers have not built anything yet. `release-bom.yml` waits for
        # them, attaches `release-manifest.json`, verifies it, and only then
        # flips this release to published with `--latest`. So a failed or
        # partial build leaves a DRAFT and never a published release.
        #
        # Two consequences, spelled out because they are the point:
        #   - `client-delivery.yml` keys on `release: published`, so it now
        #     fires at the BOM publish gate instead of here. Client delivery
        #     is therefore later, and strictly downstream of a complete BOM.
        #   - the ops reconciler selects `draft == false` releases only, so an
        #     incomplete release is never admitted to the deploy ledger.
        # What is NOT affected: the four `push: tags: v*.*.*` deploy workflows
        # fire off the TAG, not the release, so a stuck draft does not block
        # the production rollout itself.
        #
        # `--latest` is deliberately not passed here: GitHub ignores
        # make_latest on a draft, and release-bom.yml applies it at publish.
        #
        # Uses the App token so `gh release create` can write Releases (the
        # App needs `contents: write` and `actions: write` on this repo).
        # release-bom.yml publishes with an App token too, for the same reason
        # that matters here: an action taken with GITHUB_TOKEN triggers no
        # further workflow runs, so a GITHUB_TOKEN publish would silently stop
        # `client-delivery.yml` from ever firing.
        if: steps.auto-tag.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          VERSION: ${{ steps.auto-tag.outputs.version }}
          TAG: ${{ steps.auto-tag.outputs.tag }}
        run: |
          # Extract the `## <VERSION>` section from CHANGELOG.md — everything
          # between that heading and the next `## <number>` heading. Read from
          # $GITHUB_SHA explicitly for the same reason the tag step does.
          NOTES=$(git show "${GITHUB_SHA}:packages/fabric-app/CHANGELOG.md" | \
            awk -v ver="## ${VERSION}" '
              $0 == ver { p = 1; next }
              p && /^## [0-9]/ { exit }
              p { print }
            ')
          if [ -z "$(echo "$NOTES" | tr -d "[:space:]")" ]; then
            echo "::warning::No CHANGELOG section found for ${VERSION} — creating an empty Release. Check packages/fabric-app/CHANGELOG.md."
            NOTES="See [\`packages/fabric-app/CHANGELOG.md\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/packages/fabric-app/CHANGELOG.md) for the full changelog."
          fi
          # Idempotency, and it now has to BRANCH on the draft flag rather
          # than just detect existence — "a draft is already waiting" and "a
          # release was already published" call for different messages and
          # mean different things about the §4.1 gate. `gh release view`
          # answers neither: it exits 0 for both. Its lookup is also
          # indirect for drafts (`releases/tags/{tag}` 404s, because a draft
          # carries no tag association, and gh falls back to listing), so ask
          # the list directly and read `.draft` off the answer.
          if ! RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                 --paginate --jq '.[] | {tag_name, draft, html_url}'); then
            echo "::error::Could not list releases to check whether $TAG already exists. Refusing to create one blindly — a second DRAFT for the same tag is possible (GitHub does not reject duplicate drafts), would not show on /releases, and would leave the §4.1 publish gate acting on the wrong object."
            exit 1
          fi
          EXISTING=$(printf '%s\n' "$RELEASES" | jq -s --arg t "$TAG" 'map(select(.tag_name == $t)) | first // empty')
          if [ -n "$EXISTING" ]; then
            if [ "$(printf '%s' "$EXISTING" | jq -r '.draft')" = "true" ]; then
              echo "GitHub Release $TAG already exists as a draft — leaving it for release-bom.yml to complete."
            else
              echo "::warning::GitHub Release $TAG already exists and is already PUBLISHED — not recreating it. If that was not a deliberate manual backfill, find out how it was published without the §4.1 BOM gate. See docs/deployment/release-bom.md."
            fi
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --draft
          echo "Created DRAFT GitHub Release $TAG at https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "release-bom.yml will assemble the release manifest, attach it, and publish this release."
