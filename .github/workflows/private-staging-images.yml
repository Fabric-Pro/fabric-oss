name: Private Staging Images

# Private-only staging artifacts. Packages must be provisioned private and
# linked to fabric-dev before activation. No Azure or production credentials.

on:
  push:
    branches: [staging, 'promotion/**']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact source SHA for pinned recovery builds
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Automatic staging pushes keep one running build and one replaceable pending
# build. A new push does not interrupt the running build, so merge bursts still
# produce complete snapshot evidence. Promotion and manual recovery builds use
# their own run-ID groups and cannot replace an automatic staging request.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'private-staging-images-auto-staging' || format('private-staging-images-pinned-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SNAPSHOT_NAMESPACE: ghcr.io/fabric-pro/fabric-dev-snapshots
  # BuildKit layer cache. It lives in the registry, in a namespace of its own,
  # rather than in the GitHub Actions cache: the fourteen mode=max caches
  # together are larger than the repository's 10 GB Actions cache budget, so
  # with the Actions-cache backend every master build evicted the Type Check / Unit Tests
  # caches that pull-request jobs depend on, and then lost its own blobs to the
  # same eviction (the index survived, the layers did not, and BuildKit rebuilt
  # from scratch after paying for the export). A registry cache has no shared
  # budget and keeps index and layers together. The namespace is separate so
  # the attested snapshot packages carry only full-SHA tags.
  CACHE_NAMESPACE: ghcr.io/fabric-pro/fabric-dev-buildcache
  # The image label that records a build's input fingerprint; see
  # .github/actions/oss-snapshot/snapshot-reuse.mjs.
  INPUTS_LABEL: pro.fabric.snapshot.inputs

jobs:
  policy-tests:
    name: Validate snapshot policy modules
    if: github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build-admission.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit exact source tree for snapshot builds
        id: build-admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "${EXPECTED_SHA:-}" || "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo 'pinned build source moved' >&2; exit 1; }
          BUILD=true
          if [[ "$EVENT_NAME" == push && "$SOURCE_REF" == refs/heads/promotion/* ]]; then
            # Trusted ops selects reuse or dispatches a complete fresh build.
            # A consumed release entry alone never authorizes automatic builds.
            BUILD=false
            [[ "$(git cat-file -t "$GITHUB_SHA:.changeset")" == tree ]] || exit 1
            PATHS="$RUNNER_TEMP/promotion-changeset-paths"
            git ls-tree -r -z --name-only "$GITHUB_SHA" -- .changeset >"$PATHS"
            while IFS= read -r -d '' path; do
              if [[ "$path" == .changeset/*.md && "${path##*/}" != README.md ]]; then
                BUILD=false
              fi
            done <"$PATHS"
          fi
          echo "build=$BUILD" >>"$GITHUB_OUTPUT"

      - name: Run focused Node tests
        run: node --test .github/actions/oss-snapshot/*manifest.test.mjs .github/actions/oss-snapshot/snapshot-reuse.test.mjs

  # Automatic staging pushes only: splits the 14 components into those to build
  # and those whose inputs are unchanged since the previous complete staging
  # snapshot. A reused component keeps that snapshot's digest and is attested
  # again for this SHA, so the set stays complete and every image passes the
  # same admission. Promotion and manual recovery builds rebuild all 14 as they
  # always have.
  plan:
    name: Plan component builds
    needs: policy-tests
    if: needs.policy-tests.outputs.build == 'true' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      REUSE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_count: ${{ steps.plan.outputs.build_count }}
      reuse: ${{ steps.plan.outputs.reuse }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GHCR
        if: env.REUSE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare each component with the previous snapshot
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MODULE=.github/actions/oss-snapshot/snapshot-reuse.mjs
          if [[ "$REUSE" == true ]]; then
            IMAGES="$RUNNER_TEMP/images.json"
            PREVIOUS="$RUNNER_TEMP/previous.json"
            # An external image that does not resolve is left out, which
            # rebuilds every component that pulls it.
            echo '{}' >"$IMAGES"
            while IFS= read -r image; do
              if digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest'); then
                jq --arg image "$image" --arg digest "$digest" '. + {($image): $digest}' "$IMAGES" >"$IMAGES.next"
                mv "$IMAGES.next" "$IMAGES"
              fi
            done < <(node "$MODULE" images --sha "$GITHUB_SHA")
            # A successful run proved its whole set in the aggregate job.
            echo '{}' >"$PREVIOUS"
            BRANCH=${GITHUB_REF#refs/heads/}
            RUN=$(gh api "repos/$REPOSITORY/actions/workflows/private-staging-images.yml/runs?branch=$BRANCH&status=success&per_page=20" \
              | jq -c --arg repo "$REPOSITORY" --arg branch "$BRANCH" --arg run "$RUN_ID" '
                  [.workflow_runs[] | select(.head_branch == $branch and .head_repository.full_name == $repo
                    and .path == ".github/workflows/private-staging-images.yml" and (.id | tostring) != $run)]
                  | sort_by(.created_at) | last // empty')
            if [[ -n "$RUN" ]]; then
              PREVIOUS_SHA=$(jq -r '.head_sha' <<<"$RUN")
              jq -n --arg sha "$PREVIOUS_SHA" --arg run "$(jq -r '.id' <<<"$RUN")" \
                '{sourceSha: $sha, run: $run, images: {}}' >"$PREVIOUS"
              for component in $(node "$MODULE" components); do
                # A tag that cannot be read rebuilds that component.
                if image=$(docker buildx imagetools inspect "$SNAPSHOT_NAMESPACE/$component:$PREVIOUS_SHA" --format '{{json .}}'); then
                  jq --arg component "$component" --argjson image "$image" \
                    '.images[$component] = {digest: $image.manifest.digest, labels: ($image.image.config.Labels // {}), created: $image.image.created}' \
                    "$PREVIOUS" >"$PREVIOUS.next"
                  mv "$PREVIOUS.next" "$PREVIOUS"
                fi
              done
            fi
            PLAN=$(node "$MODULE" plan --reuse true --sha "$GITHUB_SHA" --images "$IMAGES" --previous "$PREVIOUS")
          else
            PLAN=$(node "$MODULE" plan --reuse false)
          fi
          {
            echo "build=$(jq -c '{include: .build}' <<<"$PLAN")"
            echo "build_count=$(jq '.build | length' <<<"$PLAN")"
            echo "reuse=$(jq -c '{include: .reuse}' <<<"$PLAN")"
            echo "reuse_count=$(jq '.reuse | length' <<<"$PLAN")"
          } >>"$GITHUB_OUTPUT"
          {
            echo '| Component | Plan |'
            echo '|---|---|'
            jq -r '(.reuse[] | "| `\(.component)` | reuse `\(.digest)` from `\(.reusedSourceSha)` |"),
                   (.build[] | "| `\(.component)` | build: \(.reason) |")' <<<"$PLAN"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build and attest ${{ matrix.component }}
    needs: [policy-tests, plan]
    if: needs.policy-tests.outputs.build == 'true' && needs.plan.outputs.build_count != '0' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      IMAGE_NAME: ghcr.io/fabric-pro/fabric-dev-snapshots/${{ matrix.component }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact source checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GITHUB_SHA is not a full commit SHA"; exit 1; }
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$ACTUAL_SHA" == "$GITHUB_SHA" ]] \
            || { echo "::error::checkout is $ACTUAL_SHA, expected $GITHUB_SHA"; exit 1; }

      # The hosted runner's root disk can run out while an image rebuilds its
      # dependency layer (any lockfile change) and exports its cache, as
      # data-analyst did with "No space left on device". These preinstalled
      # toolchains are not used by this job.
      - name: Free runner disk for the image build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify private package identity and visibility
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          PRIVATE_STAGING_PACKAGE_BINDINGS: ${{ vars.PRIVATE_STAGING_PACKAGE_BINDINGS }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          # Both published images and intermediate layer caches must remain private.
          for namespace in fabric-dev-snapshots fabric-dev-buildcache; do
            PACKAGE=$(gh api "orgs/Fabric-Pro/packages/container/${namespace}%2F${COMPONENT}")
            node .github/actions/oss-snapshot/package-registry-manifest.mjs \
              "${namespace}/${COMPONENT}" <<<"$PACKAGE"
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full-SHA snapshot
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # On automatic staging pushes, the inputs label lets a later push
          # reuse this digest while its inputs stay the same. Other builds have
          # no inputs, and the blank line adds no label.
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ matrix.inputs != '' && format('{0}={1}', env.INPUTS_LABEL, matrix.inputs) || '' }}
          # GitHub's attestation actions below own both predicates. Disabling
          # BuildKit predicates avoids a second, differently shaped claim.
          provenance: false
          sbom: false
          # One mutable cache tag per component (see CACHE_NAMESPACE above). A
          # missing cache is a cold build, not a failure; overlapping master
          # runs overwrite each other's export, which costs cache freshness and
          # nothing else; and ignore-error keeps a cache push problem from
          # failing a build whose image is already pushed.
          # The env context is only available to steps, not to a job's env
          # block, so the per-component ref is assembled here.
          cache-from: type=registry,ref=${{ env.CACHE_NAMESPACE }}/${{ matrix.component }}:staging
          cache-to: type=registry,ref=${{ env.CACHE_NAMESPACE }}/${{ matrix.component }}:staging,mode=max,ignore-error=true

      - name: Reclaim BuildKit space before SBOM scan
        run: docker buildx prune --all --force

      - name: Generate SPDX SBOM from pushed digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Supplying registry credentials makes this pinned action invoke
          # Syft's registry provider directly. Without them, its automatic
          # Docker-first selection can duplicate a large image in the daemon
          # and exhaust a standard runner before registry fallback.
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
          upload-release-assets: false
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.component }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify source- and workflow-bound attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
        run: |
          set -euo pipefail
          COMMON_ARGS=(
            --repo "$REPOSITORY"
            --signer-workflow "$SIGNER_WORKFLOW"
            --source-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" "${COMMON_ARGS[@]}"
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
            "${COMMON_ARGS[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Emit manifest fragment
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DIGEST: ${{ steps.build.outputs.digest }}
          INPUTS: ${{ matrix.inputs }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build returned an invalid digest: $DIGEST"; exit 1; }
          jq -n \
            --arg component "$COMPONENT" \
            --arg dockerfile "$DOCKERFILE" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg inputs "$INPUTS" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg sourceRepository "$REPOSITORY" \
            --arg buildWorkflow "$WORKFLOW_REF" \
            --arg signerWorkflow "$SIGNER_WORKFLOW" \
            --arg sourceUrl "$SOURCE_URL" \
            '{
              schemaVersion: "1.0.0",
              component: $component,
              dockerfile: $dockerfile,
              context: ".",
              image: $image,
              tag: $tag,
              digest: $digest,
              sourceSha: $sourceSha,
              sourceRef: $sourceRef,
              sourceRepository: $sourceRepository,
              buildWorkflow: $buildWorkflow,
              signerWorkflow: $signerWorkflow,
              labels: {
                "org.opencontainers.image.source": $sourceUrl,
                "org.opencontainers.image.revision": $sourceSha
              },
              attestations: {
                provenance: "https://slsa.dev/provenance/v1",
                sbom: "https://spdx.dev/Document/v2.3"
              }
            } + (if $inputs == "" then {} else {inputs: $inputs} end)' > "${COMPONENT}.manifest.json"

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-part-${{ matrix.component }}
          path: |
            ${{ matrix.component }}.manifest.json
            ${{ matrix.component }}.spdx.json
          if-no-files-found: error
          # This artifact only transports evidence to the aggregate job. The
          # complete evidence artifact below retains the same files for 90 days.
          retention-days: 1

  reuse:
    name: Reuse and attest ${{ matrix.component }}
    needs: [policy-tests, plan]
    if: needs.policy-tests.outputs.build == 'true' && needs.plan.outputs.reuse_count != '0' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reuse) }}
    env:
      IMAGE_NAME: ghcr.io/fabric-pro/fabric-dev-snapshots/${{ matrix.component }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GITHUB_SHA is not a full commit SHA"; exit 1; }
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$ACTUAL_SHA" == "$GITHUB_SHA" ]] \
            || { echo "::error::checkout is $ACTUAL_SHA, expected $GITHUB_SHA"; exit 1; }

      - name: Verify private package identity and visibility
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          PRIVATE_STAGING_PACKAGE_BINDINGS: ${{ vars.PRIVATE_STAGING_PACKAGE_BINDINGS }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          for namespace in fabric-dev-snapshots fabric-dev-buildcache; do
            PACKAGE=$(gh api "orgs/Fabric-Pro/packages/container/${namespace}%2F${COMPONENT}")
            node .github/actions/oss-snapshot/package-registry-manifest.mjs \
              "${namespace}/${COMPONENT}" <<<"$PACKAGE"
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a digest that ops admission already accepted for the previous SHA
      # is reused: the same verification, bound to that SHA. Its image is
      # unchanged, so its verified SBOM is carried forward unchanged.
      - name: Verify the reused snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ matrix.digest }}
          INPUTS: ${{ matrix.inputs }}
          REUSED_SHA: ${{ matrix.reusedSourceSha }}
          REUSED_RUN: ${{ matrix.reusedRun }}
          BUILT_SHA: ${{ matrix.builtSourceSha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$REUSED_SHA" =~ ^[0-9a-f]{40}$ && "$BUILT_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::malformed reuse plan"; exit 1; }
          COMMON_ARGS=(
            --bundle-from-oci
            --repo "$REPOSITORY"
            --signer-workflow "$SIGNER_WORKFLOW"
            --source-digest "$REUSED_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" "${COMMON_ARGS[@]}" >/dev/null
          # Compact: the worker's SBOM pretty-printed exceeds the 16 MiB
          # attestation limit that the original file stays under.
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" "${COMMON_ARGS[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3 --format json \
            | jq -ce '.[0].verificationResult.statement.predicate' >"${COMPONENT}.spdx.json"
          IMAGE=$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}" --format '{{json .}}')
          jq -e --arg digest "$DIGEST" --arg label "$INPUTS_LABEL" --arg inputs "$INPUTS" --arg built "$BUILT_SHA" '
              .manifest.digest == $digest
              and .image.config.Labels[$label] == $inputs
              and .image.config.Labels["org.opencontainers.image.revision"] == $built' <<<"$IMAGE" >/dev/null \
            || { echo "::error::${IMAGE_NAME}@${DIGEST} does not carry the planned inputs"; exit 1; }
          jq -n --arg image "$IMAGE_NAME" --arg digest "$DIGEST" --arg inputs "$INPUTS" \
            --arg reusedSourceSha "$REUSED_SHA" --arg reusedRun "$REUSED_RUN" --arg builtSourceSha "$BUILT_SHA" \
            '$ARGS.named' >reused.json
          node .github/actions/oss-snapshot/snapshot-reuse.mjs provenance --reused "$(cat reused.json)" >provenance.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ matrix.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: provenance.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ matrix.digest }}
          sbom-path: ${{ matrix.component }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      # Tagged only after both attestations exist. Admission waits for a tag
      # that is not there yet, but would refuse a tagged digest whose only
      # attestations name the previous SHA.
      - name: Tag the reused digest with the full SHA
        env:
          DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}@${DIGEST}"
          TAGGED=$(docker buildx imagetools inspect "${IMAGE_NAME}:${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$TAGGED" == "$DIGEST" ]] \
            || { echo "::error::${IMAGE_NAME}:${GITHUB_SHA} resolves to $TAGGED, expected $DIGEST"; exit 1; }

      - name: Verify source- and workflow-bound attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ matrix.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Exactly the arguments ops admission uses, including registry-held
          # bundles: the digest now also carries the reused run's attestations.
          COMMON_ARGS=(
            --bundle-from-oci
            --repo "$REPOSITORY"
            --signer-workflow "$SIGNER_WORKFLOW"
            --source-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" "${COMMON_ARGS[@]}"
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
            "${COMMON_ARGS[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Emit manifest fragment
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DIGEST: ${{ matrix.digest }}
          INPUTS: ${{ matrix.inputs }}
          REUSED_SHA: ${{ matrix.reusedSourceSha }}
          REUSED_RUN: ${{ matrix.reusedRun }}
          BUILT_SHA: ${{ matrix.builtSourceSha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          jq -n \
            --arg component "$COMPONENT" \
            --arg dockerfile "$DOCKERFILE" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg inputs "$INPUTS" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg sourceRepository "$REPOSITORY" \
            --arg buildWorkflow "$WORKFLOW_REF" \
            --arg signerWorkflow "$SIGNER_WORKFLOW" \
            --arg sourceUrl "$SOURCE_URL" \
            --arg reusedSha "$REUSED_SHA" \
            --arg reusedRun "$REUSED_RUN" \
            --arg builtSha "$BUILT_SHA" \
            '{
              schemaVersion: "1.0.0",
              component: $component,
              dockerfile: $dockerfile,
              context: ".",
              image: $image,
              tag: $tag,
              digest: $digest,
              inputs: $inputs,
              sourceSha: $sourceSha,
              sourceRef: $sourceRef,
              sourceRepository: $sourceRepository,
              buildWorkflow: $buildWorkflow,
              signerWorkflow: $signerWorkflow,
              labels: {
                "org.opencontainers.image.source": $sourceUrl,
                "org.opencontainers.image.revision": $builtSha
              },
              attestations: {
                provenance: "https://slsa.dev/provenance/v1",
                sbom: "https://spdx.dev/Document/v2.3"
              },
              reuse: {
                reusedFromSourceSha: $reusedSha,
                reusedFromRun: $reusedRun,
                builtFromSourceSha: $builtSha
              }
            }' > "${COMPONENT}.manifest.json"

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-part-${{ matrix.component }}
          path: |
            ${{ matrix.component }}.manifest.json
            ${{ matrix.component }}.spdx.json
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Validate and aggregate all snapshots
    needs: [policy-tests, plan, build, reuse]
    # Runs when either matrix was skipped as empty; the validator still
    # requires all 14 fragments, so a missing component fails here.
    if: >-
      !cancelled() && needs.policy-tests.outputs.build == 'true' && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
      && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true'
      && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download all component evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oss-snapshot-part-*
          path: snapshot-parts
          merge-multiple: true

      - name: Validate and assemble the snapshot manifest
        run: |
          node .github/actions/oss-snapshot/private-staging-manifest.mjs \
            --directory snapshot-parts \
            --output oss-snapshot-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --server-url "$GITHUB_SERVER_URL"

      - name: Upload complete snapshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-manifest-${{ github.sha }}
          path: |
            oss-snapshot-manifest.json
            snapshot-parts/*.manifest.json
            snapshot-parts/*.spdx.json
          if-no-files-found: error
          retention-days: 90
