name: Private Staging Images

# Private-only staging artifacts. Packages must be provisioned private and
# linked to fabric-dev before activation. No Azure or production credentials.

on:
  push:
    branches: [staging, 'promotion/**']
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact source SHA for pinned recovery builds
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Automatic staging pushes keep one running build and one replaceable pending
# build. A new push does not interrupt the running build, so merge bursts still
# produce complete snapshot evidence. Promotion and manual recovery builds use
# their own run-ID groups and cannot replace an automatic staging request.
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'private-staging-images-auto-staging' || format('private-staging-images-pinned-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  SNAPSHOT_NAMESPACE: ghcr.io/fabric-pro/fabric-dev-snapshots
  # BuildKit layer cache. It lives in the registry, in a namespace of its own,
  # rather than in the GitHub Actions cache: the fourteen mode=max caches
  # together are larger than the repository's 10 GB Actions cache budget, so
  # with the Actions-cache backend every master build evicted the Type Check / Unit Tests
  # caches that pull-request jobs depend on, and then lost its own blobs to the
  # same eviction (the index survived, the layers did not, and BuildKit rebuilt
  # from scratch after paying for the export). A registry cache has no shared
  # budget and keeps index and layers together. The namespace is separate so
  # the attested snapshot packages carry only full-SHA tags.
  CACHE_NAMESPACE: ghcr.io/fabric-pro/fabric-dev-buildcache
  # The image label that records a build's input fingerprint; see
  # .github/actions/oss-snapshot/snapshot-reuse.mjs.
  INPUTS_LABEL: pro.fabric.snapshot.inputs
  # Reused components per reuse job; see the reuse job.
  REUSE_SLOTS: 4

jobs:
  policy-tests:
    name: Validate snapshot policy modules
    if: github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build-admission.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit exact source tree for snapshot builds
        id: build-admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "${EXPECTED_SHA:-}" || "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo 'pinned build source moved' >&2; exit 1; }
          BUILD=true
          if [[ "$EVENT_NAME" == push && "$SOURCE_REF" == refs/heads/promotion/* ]]; then
            # Trusted ops selects reuse or dispatches a complete fresh build.
            # A consumed release entry alone never authorizes automatic builds.
            BUILD=false
            [[ "$(git cat-file -t "$GITHUB_SHA:.changeset")" == tree ]] || exit 1
            PATHS="$RUNNER_TEMP/promotion-changeset-paths"
            git ls-tree -r -z --name-only "$GITHUB_SHA" -- .changeset >"$PATHS"
            while IFS= read -r -d '' path; do
              if [[ "$path" == .changeset/*.md && "${path##*/}" != README.md ]]; then
                BUILD=false
              fi
            done <"$PATHS"
          fi
          echo "build=$BUILD" >>"$GITHUB_OUTPUT"

      - name: Run focused Node tests
        run: node --test .github/actions/oss-snapshot/*manifest.test.mjs .github/actions/oss-snapshot/snapshot-reuse.test.mjs

  # Automatic staging pushes only: splits the 14 components into those to build
  # and those whose inputs are unchanged since the previous complete staging
  # snapshot. A reused component keeps that snapshot's digest and is attested
  # again for this SHA, so the set stays complete and every image passes the
  # same admission. Promotion and manual recovery builds rebuild all 14 as they
  # always have.
  plan:
    name: Plan component builds
    needs: policy-tests
    if: needs.policy-tests.outputs.build == 'true' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      REUSE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
    outputs:
      build: ${{ steps.plan.outputs.build }}
      build_count: ${{ steps.plan.outputs.build_count }}
      reuse: ${{ steps.plan.outputs.reuse }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Log in to GHCR
        if: env.REUSE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare each component with the previous snapshot
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          MODULE=.github/actions/oss-snapshot/snapshot-reuse.mjs
          if [[ "$REUSE" == true ]]; then
            IMAGES="$RUNNER_TEMP/images.json"
            PREVIOUS="$RUNNER_TEMP/previous.json"
            # An external image that does not resolve is left out, which
            # rebuilds every component that pulls it.
            echo '{}' >"$IMAGES"
            while IFS= read -r image; do
              if digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest'); then
                jq --arg image "$image" --arg digest "$digest" '. + {($image): $digest}' "$IMAGES" >"$IMAGES.next"
                mv "$IMAGES.next" "$IMAGES"
              fi
            done < <(node "$MODULE" images --sha "$GITHUB_SHA")
            # A successful run proved its whole set in the aggregate job.
            echo '{}' >"$PREVIOUS"
            BRANCH=${GITHUB_REF#refs/heads/}
            RUN=$(gh api "repos/$REPOSITORY/actions/workflows/private-staging-images.yml/runs?branch=$BRANCH&status=success&per_page=20" \
              | jq -c --arg repo "$REPOSITORY" --arg branch "$BRANCH" --arg run "$RUN_ID" '
                  [.workflow_runs[] | select(.head_branch == $branch and .head_repository.full_name == $repo
                    and .path == ".github/workflows/private-staging-images.yml" and (.id | tostring) != $run)]
                  | sort_by(.created_at) | last // empty')
            if [[ -n "$RUN" ]]; then
              PREVIOUS_SHA=$(jq -r '.head_sha' <<<"$RUN")
              INSPECTED="$RUNNER_TEMP/inspected"
              mkdir -p "$INSPECTED"
              # All tags at once. A tag that cannot be read rebuilds that
              # component.
              for component in $(node "$MODULE" components); do
                docker buildx imagetools inspect "$SNAPSHOT_NAMESPACE/$component:$PREVIOUS_SHA" --format '{{json .}}' \
                  >"$INSPECTED/$component.json" || rm -f "$INSPECTED/$component.json" &
              done
              wait
              shopt -s nullglob
              jq -n --arg sha "$PREVIOUS_SHA" --arg run "$(jq -r '.id' <<<"$RUN")" '
                  {sourceSha: $sha, run: $run, images: (reduce inputs as $image ({};
                    .[input_filename | split("/") | last | rtrimstr(".json")] =
                      {digest: $image.manifest.digest, labels: ($image.image.config.Labels // {}), created: $image.image.created}))}' \
                "$INSPECTED"/*.json </dev/null >"$PREVIOUS"
            fi
            PLAN=$(node "$MODULE" plan --reuse true --sha "$GITHUB_SHA" --images "$IMAGES" --previous "$PREVIOUS")
          else
            PLAN=$(node "$MODULE" plan --reuse false)
          fi
          # Reused components go to the reuse job in chunks of REUSE_SLOTS.
          {
            echo "build=$(jq -c '{include: .build}' <<<"$PLAN")"
            echo "build_count=$(jq '.build | length' <<<"$PLAN")"
            echo "reuse=$(jq -c --argjson slots "$REUSE_SLOTS" '{include: [.reuse | range(0; length; $slots) as $start
                | .[$start:$start + $slots] | {chunk: ($start / $slots + 1), names: (map(.component) | join(", ")), components: .}]}' <<<"$PLAN")"
            echo "reuse_count=$(jq '.reuse | length' <<<"$PLAN")"
          } >>"$GITHUB_OUTPUT"
          {
            echo '| Component | Plan |'
            echo '|---|---|'
            jq -r '(.reuse[] | "| `\(.component)` | reuse `\(.digest)` from `\(.reusedSourceSha)` |"),
                   (.build[] | "| `\(.component)` | build: \(.reason) |")' <<<"$PLAN"
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: Build and attest ${{ matrix.component }}
    needs: [policy-tests, plan]
    if: needs.policy-tests.outputs.build == 'true' && needs.plan.outputs.build_count != '0' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    # Automatic staging pushes build on the GitHub-hosted 8-core x64 runner:
    # the build and SBOM scan are faster and its disk needs no reclaim (see
    # the first step). It costs more per run; the owner chose delivery speed
    # on 2026-10-23 (the contract test records the measurement). Promotion and
    # manual recovery builds keep the standard runner.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' && 'ubuntu-8core' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      IMAGE_NAME: ghcr.io/fabric-pro/fabric-dev-snapshots/${{ matrix.component }}
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      # Above the standard runner's 31 GB after a reclaim, so that runner keeps
      # reclaiming and pruning exactly as before.
      MIN_FREE_GB: 40
    steps:
      # The standard runner's root disk can run out while an image rebuilds its
      # dependency layer (any lockfile change) and exports its cache, as
      # data-analyst did with "No space left on device". These preinstalled
      # toolchains are not used by this job; removing them takes free space
      # from about 13 GB to about 31 GB.
      #
      # Unlinking them is slow (50-255 s per job in October 2026) and used to
      # block every step after it. It now starts first, one `rm` per directory
      # in parallel, in the background, while checkout, Buildx setup, the
      # package checks and the GHCR login run. "Wait for runner disk reclaim"
      # then blocks the build until every removal has finished, so the build
      # still starts with exactly the free space it had before. The runner
      # only reaps background processes when the job ends, not between steps.
      #
      # It runs only below MIN_FREE_GB. The standard runner (13 GB) always
      # reclaims, as before; the 8-core runner had 371 GB free in every
      # measured job, including full dependency-layer rebuilds, and skips it.
      - name: Start freeing runner disk for the image build
        run: |
          set -euo pipefail
          df -h /
          reclaim="$RUNNER_TEMP/disk-reclaim"
          mkdir -p "$reclaim"
          free=$(df --output=avail -B1G / | tail -1)
          if (( free >= MIN_FREE_GB )); then
            echo "${free// /} GB free, at least $MIN_FREE_GB GB: nothing to reclaim" >"$reclaim/log"
            echo 0 >"$reclaim/status"
            exit 0
          fi
          nohup bash -c '
            pids=()
            for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
              (
                start=$SECONDS
                status=0
                sudo rm -rf "$dir" || status=$?
                echo "$dir: exit $status after $((SECONDS - start))s"
                exit "$status"
              ) &
              pids+=("$!")
            done
            status=0
            for pid in "${pids[@]}"; do
              wait "$pid" || status=1
            done
            echo "$status" >"$1/status.partial"
            mv "$1/status.partial" "$1/status"
          ' disk-reclaim "$reclaim" </dev/null >"$reclaim/log" 2>&1 &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact source checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GITHUB_SHA is not a full commit SHA"; exit 1; }
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$ACTUAL_SHA" == "$GITHUB_SHA" ]] \
            || { echo "::error::checkout is $ACTUAL_SHA, expected $GITHUB_SHA"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify private package identity and visibility
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          PRIVATE_STAGING_PACKAGE_BINDINGS: ${{ vars.PRIVATE_STAGING_PACKAGE_BINDINGS }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          # Both published images and intermediate layer caches must remain private.
          for namespace in fabric-dev-snapshots fabric-dev-buildcache; do
            PACKAGE=$(gh api "orgs/Fabric-Pro/packages/container/${namespace}%2F${COMPONENT}")
            node .github/actions/oss-snapshot/package-registry-manifest.mjs \
              "${namespace}/${COMPONENT}" <<<"$PACKAGE"
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build must not start before the disk is reclaimed (see the first
      # step). A failed removal fails the job, as it did when it ran inline.
      - name: Wait for runner disk reclaim
        timeout-minutes: 10
        run: |
          set -euo pipefail
          reclaim="$RUNNER_TEMP/disk-reclaim"
          until [[ -f "$reclaim/status" ]]; do
            sleep 2
          done
          cat "$reclaim/log"
          df -h /
          if [[ "$(cat "$reclaim/status")" != "0" ]]; then
            echo "::error::Freeing runner disk failed; see the removal log above."
            exit 1
          fi

      - name: Build and push full-SHA snapshot
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # On automatic staging pushes, the inputs label lets a later push
          # reuse this digest while its inputs stay the same. Other builds have
          # no inputs, and the blank line adds no label.
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ matrix.inputs != '' && format('{0}={1}', env.INPUTS_LABEL, matrix.inputs) || '' }}
          # GitHub's attestation actions below own both predicates. Disabling
          # BuildKit predicates avoids a second, differently shaped claim.
          provenance: false
          sbom: false
          # One mutable cache tag per component (see CACHE_NAMESPACE above). A
          # missing cache is a cold build, not a failure; overlapping master
          # runs overwrite each other's export, which costs cache freshness and
          # nothing else; and ignore-error keeps a cache push problem from
          # failing a build whose image is already pushed.
          # The env context is only available to steps, not to a job's env
          # block, so the per-component ref is assembled here.
          cache-from: type=registry,ref=${{ env.CACHE_NAMESPACE }}/${{ matrix.component }}:staging
          cache-to: type=registry,ref=${{ env.CACHE_NAMESPACE }}/${{ matrix.component }}:staging,mode=max,ignore-error=true

      # `df` records what the build left free: the evidence any later change
      # to the disk reclaim above should be sized against. Syft reads the
      # pushed image onto the same disk, so a runner below MIN_FREE_GB prunes.
      - name: Reclaim BuildKit space before SBOM scan
        run: |
          set -euo pipefail
          df -h /
          if (( $(df --output=avail -B1G / | tail -1) < MIN_FREE_GB )); then
            docker buildx prune --all --force
          fi

      - name: Generate SPDX SBOM from pushed digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          # Supplying registry credentials makes this pinned action invoke
          # Syft's registry provider directly. Without them, its automatic
          # Docker-first selection can duplicate a large image in the daemon
          # and exhaust a standard runner before registry fallback.
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
          upload-release-assets: false
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM must describe the digest both attestations name. Syft records
      # the SHA-256 of the manifest it read as the checksum of the package the
      # document DESCRIBES, so any other subject fails before anything is
      # attested.
      - name: Verify the SBOM describes the built digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build returned an invalid digest: $DIGEST"; exit 1; }
          jq -e --arg hex "${DIGEST#sha256:}" '
              [.relationships[]? | select(.spdxElementId == "SPDXRef-DOCUMENT" and .relationshipType == "DESCRIBES")
                | .relatedSpdxElement] as $roots
              | ($roots | length) == 1
                and ([.packages[]? | select(.SPDXID == $roots[0]) | .checksums[]? | select(.algorithm == "SHA256")
                      | .checksumValue] == [$hex])' "${COMPONENT}.spdx.json" >/dev/null \
            || { echo "::error::${COMPONENT}.spdx.json does not describe ${IMAGE_NAME}@${DIGEST}"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.component }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify source- and workflow-bound attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
        run: |
          set -euo pipefail
          COMMON_ARGS=(
            --repo "$REPOSITORY"
            --signer-workflow "$SIGNER_WORKFLOW"
            --source-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
          )
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" "${COMMON_ARGS[@]}"
          gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" \
            "${COMMON_ARGS[@]}" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Emit manifest fragment
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DIGEST: ${{ steps.build.outputs.digest }}
          INPUTS: ${{ matrix.inputs }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::build returned an invalid digest: $DIGEST"; exit 1; }
          jq -n \
            --arg component "$COMPONENT" \
            --arg dockerfile "$DOCKERFILE" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg inputs "$INPUTS" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg sourceRef "$GITHUB_REF" \
            --arg sourceRepository "$REPOSITORY" \
            --arg buildWorkflow "$WORKFLOW_REF" \
            --arg signerWorkflow "$SIGNER_WORKFLOW" \
            --arg sourceUrl "$SOURCE_URL" \
            '{
              schemaVersion: "1.0.0",
              component: $component,
              dockerfile: $dockerfile,
              context: ".",
              image: $image,
              tag: $tag,
              digest: $digest,
              sourceSha: $sourceSha,
              sourceRef: $sourceRef,
              sourceRepository: $sourceRepository,
              buildWorkflow: $buildWorkflow,
              signerWorkflow: $signerWorkflow,
              labels: {
                "org.opencontainers.image.source": $sourceUrl,
                "org.opencontainers.image.revision": $sourceSha
              },
              attestations: {
                provenance: "https://slsa.dev/provenance/v1",
                sbom: "https://spdx.dev/Document/v2.3"
              }
            } + (if $inputs == "" then {} else {inputs: $inputs} end)' > "${COMPONENT}.manifest.json"

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-part-${{ matrix.component }}
          path: |
            ${{ matrix.component }}.manifest.json
            ${{ matrix.component }}.spdx.json
          if-no-files-found: error
          # This artifact only transports evidence to the aggregate job. The
          # complete evidence artifact below retains the same files for 90 days.
          retention-days: 1

  # One job per chunk of up to REUSE_SLOTS reused components, rather than one
  # per component: each of those spent about a minute and was billed two. The
  # per-component checks are unchanged and run for every component at once
  # (.github/actions/oss-snapshot/reuse-snapshots.sh); a component that fails
  # fails its job and the run, and is named in the job, step and error.
  # Attestation is still one action call per subject, so those steps are
  # written out once per slot, and the chunk size keeps the job short.
  reuse:
    name: Reuse and attest ${{ matrix.names }}
    needs: [policy-tests, plan]
    if: needs.policy-tests.outputs.build == 'true' && needs.plan.outputs.reuse_count != '0' && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reuse) }}
    env:
      REUSED: ${{ toJSON(matrix.components) }}
      EVIDENCE_DIR: reused-evidence
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/private-staging-images.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::GITHUB_SHA is not a full commit SHA"; exit 1; }
          ACTUAL_SHA=$(git rev-parse HEAD)
          [[ "$ACTUAL_SHA" == "$GITHUB_SHA" ]] \
            || { echo "::error::checkout is $ACTUAL_SHA, expected $GITHUB_SHA"; exit 1; }

      - name: Verify private package identity and visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_STAGING_PACKAGE_BINDINGS: ${{ vars.PRIVATE_STAGING_PACKAGE_BINDINGS }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          COMPONENTS=$(jq -er '.[].component' <<<"$REUSED")
          for COMPONENT in $COMPONENTS; do
            for namespace in fabric-dev-snapshots fabric-dev-buildcache; do
              PACKAGE=$(gh api "orgs/Fabric-Pro/packages/container/${namespace}%2F${COMPONENT}")
              node .github/actions/oss-snapshot/package-registry-manifest.mjs \
                "${namespace}/${COMPONENT}" <<<"$PACKAGE"
            done
          done

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only a digest that ops admission already accepted for the previous SHA
      # is reused: the same verification, bound to that SHA. Its image is
      # unchanged, so its verified SBOM is carried forward unchanged. Nothing
      # is attested unless every component in the job verified.
      - name: Verify the reused snapshots
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/actions/oss-snapshot/reuse-snapshots.sh verify

      # An attestation action takes one subject, so each slot has its own pair
      # of steps; the verify step refuses more components than slots.
      - name: Attest build provenance for ${{ steps.verify.outputs.component_0 }}
        if: steps.verify.outputs.digest_0 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_0 }}
          subject-digest: ${{ steps.verify.outputs.digest_0 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.verify.outputs.provenance_0 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM for ${{ steps.verify.outputs.component_0 }}
        if: steps.verify.outputs.digest_0 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_0 }}
          subject-digest: ${{ steps.verify.outputs.digest_0 }}
          sbom-path: ${{ steps.verify.outputs.sbom_0 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance for ${{ steps.verify.outputs.component_1 }}
        if: steps.verify.outputs.digest_1 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_1 }}
          subject-digest: ${{ steps.verify.outputs.digest_1 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.verify.outputs.provenance_1 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM for ${{ steps.verify.outputs.component_1 }}
        if: steps.verify.outputs.digest_1 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_1 }}
          subject-digest: ${{ steps.verify.outputs.digest_1 }}
          sbom-path: ${{ steps.verify.outputs.sbom_1 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance for ${{ steps.verify.outputs.component_2 }}
        if: steps.verify.outputs.digest_2 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_2 }}
          subject-digest: ${{ steps.verify.outputs.digest_2 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.verify.outputs.provenance_2 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM for ${{ steps.verify.outputs.component_2 }}
        if: steps.verify.outputs.digest_2 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_2 }}
          subject-digest: ${{ steps.verify.outputs.digest_2 }}
          sbom-path: ${{ steps.verify.outputs.sbom_2 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance for ${{ steps.verify.outputs.component_3 }}
        if: steps.verify.outputs.digest_3 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_3 }}
          subject-digest: ${{ steps.verify.outputs.digest_3 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.verify.outputs.provenance_3 }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM for ${{ steps.verify.outputs.component_3 }}
        if: steps.verify.outputs.digest_3 != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.verify.outputs.image_3 }}
          subject-digest: ${{ steps.verify.outputs.digest_3 }}
          sbom-path: ${{ steps.verify.outputs.sbom_3 }}
          push-to-registry: true
          create-storage-record: false

      # Tagged only after both attestations exist. Admission waits for a tag
      # that is not there yet, but would refuse a tagged digest whose only
      # attestations name the previous SHA. Each tag is then verified with
      # exactly admission's arguments and its manifest fragment written.
      - name: Tag the reused digests with the full SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: bash .github/actions/oss-snapshot/reuse-snapshots.sh publish

      - name: Upload component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-part-reused-${{ matrix.chunk }}
          path: ${{ env.EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Validate and aggregate all snapshots
    needs: [policy-tests, plan, build, reuse]
    # Runs when either matrix was skipped as empty; the validator still
    # requires all 14 fragments, so a missing component fails here.
    if: >-
      !cancelled() && needs.policy-tests.outputs.build == 'true' && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
      && github.repository == 'Fabric-Pro/fabric-dev' && vars.STAGING_RELEASE_ENABLED == 'true'
      && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/promotion/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download all component evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: oss-snapshot-part-*
          path: snapshot-parts
          merge-multiple: true

      - name: Validate and assemble the snapshot manifest
        run: |
          node .github/actions/oss-snapshot/private-staging-manifest.mjs \
            --directory snapshot-parts \
            --output oss-snapshot-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --server-url "$GITHUB_SERVER_URL"

      - name: Upload complete snapshot evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oss-snapshot-manifest-${{ github.sha }}
          path: |
            oss-snapshot-manifest.json
            snapshot-parts/*.manifest.json
            snapshot-parts/*.spdx.json
          if-no-files-found: error
          retention-days: 90
