name: Unit Tests

# Runs Vitest unit tests on every PR to the upstream canonical branch
# (`master` — see docs/deployment.md § Branch cutover checklist).
#
# WHERE THIS RUNS — the public mirror, not the private staging repo.
# Every job below carries `github.repository != 'Fabric-Pro/fabric-dev'`,
# the same guard shape knip.yml uses: it names the staging repo rather than
# allow-listing one mirror, so any other copy of this tree still runs the
# suite. Three reasons, in order of weight:
#
#   * Cost. GitHub gives PUBLIC repositories unlimited free standard runners
#     at 4 CPU / 16 GB. Larger runners are billed everywhere, and the private
#     staging repo has no free tier at all — so running the identical commit
#     in both repos paid twice for one verdict.
#   * The relay gate treats a job skipped by a job-level `if:` as passing, so
#     skipping here cannot wedge a staging PR. (A workflow filtered out by
#     `on.paths` would instead leave a required check pending forever — do
#     NOT "simplify" this guard into a trigger filter.)
#   * The mirror's own `unit-tests` check is the authority: nothing lands
#     publicly without it, and the two masters are kept ref-equal, so a green
#     verdict there is a green verdict for the staging commit it came from.
#
# `workflow_dispatch` is exempt from the guard on every job, so the whole
# pipeline — detector, planner, shards, aggregate — can still be exercised in
# the staging repo before a change to this file lands.
#
# Branch-protection note: this workflow always runs on PRs to the canonical
# branch so the `unit-tests` status check is reported on every PR. The
# expensive shards only run when test-relevant files actually change and the
# plan resolves to at least one package; for all other PRs the aggregate job
# returns success immediately. That is what lets the check be safely required.
#
# Scoping: `turbo run test --filter=...[origin/<base>]` only executes packages
# affected by the diff against the PR's base branch (and their dependents) per
# Turbo's dependency graph. workflow_dispatch plans the full sweep with no
# filter — use it to validate tooling changes that don't show up as code diffs.
#
# SHARDING. A 4-core runner must give each package four cores (see the tuning
# history below), which means one Turbo task at a time — a serial sweep of the
# whole monorepo. So the sweep is split across several free standard runners
# instead: the `plan` job resolves the affected package set and buckets it,
# and `vitest` fans out over that bucketing. Buckets, deterministic so a
# re-run reproduces them exactly:
#
#   @repo/web       2 shards, via Vitest's own `--shard=N/2` file splitting
#   @repo/api       1 shard
#   @repo/temporal  1 shard
#   everything else 1 "rest" shard, 2 when more than 15 packages land in it
#
# Those three are the heavy packages (~1758 test files between them, each
# `vitest run`); the other ~33 are small. A bucket only exists when the plan
# actually contains its package, so a PR touching one leaf package runs one
# short shard rather than six.
#
# Vitest shard args reach the suite as Turbo pass-through (`-- --shard=1/2`),
# and Turbo folds pass-through args into the task hash, so the two web shards
# get distinct cache entries and cannot alias each other. The same hashing
# means a shard carrying pass-through args also re-keys the `generate` task it
# depends on and therefore misses the master-warmed Prisma entry: the two web
# shards pay one Prisma generate each (~77s, in parallel with the other
# shards). Measured, deliberate, and cheap against a serial sweep — do not
# "fix" it by dropping the pass-through, which would make both web shards run
# the whole suite.
#
# Security: this workflow does not interpolate any user-controlled fields
# (PR title, body, branch name, commit message, etc.) into run: blocks.
# Only github.event_name, github.repository and the plan job's computed
# matrix are referenced in expressions. The matrix is derived from the PR
# checkout (Turbo reads the package graph the PR defines), so its values are
# PR-controlled data; they reach the shell only through environment
# variables, quoted, and become `--filter=` arguments, never shell code.
#
# Pushes to master run a cache-warming job, not the tests: GitHub only lets a
# run restore caches saved on its own branch or on the base branch, so a PR's
# first run finds a warm pnpm store and Turbo cache only if a run on master
# saved one. Nothing did before this trigger existed, and the one-shot relay
# PRs in the public repo never get a second push, so they paid for a cold pnpm
# install and a cold Prisma generate on every run. Running the suite on master
# would warm nothing extra — a PR only executes packages affected by its diff,
# whose test hashes differ from master's by definition — so the master run
# stops after `generate`.

on:
  pull_request:
    # Canonical upstream branch is `master` (post-cutover); see
    # docs/deployment.md § Branch cutover checklist.
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter uses the Pulls API on PR events.
  pull-requests: read
  # The aggregate job lists this run's jobs to name the shard that failed.
  actions: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; master pushes are not. The master
  # run exists to seed the cache (see header), and a cancelled run saves
  # nothing — two PRs landing minutes apart cancelled the first cold sweep
  # before it could save, and would again on every busy afternoon. Without
  # cancellation GitHub keeps one master run in flight and one pending,
  # so the newest push still runs; it just waits for the sweep before it.
  # (workflow_dispatch runs are not cancelled either, which is what a
  # manual full sweep wants.)
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  changes:
    name: Detect changed paths
    # Not needed for the cache-warming run on master (see header), and not
    # run in the staging repo at all except on workflow_dispatch.
    if: >-
      github.event_name != 'push' &&
      (github.repository != 'Fabric-Pro/fabric-dev' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # On pull_request events dorny/paths-filter detects changed files via
      # the Pulls API (the `pull-requests: read` permission above) and does
      # not need the repo on disk. Checkout is only required for the
      # git-based detection used on workflow_dispatch runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            code:
              # Source and test files across the monorepo.
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              # Translation bundles. No glob above covers a .json here, yet
              # several suites read them as their subject: the mail template
              # guard (packages/mail/emails/template-i18n-coverage.test.ts)
              # and apps/web's i18n drift tests all import en.json directly.
              # A copy edit adding an ICU placeholder to a string a template
              # calls param-free breaks the email at runtime and is invisible
              # to tsc — without this entry that PR touches no other path,
              # skips vitest, and reports green.
              - 'packages/i18n/translations/**'
              # Configuration that affects test execution.
              - '**/vitest.config.*'
              - '**/vitest.setup.*'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'packages/database/prisma/schema.prisma'
              - '.github/workflows/unit-tests.yml'

  # Resolves the set of packages whose `test` task Turbo would actually run,
  # and buckets it into shards (see SHARDING in the header).
  #
  # This job installs nothing: `pnpm dlx turbo@<pinned>` fetches the CLI into
  # the pnpm store and Turbo reads the workspace graph straight from the
  # package.json files on disk, so the plan is ready in well under a minute
  # instead of behind a full `pnpm install`. `--dry-run=json` lists every task
  # in scope including the ones with no script, which surface as the literal
  # command `<NONEXISTENT>` and are dropped below.
  plan:
    name: Plan shards
    needs: changes
    if: >-
      (github.repository != 'Fabric-Pro/fabric-dev' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so Turbo's `[origin/<base>]` filter can resolve the
          # merge base and compute affected packages. With a shallow checkout
          # the filter silently falls back to running everything.
          fetch-depth: 0

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # No `cache: 'pnpm'` on purpose: this job never installs, so it has
          # no store to save, and a save here would race the shards' own.

      # BASE_REF is `github.base_ref` (the PR's target branch name) and is
      # empty on non-PR events, which the EVENT_NAME check guards. The
      # branching is done in shell rather than in a `${{ }}` template so the
      # run: block contains no expression interpolation.
      - name: Compute shard matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Pin the planner to the exact Turbo the shards will install: the
          # version pnpm resolved for the root importer in the lockfile, not
          # the caret floor in package.json, which a lockfile refresh can
          # leave behind. Fail loudly if the lockfile shape ever changes so
          # the planner and the shards can never drift apart silently.
          TURBO_VERSION="$(node -e '
            const lock = require("node:fs").readFileSync("pnpm-lock.yaml", "utf8");
            const m = lock.match(/\n {6}turbo:\n {8}specifier: [^\n]+\n {8}version: ([0-9][^\s(]*)/);
            if (!m) { console.error("turbo version not found in pnpm-lock.yaml importers"); process.exit(1); }
            process.stdout.write(m[1]);
          ')"
          echo "Planning with turbo@${TURBO_VERSION}"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pnpm dlx "turbo@${TURBO_VERSION}" run test \
              --filter="...[origin/${BASE_REF}]" --dry-run=json > turbo-plan.json
          else
            pnpm dlx "turbo@${TURBO_VERSION}" run test --dry-run=json > turbo-plan.json
          fi

          node <<'NODE'
          const fs = require("node:fs");

          // Packages Turbo would actually execute: `test` tasks that have a
          // real script. Everything else in the dry run is graph padding.
          const plan = JSON.parse(fs.readFileSync("turbo-plan.json", "utf8"));
          const packages = [
            ...new Set(
              (plan.tasks || [])
                .filter(
                  (t) =>
                    t.task === "test" &&
                    t.command &&
                    t.command !== "<NONEXISTENT>",
                )
                .map((t) => t.package),
            ),
          ].sort();

          // Heavy packages get dedicated runners; @repo/web is split further
          // by Vitest's own file sharding. Keep this table and the SHARDING
          // note in the header in step.
          const HEAVY = [
            ["@repo/web", 2],
            ["@repo/api", 1],
            ["@repo/temporal", 1],
          ];
          // Above this many small packages the rest bucket is split in two.
          const REST_SPLIT_ABOVE = 15;

          const shards = [];
          for (const [pkg, count] of HEAVY) {
            if (!packages.includes(pkg)) continue;
            if (count === 1) {
              shards.push({ name: pkg, packages: pkg, passthrough: "" });
              continue;
            }
            for (let i = 1; i <= count; i++) {
              shards.push({
                name: `${pkg} ${i}/${count}`,
                packages: pkg,
                passthrough: `--shard=${i}/${count}`,
              });
            }
          }

          const heavyNames = HEAVY.map(([pkg]) => pkg);
          const rest = packages.filter((p) => !heavyNames.includes(p));
          const chunks =
            rest.length === 0
              ? []
              : rest.length > REST_SPLIT_ABOVE
                ? [
                    rest.slice(0, Math.ceil(rest.length / 2)),
                    rest.slice(Math.ceil(rest.length / 2)),
                  ]
                : [rest];
          chunks.forEach((chunk, i) => {
            shards.push({
              name:
                chunks.length > 1 ? `rest ${i + 1}/${chunks.length}` : "rest",
              packages: chunk.join(" "),
              passthrough: "",
            });
          });

          // The two cross-cutting checks (tenant isolation, Prisma zod
          // barrel) are repo-wide, not per-package, so exactly one shard
          // carries them. The rest shard when there is one — it is the
          // cheapest — otherwise the first shard in the plan.
          const primary = Math.max(
            shards.findIndex((s) => s.name.startsWith("rest")),
            0,
          );
          shards.forEach((s, i) => {
            s.checks = i === primary ? "true" : "false";
          });

          for (const s of shards) {
            console.log(
              `shard ${s.name}: ${s.packages}${s.passthrough ? ` ${s.passthrough}` : ""}${s.checks === "true" ? " (+repo-wide checks)" : ""}`,
            );
          }
          if (shards.length === 0) {
            console.log(
              "No affected package has a test script — nothing to shard.",
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({ include: shards })}\n` +
              `has_shards=${shards.length > 0 ? "true" : "false"}\n`,
          );
          NODE

  vitest:
    name: Vitest (${{ matrix.name }})
    needs: plan
    # No `always()`/`!cancelled()`: the implicit success() on `needs` is what
    # keeps the shards from starting when the plan failed, and the plan is
    # itself skipped on push and on PRs with no code changes.
    if: >-
      (github.repository != 'Fabric-Pro/fabric-dev' ||
       github.event_name == 'workflow_dispatch') &&
      needs.plan.outputs.has_shards == 'true'
    strategy:
      # Every shard reports independently; one red package must not hide the
      # state of the others, which is the whole point of splitting them up.
      fail-fast: false
      # No max-parallel: shards are free on a public repo and the wall clock
      # is the entire reason this job is a matrix.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    #
    # RUNNER AND CONCURRENCY — settled, please read before changing either.
    #
    # This monorepo's per-test timeouts were calibrated with roughly four
    # cores per package. On the free 4-core standard runner that means ONE
    # Turbo task at a time; TURBO_CONCURRENCY 2 would halve each package's
    # allocation and start tripping the same timeouts documented below.
    # Parallelism comes from the shard matrix instead, where every shard is
    # its own 4-core box.
    #
    # The measurements that pinned "four cores per package", from when this
    # job still ran the whole sweep on one large runner:
    #
    #   8-core -> 16-core, against a workflow_dispatch control on master
    #   (`Run unit tests` = 616s, job 670s):
    #     step 616s -> 365s (-41%), job 670s -> 414s (-38%), 36/36 clean.
    #     apps/web 530s -> 221s, @repo/api 440s -> 207s,
    #     @repo/temporal 400s -> 200s — all three roughly halve and end up
    #     balanced, which is what you expect when the constraint was CPU.
    #
    #   --concurrency 4 -> 6 and 12    aborted    @repo/rag times out at 15s
    #                                             under the extra load and
    #                                             turbo kills the run, at
    #                                             BOTH values. The control at
    #                                             4 completes 36/36; 6 and 12
    #                                             stop at 25/36 and 29/36.
    #
    # So 4 was never a conservative cap, it was the ceiling, and starving a
    # package below four cores is what makes the suite flaky rather than slow.
    #
    # Also settled, and not worth another round: vitest maxWorkers 1 -> "50%"
    # (645s -> 617s, parallelism 0.9x -> 3.5x, no wall-clock gain); a
    # node/jsdom environment split (616s -> 621s; `environment` itself fell
    # 938s -> 686s and the wall clock did not move); pool: "threads" (249s ->
    # 415s locally, a jsdom realm per thread, 67% slower); deps.optimizer (-21s
    # locally, 24 files failed, breaks module mocking).
    #
    # Turbo caching cannot help a PR either, and this is structural rather
    # than a cold cache: PR runs DO restore a master-scoped entry and still
    # report `0 cached`, because the filter scopes the run to AFFECTED
    # packages and affected means hash-changed by definition. A `36 cached >>>
    # FULL TURBO` replay only happens re-running an identical SHA. (Dependency
    # source changes do propagate into dependents' hashes — verified by
    # hashing @repo/api#test before and after a one-line edit to
    # packages/database — so there is no false-green hazard here either.)
    #
    # The one config-only lever with a real payoff is `isolate: false` on
    # apps/web. Measured on the full suite: 268s -> 133s, a clean 2x, because
    # `setup` collapses 584s -> 39s and `import` 1840s -> 1033s when 766 files
    # stop each paying for their own fork. It is not landable as-is — it fails
    # 49 files / 228 tests on cross-file contamination (leaked vi.fn call
    # counts, a missing `fetch` global, stale mock registries, jsdom "Not
    # implemented").
    #
    # An earlier revision of this note called that blast radius "enumerable and
    # clustered" and suggested repairing the 49. THAT WAS WRONG, and the
    # correction is the useful part: the failing set is NOT stable. Quarantining
    # those 49 into their own isolate:true project (so the other ~717 shared a
    # fork) dropped the suite to 77s and surfaced 27 DIFFERENT failing files;
    # re-running that same config unchanged then gave 23, differing from the
    # first by 48 entries, with different test counts collected (8797 vs 8826).
    #
    # So there is no fixed list to repair — contamination varies with whatever
    # grouping the scheduler happens to pick, and a quarantine list chases a
    # moving target. Shipping isolate:false here, wholesale or selective, buys
    # roughly 2x in exchange for a nondeterministically red CI. Do not take that
    # trade without first making the tests hermetic, which is open-ended work
    # rather than the bounded job it looks like.
    #
    # The obvious config-level repair was then tried and is NOT sufficient.
    # apps/web sets none of vitest's mock-hygiene options — vitest.setup.ts only
    # calls RTL's cleanup() — so `clearMocks` + `unstubGlobals` + `unstubEnvs`
    # alongside isolate:false looked like the systematic fix. It moved the
    # failure count barely (49 files -> 43) and did nothing for the instability:
    # two identical runs with those options gave 43 and 45 failing files sharing
    # only THREE files in common, 82 entries apart. Which files break is close to
    # random once the fork is shared, so the contamination is not mock state and
    # not a list — it is the suite's general reliance on per-file process
    # isolation. Making it hermetic means auditing all ~766 files.
    #
    # @repo/temporal was measured the same way and is also NOT a candidate —
    # `--no-isolate` fails 8 files / 69 tests there.
    #
    # Runner labels: larger runners are billed on public repositories too, and
    # a label that does not exist leaves a job queued for 24 hours rather than
    # failing, so this job stays on `ubuntu-latest` — free and unlimited here
    # at 4 CPU / 16 GB. The private staging repo used to run the same sweep on
    # a paid 16-core arm64 label; it no longer runs this workflow at all (see
    # the header), so no job in this file needs a provisioned label.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholder so @repo/database's prisma singleton, which throws at
      # module load when DATABASE_URL is unset, can initialize. Tests that
      # touch the DB mock it; this URL is never connected to.
      #
      # Job-level, not on the test step alone: both variables are in
      # turbo.json's `globalEnv`, so they feed every task hash. When only
      # the test step set them, the `generate` the barrel check below ran
      # and the `generate` the test run depended on hashed differently and
      # Prisma generated twice (~77s each).
      DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
      DIRECT_URL: 'postgresql://test:test@localhost:5432/test'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Shallow is enough here: the `plan` job already resolved the
          # affected set against the merge base, and a shard addresses its
          # packages by name, so nothing in this job walks history.
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # Persist Turbo's local cache (.turbo/cache) across runs — the
      # official Turborepo GitHub Actions recipe. Re-pushes to a PR (and
      # rebases) replay cached results for packages whose inputs didn't
      # change instead of re-running their tests; only genuinely affected
      # packages execute. The SHA-suffixed key never repeats, so every run
      # restores the newest cache for this branch (falling back to the base
      # branch) via restore-keys and saves its own snapshot. Correctness is
      # unchanged: Turbo's cache keys hash each package's inputs (sources,
      # deps, lockfile, task env) — the same semantics local `turbo test`
      # already relies on.
      #
      # The key is deliberately NOT shard-scoped. Turbo cache entries are
      # keyed per task hash, so every shard restoring the same snapshot gets
      # exactly the entries that apply to it and ignores the rest; what the
      # shards want from this cache is the `generate` entry master warmed.
      # Saving is the part that overlaps — the first shard to finish reserves
      # the key and the others log "Unable to reserve cache with key …" and
      # move on. That warning is expected, not a failure.
      #
      # The key carries a `vitest` segment because the SHA alone is not
      # unique across workflows: in the public mirror release.yml saves its
      # own `.turbo` under `<os>-turbo-<sha>` on the same push to master,
      # and a cache key can be reserved once — the first warming run on
      # master lost that race and master kept release.yml's near-empty entry
      # instead of the generate warm. type-check.yml namespaces its key the
      # same way.
      #
      # No generic `<os>-turbo-` fallback: GitHub tries every restore key
      # in the PR's own scope before it looks at master, so a fallback that
      # broad would hand a PR its own type-check entry ahead of the master
      # vitest entry this job actually wants.
      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vitest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-vitest-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: fail PRs that introduce Prisma queries without explicit
      # organizationId coercion (tenant-isolation foot-gun). It is a
      # cross-cutting security check rather than a per-package one, so it runs
      # on exactly one shard (see the planner's `checks` flag) — running it on
      # all of them would just repeat the same verdict.
      - name: Tenant isolation check
        if: matrix.checks == 'true'
        # Invoked directly (not via an npm script) to keep root package.json
        # unchanged — adding a script entry trips the security workflow's
        # `deps changed` path filter and forces a full pnpm audit run.
        run: pnpm exec tsx scripts/tenant-isolation-check.ts

      # packages/database/prisma/zod/index.ts is tracked source that must be
      # committed exactly as the patching pipeline (`pnpm --filter
      # @repo/database generate`) writes it. Raw `prisma generate` output,
      # which `prisma migrate dev` also writes, keeps `z.instanceof(
      # Prisma.Decimal, ...)` sites that throw "Prisma is not defined"
      # wherever the committed file is loaded without regenerating first.
      # That form has reached master three times, and the `test` run below
      # cannot catch it: its `generate` dependency repairs the file on disk,
      # or restores the repaired barrel from the turbo cache, before any
      # suite, including the barrel's own integrity test, reads it. So run
      # the generate task first and fail if the result differs from what is
      # committed. Also repo-wide, so also on one shard only.
      - name: Committed Prisma zod barrel matches the generate pipeline
        if: matrix.checks == 'true'
        run: |
          pnpm turbo run generate --filter=@repo/database
          if ! git diff --exit-code --stat -- packages/database/prisma/zod; then
            echo "::error::packages/database/prisma/zod is not the output of 'pnpm --filter @repo/database generate'. Run it and commit the result; never commit raw 'prisma generate' output."
            exit 1
          fi

      # `^generate` runs as a `test` task dependency in turbo.json, so
      # @repo/database (Prisma client + Zod schemas) is generated before any
      # package's tests execute.
      #
      # The shard's packages arrive as a space-separated list and become one
      # explicit `--filter=<pkg>` per package: the affected set was already
      # resolved by the `plan` job, so re-deriving it here from the merge base
      # would be both redundant and a second chance to disagree with the plan.
      # SHARD_PASSTHROUGH is a single Vitest flag or empty, and an empty one
      # must not be forwarded — `-- ""` reaches vitest as an empty argument.
      - name: Run unit tests
        env:
          SHARD_PACKAGES: ${{ matrix.packages }}
          SHARD_PASSTHROUGH: ${{ matrix.passthrough }}
          # One Turbo task at a time: on a 4-core runner that is what gives
          # each package the four cores its per-test timeouts were calibrated
          # for (see the note above runs-on).
          TURBO_CONCURRENCY: '1'
        run: |
          set -euo pipefail
          read -r -a shard_packages <<< "$SHARD_PACKAGES"
          filters=()
          for pkg in "${shard_packages[@]}"; do
            filters+=("--filter=$pkg")
          done
          if [[ -n "$SHARD_PASSTHROUGH" ]]; then
            pnpm turbo run test --concurrency="$TURBO_CONCURRENCY" "${filters[@]}" -- "$SHARD_PASSTHROUGH"
          else
            pnpm turbo run test --concurrency="$TURBO_CONCURRENCY" "${filters[@]}"
          fi

  # Seeds the caches a relay PR's one and only run restores (see header).
  # Installs and generates; runs no tests, so it takes minutes rather than
  # the sweep's wall clock. Not run in the staging repo: nothing there
  # restores these caches any more. workflow_dispatch needs no exemption
  # here — a dispatch is never a push, so this job is not part of the manual
  # validation path.
  warm-caches:
    name: Warm caches
    if: >-
      github.event_name == 'push' &&
      github.repository != 'Fabric-Pro/fabric-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same placeholders as the shards, and job-level for the same reason:
      # both are in turbo.json's `globalEnv`, so a mismatch here would make
      # the warmed `generate` entry unreachable from the shards.
      DATABASE_URL: 'postgresql://test:test@localhost:5432/test'
      DIRECT_URL: 'postgresql://test:test@localhost:5432/test'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vitest-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-vitest-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same generate + barrel comparison the primary shard runs on PRs.
      # Here it doubles as the cache warm: it is the last thing this run does
      # before the Turbo cache is saved.
      - name: Committed Prisma zod barrel matches the generate pipeline
        run: |
          pnpm turbo run generate --filter=@repo/database
          if ! git diff --exit-code --stat -- packages/database/prisma/zod; then
            echo "::error::packages/database/prisma/zod is not the output of 'pnpm --filter @repo/database generate'. Run it and commit the result; never commit raw 'prisma generate' output."
            exit 1
          fi

  # Stable status check name reported on every PR to the canonical branch
  # (`master`). Configure this as the required check in branch protection —
  # not the `vitest` shards, whose names and count depend on what the PR
  # touched, and which are conditionally skipped altogether.
  unit-tests:
    name: unit-tests
    needs: [changes, plan, vitest]
    # Not on push: the master run warms caches and runs no tests, so it has
    # no verdict to report (and `changes` is skipped there, which the
    # fail-closed check below would otherwise flag). Skipped entirely in the
    # staging repo, where a skipped job is what the relay gate expects.
    if: >-
      always() && github.event_name != 'push' &&
      (github.repository != 'Fabric-Pro/fabric-dev' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      CODE_CHANGED: ${{ needs.changes.outputs.code }}
      PLAN_RESULT: ${{ needs.plan.result }}
      HAS_SHARDS: ${{ needs.plan.outputs.has_shards }}
      VITEST_RESULT: ${{ needs.vitest.result }}
    steps:
      - name: Aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The path-filter job is a prerequisite. If it failed (or was
          # cancelled), CODE_CHANGED is empty and we can't trust a "no
          # changes" answer — fail closed so PRs don't bypass the gate.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Path-filter job did not succeed (result: $CHANGES_RESULT). Cannot determine whether unit tests are required."
            exit 1
          fi

          # On PRs: tests are required only when test-relevant paths changed.
          # On workflow_dispatch: the full sweep is always planned.
          if [[ "$EVENT_NAME" == "pull_request" && "$CODE_CHANGED" != "true" ]]; then
            echo "No test-relevant changes — unit tests not required."
            exit 0
          fi

          # Same fail-closed reasoning: without a plan there is no shard set,
          # so a green verdict here would mean nothing.
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "::error::Shard planning did not succeed (result: $PLAN_RESULT). Cannot determine which unit tests are required."
            exit 1
          fi

          # A code change can still leave no package with a test script in
          # scope — a workflow edit, or a leaf package that has no suite.
          if [[ "$HAS_SHARDS" != "true" ]]; then
            echo "No affected package has unit tests — nothing to run."
            exit 0
          fi

          if [[ "$VITEST_RESULT" == "success" ]]; then
            echo "Unit tests passed on every shard."
            exit 0
          fi

          if [[ "$VITEST_RESULT" == "skipped" ]]; then
            echo "::error::Shards were planned but the vitest matrix did not run."
            exit 1
          fi

          # Name the shard rather than making a reader open the run graph.
          # `|| true` because a summary is not worth failing a report over:
          # the verdict below is already decided.
          FAILED="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | select(.name | startswith("Vitest (")) | .name] | join(", ")' \
            || true)"
          if [[ -n "$FAILED" ]]; then
            echo "::error::Unit tests failed (matrix result: $VITEST_RESULT) — $FAILED"
          else
            echo "::error::Unit tests failed (matrix result: $VITEST_RESULT). See the Vitest shard jobs in this run."
          fi
          exit 1
