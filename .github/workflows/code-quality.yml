name: Code Quality

# Runs Biome format + lint on private staging and canonical master PRs.
#
# Rationale: formatting/lint were previously enforced only by a local
# pre-PR hook, never in CI — so violations drifted onto master unchecked
# (a full `pnpm format` once had to reformat ~280 files). This workflow
# makes `pnpm format:check` and `pnpm lint` a required, always-reported
# status so drift can't accumulate again.
#
# Biome checks the whole tree in a couple of seconds, so there is no need
# to scope to changed packages (unlike the heavier vitest/type-check jobs).
#
# The artifact-notices gate rides in this job for the same reason, plus one
# more: it has to run on a PR that touches only a Dockerfile. `unit-tests`
# skips such a PR entirely (its paths filter is source-file shaped), and
# `turbo run test --filter=...[base]` would not select the check's package
# even if it did not. This workflow has no paths filter at all, so nothing
# can slip past it.
#
# Security: no user-controlled fields are interpolated into run: blocks.

on:
  pull_request:
    branches: [master, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion_policy:
    # Prefix selects authentication work; only its live REST result permits reuse.
    if: >-
      github.repository == 'Fabric-Pro/fabric-dev' &&
      vars.STAGING_RELEASE_ENABLED == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') &&
      github.event.pull_request.base.ref == 'master' &&
      startsWith(github.event.pull_request.head.ref, 'promotion/')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/private-promotion-policy.yml

  biome:
    if: >-
      always() && !cancelled() && (needs.promotion_policy.result != 'success' || needs.promotion_policy.outputs.reduced != 'true') && (true)
    needs: [promotion_policy]
    name: Biome (format + lint)
    # arm64: every step here is architecture-neutral (JS actions, pnpm/node
    # commands, Biome — @biomejs/cli-linux-arm64 ships in pnpm-lock.yaml).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        # Version is read from root package.json's `packageManager` field.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          # The action bootstraps pnpm with `npm ci`, whose audit request has stalled for
          # up to npm's 5-minute fetch timeout on hosted runners before `pnpm self-update`
          # switches to the packageManager pin. The audit adds nothing here: skip it.
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The temporary OSV exception is valid only while the reviewed patch is
      # locked, installed for every consumer, and copied into Docker installs.
      - name: Verify braces security patch
        run: node --test tooling/scripts/src/braces-patch.node-test.mjs

      - name: Verify multipart parser security fixes
        run: node --test tooling/scripts/src/busboy-security.node-test.mjs

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Staging pipeline contract tests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 .github/scripts/staging/test_workflows.py
          node --test .github/actions/oss-snapshot/*manifest.test.mjs
          node --test .github/scripts/staging/promotion-*.test.mjs

      - name: Agent guidance
        run: pnpm guidance:check

      # Apache-2.0 §4(a)/(d) and MIT's notice condition follow the artifact, not
      # the tree — see docs/licensing.md.
      - name: Artifact licence and notice check
        run: pnpm exec tsx scripts/check-artifact-notices.ts
