name: Databricks Context Quality Pilot Tests

on:
  pull_request:
    branches: [master, staging]
    paths:
      - deployment/databricks/context-quality-pilot/**
      - .github/workflows/databricks-context-quality-pilot.yml
  push:
    branches: [master, staging]
    paths:
      - deployment/databricks/context-quality-pilot/**
      - .github/workflows/databricks-context-quality-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Standard-library tests only: no workspace credentials or cloud calls.
      - name: Test synthetic scoring and workspace preflight
        run: python3 -m unittest discover -s deployment/databricks/context-quality-pilot/tests -v
