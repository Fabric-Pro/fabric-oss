name: Request OSS review

# Replaces native CODEOWNERS auto-review (see .github/CODEOWNERS).
# This workflow requests the designated reviewer for pull requests in
# fabric-oss, or the owners team when that reviewer authored the PR. It does
# not request reviews in the internal repository.
#
# pull_request_target (not pull_request) so the base repository's token can
# write review requests even when the PR comes from a fork. Nothing is
# checked out and no PR-controlled text is interpolated into the run block,
# which is what makes the trusted-context event safe here.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    if: github.repository == 'Fabric-Pro/fabric-oss'
    # arm64: this job only runs `gh api` — architecture-neutral.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Request review from the sanctioned maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          REVIEWER=preddy4690
          REVIEWER_FIELD=reviewers
          if [[ "$AUTHOR" == "$REVIEWER" ]]; then
            REVIEWER=owners
            REVIEWER_FIELD=team_reviewers
          fi
          # Reopening a PR can return 422 after a request or review. Confirm
          # that state before treating the response as a no-op.
          if ! ERR=$(gh api --method POST \
            "repos/${{ github.repository }}/pulls/${NUMBER}/requested_reviewers" \
            -f "${REVIEWER_FIELD}[]=${REVIEWER}" 2>&1); then
            case "$ERR" in
              *422*|*Unprocessable*)
                REQUESTED=$(gh api \
                  "repos/${{ github.repository }}/pulls/${NUMBER}/requested_reviewers" \
                  --jq "[.users[].login, .teams[].slug] | index(\"${REVIEWER}\") != null")
                REVIEWED=$(gh api \
                  "repos/${{ github.repository }}/pulls/${NUMBER}/reviews" \
                  --jq "[.[] | select(.user.login == \"${REVIEWER}\")] | length")
                if [[ "$REQUESTED" == true || "$REVIEWED" -gt 0 ]]; then
                  echo "Review request or review already present."
                else
                  echo "$ERR" >&2
                  exit 1
                fi
                ;;
              *)
                echo "$ERR" >&2
                exit 1
                ;;
            esac
          else
            echo "Review requested from ${REVIEWER}"
          fi
