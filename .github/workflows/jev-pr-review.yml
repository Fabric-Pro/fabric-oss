name: Jev PR review

# Advisory model check. Findings become file review threads; staging's thread
# resolution rule requires developers to resolve them before merging.
on:
  pull_request:
    branches: [staging]
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jev-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.pull_request.draft == false
    # Same architecture-neutral runner as type-check.yml's plan job.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_audit: "false"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          check-latest: true

      # Reuse type-check's frozen install and node_modules/verification caches.
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          save-cache: 'false'

      - name: Self-test
        run: node --test tooling/jev-pr-review/__tests__/*.test.mjs

      - name: Review the change
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          JEV_PR_REVIEW_CUTOFF: ${{ vars.JEV_PR_REVIEW_CUTOFF || '0.8' }}
        run: node tooling/jev-pr-review/main.mjs
