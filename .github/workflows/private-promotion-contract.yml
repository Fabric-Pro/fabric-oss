name: Private promotion contract

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  promotion_policy:
    if: >-
      github.repository == 'Fabric-Pro/fabric-dev' &&
      vars.STAGING_RELEASE_ENABLED == 'true' &&
      startsWith(github.event.pull_request.head.ref, 'promotion/')
    uses: ./.github/workflows/private-promotion-policy.yml

  contract:
    name: Private promotion contract
    needs: promotion_policy
    if: needs.promotion_policy.outputs.reduced == 'true'
    # Only private pull requests use Namespace, by event allowlist. Pushes and
    # other events retain GitHub runners: their caches can be restored by other
    # branches, including secret-holding jobs. See unit-tests.yml vitest.
    runs-on: ${{ github.repository == 'Fabric-Pro/fabric-dev' && github.event_name == 'pull_request' && 'namespace-profile-amd2' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify consumed release entries and exact version metadata
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/staging/promotion-contract.mjs . "$CANDIDATE_SHA"
