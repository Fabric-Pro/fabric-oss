[project]
name = "fabric-agent-python"
version = "0.1.0"
description = "Multi-tenant agent runtime utilities for Fabric Python agents (CUGA and others)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10, <3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-groq>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
ignore = ["E501"]

