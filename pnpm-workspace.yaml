# Which dependencies may run install scripts. Merged from
# `package.json#pnpm.onlyBuiltDependencies` (true) and
# `ignoredBuiltDependencies` (false), which pnpm 11 replaces with one map.
allowBuilds:
  "isolated-vm": true
  "prisma": true
  "prisma-zod-generator": true
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  "@scarf/scarf": false
  "@swc/core": false
  "@temporalio/core-bridge": false
  "bufferutil": false
  "core-js": false
  "esbuild": false
  "onnxruntime-node": false
  "protobufjs": false
  "sharp": false
  "tree-sitter-go": false
  "tree-sitter-java": false
  "tree-sitter-javascript": false
  "tree-sitter-python": false
  "tree-sitter-rust": false
  "tree-sitter-typescript": false
  "unrs-resolver": false
  "utf-8-validate": false
  "workerd": false
