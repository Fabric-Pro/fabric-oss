packages:
  - config
  - apps/*
  - packages/*
  - tooling/*
  # The Cloudflare sandbox worker. Outside the workspace it was invisible to
  # `pnpm install --filter`, which made its CI install a silent no-op: nothing
  # was fetched, and the deploy failed on unresolvable imports and a missing
  # wrangler. It only ever worked locally because that directory had a
  # node_modules from a manual install.
  - services/*
  - agents/*/*
  - agents/*/*/*
  - "!agents/langchain/cuga/**"
  - party
  - party-cf

# ---------------------------------------------------------------------------
# Settings below moved here from `package.json#pnpm` and `.npmrc` when the repo
# moved to pnpm 11: pnpm 11 no longer reads the `pnpm` key out of package.json,
# and it restricts `.npmrc` to auth/registry keys. Left where they were, every
# override and hoist pattern would have silently stopped applying.
# ---------------------------------------------------------------------------

# Deliberately the pnpm 10 behaviour. pnpm 11 defaults this to 1440 (a 24h
# quarantine on freshly published versions); this migration is a config move and
# must not change what resolves. Whether to adopt a delay — and with which
# window and exclusions — is decided separately on Fizzy #2419.
minimumReleaseAge: 0

# pnpm 11 defaults this to `install`, which runs an install before `pnpm run` /
# `pnpm exec` whenever it judges node_modules stale. Our shipped images run pnpm
# scripts as a non-root user with no build toolchain and a filtered install
# (e.g. packages/database/Dockerfile.migrate ends with CMD ["pnpm","promote"]),
# so an implicit install attempt at container start would be an outage rather
# than a convenience.
verifyDepsBeforeRun: false

publicHoistPattern:
  - "*prisma*"
  - "@opentelemetry/*"
  - "prom-client"
  # Transitive deps that Turbopack traces during apps/web's Next.js build. The
  # parent packages (@ag-ui/client, @copilotkitnext/*, better-auth/telemetry,
  # d3, d3-delaunay, rehype-katex) don't declare these as their own deps, so
  # without hoisting them publicly pnpm's strict-isolation layout leaves them
  # unreachable from the consumers' node_modules. Vercel's Turbopack build
  # started failing on them on 2026-05-13 ~18:00 UTC when an upstream registry
  # publish (likely @ag-ui/client 0.0.45) shifted the resolution.
  - "uuid"
  - "katex"
  - "d3-format"
  - "delaunator"
  - "@better-auth/core"

