# Fabric Sandbox Worker
# Provides isolated code execution environment for AI agents

name = "fabric-sandbox-dev"
main = "src/index.ts"
compatibility_date = "2025-01-08"
workers_dev = true
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true

# Stateless scripts use a fresh network-denied Dynamic Worker. Bindings are
# non-inheritable: this enables development only, not env.production.
[[worker_loaders]]
binding = "LOADER"

# Sandbox container configuration
[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-3"
max_instances = 10

# Durable Objects for session management
[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "Sandbox"]

# Development variables
[vars]
ENVIRONMENT = "development"

# Production environment
[env.production]
name = "fabric-sandbox"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.containers]]
name = "fabric-sandbox-production"
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-3"
max_instances = 20

[[env.production.durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[env.production.durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"
