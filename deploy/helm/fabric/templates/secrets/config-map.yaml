apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
{{- include "fabric.labels" (dict "name" "config" "Release" .Release "component" "config") | nindent 4 }}
data:
  # --- Runtime ---
  NODE_ENV: "production"
  # node-postgres (the @prisma/adapter-pg driver behind packages/database's
  # PrismaClient) defaults to NO SSL, but RDS rejects unencrypted connections
  # ("no pg_hba.conf entry for host ... no encryption", SQLSTATE 28000). pg honors
  # PGSSLMODE; `no-verify` negotiates TLS without CA verification (the connection
  # is already VPC-internal). `prisma migrate deploy` uses its own engine which
  # ignores PGSSLMODE (defaults to sslmode=prefer via the URL), so it is unaffected.
  PGSSLMODE: "no-verify"
  {{- if .Values.global.siteUrl }}
  NEXT_PUBLIC_SITE_URL: {{ .Values.global.siteUrl | quote }}  # explicit override (e.g. raw ALB hostname)
  {{- else if .Values.global.domain }}
  NEXT_PUBLIC_SITE_URL: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.tls) .Values.global.domain | quote }}
  {{- else }}
  NEXT_PUBLIC_SITE_URL: ""  # Populated post-deploy from the ALB hostname when no domain is configured
  {{- end }}

  # --- Temporal Cloud ---
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  ENABLE_TEMPORAL_WORKFLOWS: "true"

  # --- ElastiCache ---
  # REDIS_URL is intentionally NOT rendered here. It is auto-populated by Terraform
  # (env/dev/main.tf — aws_secretsmanager_secret_version.redis) into the
  # `fabric/<env>/redis` secret with the TLS scheme (rediss://) and the generated
  # AUTH token. The ExternalSecret pulls it into `fabric-app-secrets`, which
  # takes precedence over the ConfigMap at envFrom merge time.
  #
  # Rendering a non-TLS / no-auth fallback here was dangerous: it shadowed the
  # secret value if an operator ever wiped the redis JSON (e.g. via
  # `aws secretsmanager put-secret-value` without read-modify-write), leaving
  # the app talking plaintext to a TLS+AUTH-only ElastiCache cluster.

  # --- Qdrant (vector DB for RAG) ---
  # In-cluster default; override with qdrant.externalUrl when pointing at Qdrant Cloud / Hybrid Cloud.
  {{- if .Values.qdrant.enabled }}
  QDRANT_URL: {{ printf "http://qdrant.%s.svc.cluster.local:%d" .Release.Namespace (int .Values.qdrant.port) | quote }}
  QDRANT_GRPC_URL: {{ printf "http://qdrant.%s.svc.cluster.local:%d" .Release.Namespace (int .Values.qdrant.grpcPort) | quote }}
  {{- else }}
  QDRANT_URL: {{ .Values.qdrant.externalUrl | quote }}
  {{- end }}

  # --- Databricks (optional — Lakebase / workspace integration) ---
  {{- if .Values.databricks.host }}
  DATABRICKS_HOST: {{ .Values.databricks.host | quote }}
  DATABASE_AUTH_PROVIDER: {{ .Values.databricks.databaseAuthProvider | default "password" | quote }}
  WORKER_RLS_MODE: {{ .Values.databricks.workerRlsMode | default "bypassrls" | quote }}
  {{- end }}

  # --- S3 ---
  # STORAGE_PROVIDER controls the storage abstraction in packages/storage/provider/index.ts;
  # default is "minio" (local dev). On AWS it MUST be "s3" so signed URLs target the AWS
  # S3 endpoint rather than the local MinIO container.
  STORAGE_PROVIDER: "s3"
  S3_ENDPOINT: {{ printf "https://s3.%s.amazonaws.com" .Values.global.region | quote }}
  S3_REGION: {{ .Values.global.region | quote }}
  # NEXT_PUBLIC_* bucket names — read in browser via config/index.ts
  NEXT_PUBLIC_AVATARS_BUCKET_NAME: {{ .Values.s3.buckets.avatars | quote }}
  NEXT_PUBLIC_CHAT_DOCUMENTS_BUCKET_NAME: {{ .Values.s3.buckets.chatDocuments | quote }}
  NEXT_PUBLIC_PROJECT_CONTEXTS_BUCKET_NAME: {{ .Values.s3.buckets.projectContexts | quote }}
  # Server-only bucket names — read in config/index.ts without NEXT_PUBLIC prefix.
  # Missing any of these means the server falls back to the hardcoded literal default
  # ("workspace-documents", "skills", "project-document-assets") which won't match the
  # prefixed Terraform bucket names (e.g. "fabric-dev-12345678-workspace-documents").
  WORKSPACE_DOCUMENTS_BUCKET_NAME: {{ .Values.s3.buckets.workspaceDocuments | quote }}
  SKILLS_BUCKET_NAME: {{ .Values.s3.buckets.skills | quote }}
  PROJECT_DOCUMENT_ASSETS_BUCKET_NAME: {{ .Values.s3.buckets.projectDocumentAssets | quote }}

  # --- Inter-service URLs (cluster DNS) ---
  # Agents + temporal-worker call back into the web API for AI-config fetch,
  # token exchange, usage logging, session validation, and tool-router access.
  # Two var names are in use across consumers, so we set BOTH to the in-cluster
  # web Service:
  #   RUNTIME_API_URL — checked first by the @repo/agent-core chain
  #     (token-exchange / langchain-models / usage-logging) + runtime-client +
  #     weave shuttle-execution.
  #   FABRIC_API_URL  — read DIRECTLY (no RUNTIME_API_URL fallback) by api-agent
  #     (a2a-server / unified-server) and data-analyst (middleware /
  #     fabric-auth get-session / fabric-tools). Without it those pods fall back
  #     to localhost:3001 and hit their own container instead of web.
  # NOTE: NEXT_PUBLIC_FABRIC_API_URL (browser-facing login links in the
  # data-analyst Next UI) is intentionally NOT set to this cluster-local URL — it
  # would need a PUBLIC URL, and the data-analyst UI is not Ingress-exposed in
  # this chart (only the `web` Service is), so no browser reaches it here.
  RUNTIME_API_URL: "http://web.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.web.port }}"
  FABRIC_API_URL: "http://web.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.web.port }}"
  MCP_STDIO_WRAPPER_URL: "http://mcp-stdio-wrapper.{{ .Release.Namespace }}.svc.cluster.local:3100"
  {{- range .Values.agents }}
  {{ .name | upper | replace "-" "_" }}_URL: "http://{{ .name }}.{{ $.Release.Namespace }}.svc.cluster.local:{{ .port }}"
  {{- end }}

  # --- Collaboration (Cloudflare PartyKit) ---
  NEXT_PUBLIC_ENABLE_COLLABORATION: {{ .Values.collaboration.enabled | quote }}
  NEXT_PUBLIC_PARTYKIT_HOST: {{ .Values.collaboration.partykitHost | quote }}

  # --- Observability ---
  OTEL_ENABLED: {{ .Values.otelCollector.enabled | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
