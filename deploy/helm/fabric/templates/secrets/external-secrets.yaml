{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fabric-app-secrets
  labels:
{{- include "fabric.labels" (dict "name" "app-secrets" "Release" .Release "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: fabric-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "fabric/{{ .Values.global.environment }}/database"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/auth"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/ai-providers"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/oauth"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/integrations"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/redis"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/temporal"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/cloudflare"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/storage"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/email"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/payments"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/qdrant"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/agents"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/upstash"
    - extract:
        key: "fabric/{{ .Values.global.environment }}/databricks"
{{- if .Values.temporalWorker.bypassRlsRole }}
---
# Dedicated secret for the temporal-worker's BYPASSRLS connection. The worker
# overrides its DATABASE_URL with WORKER_DATABASE_URL (fabric_worker creds) so it
# can read/write tenant tables under FORCE RLS. See apply-rls-direct.ts.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fabric-worker-secrets
  labels:
{{- include "fabric.labels" (dict "name" "worker-secrets" "Release" .Release "component" "secrets") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.secretStore }}
  target:
    name: fabric-worker-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: "fabric/{{ .Values.global.environment }}/database-worker"
{{- end }}
{{- end }}
