{{- if and .Values.fluentbit.enabled (eq .Values.fluentbit.destination "cloudwatch") }}
# Fluent Bit — DaemonSet that tails /var/log/containers/*.log on every node and
# ships them to CloudWatch Logs. Log group is per-container under
# /fabric/<env>/<container_name> so retrieval by service is straightforward.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  labels:
{{- include "fabric.labels" (dict "name" "fluentbit" "Release" .Release "component" "observability") | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        Off
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            cri
        DB                /var/log/flb-state/tail.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              {{ .Values.global.region }}
        log_group_name      /fabric/{{ .Values.global.environment }}/${kubernetes['container_name']}
        log_stream_prefix   ${kubernetes['pod_name']}.
        auto_create_group   true
        log_retention_days  14

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit
  labels:
{{- include "fabric.labels" (dict "name" "fluentbit" "Release" .Release "component" "observability") | nindent 4 }}
spec:
  selector:
    matchLabels:
{{- include "fabric.selectorLabels" (dict "name" "fluentbit" "Release" .Release) | nindent 6 }}
  template:
    metadata:
      labels:
{{- include "fabric.selectorLabels" (dict "name" "fluentbit" "Release" .Release) | nindent 8 }}
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: {{ include "fabric.serviceAccountName" (dict "Values" .Values) }}
      tolerations:
        - operator: Exists       # run on all nodes including tainted ones (standard for log DaemonSets)
      containers:
        - name: fluentbit
          image: cr.fluentbit.io/fluent/fluent-bit:3.0
          env:
            - name: AWS_REGION
              value: {{ .Values.global.region | quote }}
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: flb-state
              mountPath: /var/log/flb-state
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: fluentbit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: flb-state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
{{- end }}
