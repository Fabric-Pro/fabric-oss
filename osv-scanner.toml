# Dependency advisory exceptions, including verified local security patches.
#
# This file is the machine-readable half of the dismissal table in
# SECURITY.md § Documented dismissals, which stays the authority for the
# reasoning behind each entry. Add a row there when you add an entry here.

# OSV sees the registry version, not pnpm's installed patch. This exception is
# backed by the mandatory installed-package and patch-integrity check in the
# code-quality workflow; removal or modification of the patch fails that check.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-31
reason = "braces@3.0.3 is patched locally with bounded parse/compile/expand/stringify depth. CI verifies reviewed patch bytes, lockfile consumer hashes, effective installed behavior and Docker patch propagation. OSV cannot recognize pnpm patches. Retire when a fixed upstream release exists. See SECURITY.md § Documented dismissals."
#
# `ignoreUntil` is enforced by osv-scanner: once the date passes the advisory
# fails CI again, so a dismissal cannot outlive its quarterly re-evaluation.
# It replaces `pnpm.auditConfig.ignoreGhsas`, which had no expiry — a dismissal
# there was permanent unless somebody remembered to revisit it.
#
# The former undici@5.x entries (GHSA-v9p9-hfj2-hcw8, GHSA-vrm6-8vpv-qv8q,
# GHSA-vxpw-j846-p89q) were removed once undici@5 left the lockfile and
# osv-scanner started flagging them as unused ignores.

# The former brace-expansion entry (GHSA-mh99-v99m-4gvg) was removed
# 2026-08-03: the 1.x/2.x backports it was waiting for shipped and the
# lockfile now resolves 1.1.18 / 2.1.4.

# extract-zip has no fixed release to move to: 2.0.1 is simultaneously the
# last affected version and the newest ever published, and the current
# @langchain/langgraph-cli (1.4.5, re-checked 2026-09-02) still declares
# `extract-zip: ^2.0.1` — so neither the package nor its parent can be
# upgraded out of this one.
[[IgnoredVulns]]
id = "GHSA-jmr9-qjv8-65gv"
ignoreUntil = 2026-11-12
reason = "extract-zip@2.0.1 via @langchain/langgraph-cli; no patched release exists upstream. Sole call site is the CLI's Python dev path, which this repo never invokes. See SECURITY.md § Documented dismissals."

# Published 2026-09; the SAME defect class on the SAME unfixable package as the
# entry above — symlink archive entries escaping the extraction directory — so
# the chain and the reachability argument are identical and are not restated
# here. Deliberately given the same `ignoreUntil` so the two are re-evaluated in
# one pass: whatever retires one (a 2.0.2+, or a langgraph-cli that drops the
# dependency) retires both, and staggered dates would mean doing the same
# investigation twice.
[[IgnoredVulns]]
id = "GHSA-7pqw-9j4j-h8q3"
ignoreUntil = 2026-11-12
reason = "extract-zip@2.0.1 via @langchain/langgraph-cli; same unfixable package and same symlink-write class as GHSA-jmr9-qjv8-65gv. No patched release exists upstream. Sole call site is the CLI's Python dev path, which this repo never invokes. See SECURITY.md § Documented dismissals."

# node-forge has no fixed release to move to: 1.4.0 is both the newest ever
# published and inside the advisory's `<= 1.4.0` range. It arrives only through
# @copilotkit/runtime -> @langchain/google-gauth -> google-auth-library@8 ->
# gtoken@6 -> google-p12-pem, which never calls the RSA signature verification
# the advisory is about. Overriding gtoken to 7.x would drop the chain but swaps
# a major under an auth library for a dismissal of unreachable code.
[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2026-12-31
reason = "node-forge@1.4.0 via @copilotkit/runtime -> @langchain/google-gauth -> google-auth-library@8 -> gtoken@6 -> google-p12-pem; no patched release exists upstream. google-p12-pem only parses PKCS#12 and writes PEM, never verifying RSA signatures, and loads only for .p12 key files. See SECURITY.md § Documented dismissals."

# The former deepmerge-ts entry (GHSA-ggr8-5vv4-36mx) was removed 2026-09-02:
# the `deepmerge-ts` -> `^8.0.2` override in the root package.json moves
