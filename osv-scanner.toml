# Published 2026-10-23 and fixed only in @azure/msal-node 7.1.0, two majors past
# what either locked parent accepts: @azure/identity 4.14 declares ^6 and
# @microsoft/agents-hosting pins an exact 5.x. Only the authorization-code flow
# is affected, and the required dependency-security check fails if a
# first-party call site for that flow appears or an unreviewed msal-node
# version is locked. Short expiry so the parents are re-checked for a 7.x range.
[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2026-11-30
reason = "@azure/msal-node 5.1.5 via @microsoft/agents-hosting 1.8.1 (CopilotKit Teams channel) and 5.2.1 via @azure/identity 4.13.2; fixed only in 7.1.0, which neither parent accepts. Affects only the auth_code flow (acquireTokenByCode). The sole first-party credential is DefaultAzureCredential, whose chain does not run an interactive or authorization-code request; the installed agents-hosting calls neither acquireTokenByCode nor acquireTokenInteractive. The required dependency-security check rejects unreviewed msal-node versions, and first-party source naming the auth-code credentials or msal calls or registering the VS Code/broker identity plugins. See SECURITY.md § Documented dismissals."
