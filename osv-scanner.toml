# Dependency advisory exceptions, including verified local security patches.
#
# This file is the machine-readable half of the dismissal table in
# SECURITY.md § Documented dismissals, which stays the authority for the
# reasoning behind each entry. Add a row there when you add an entry here.

# OSV sees the registry version, not pnpm's installed patch, so an exception for
# a locally patched package must be backed by a CI check of the installed patch.
#
# `ignoreUntil` is enforced by osv-scanner: once the date passes the advisory
# fails CI again, so a dismissal cannot outlive its quarterly re-evaluation.
# It replaces `pnpm.auditConfig.ignoreGhsas`, which had no expiry — a dismissal
# there was permanent unless somebody remembered to revisit it.
#
# The former undici@5.x entries (GHSA-v9p9-hfj2-hcw8, GHSA-vrm6-8vpv-qv8q,
# GHSA-vxpw-j846-p89q) were removed once undici@5 left the lockfile and
# osv-scanner started flagging them as unused ignores.
#
# The former braces entry (GHSA-vfj7-8cjw-p6xm) was removed 2026-10-23: GitHub
# withdrew the advisory as not practically exploitable and osv-scanner flagged
# the ignore as unused. The local braces patch it covered was retired with it.

# The former brace-expansion entry (GHSA-mh99-v99m-4gvg) was removed
# 2026-08-03: the 1.x/2.x backports it was waiting for shipped and the
# lockfile now resolves 1.1.18 / 2.1.4.

# This ID-level ignore would also hide a vulnerable zod 4 copy. The required
# dependency-security lockfile check limits it to reviewed zod 3 versions and
# zod >= 4.6.6, and requires first-party importers to resolve >= 4.6.6.
# First-party importers now resolve zod 4.6.7; third-party bundled v4 remains accepted.
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-31
reason = "Remaining third-party Zod 3.25.75/3.25.76 and zod/v3 compatibility risk; no fixed v3 release exists. Mounted CopilotKit AG-UI CJS/ESM schemas and declarations use a reviewed exact-version patch plus isolated Zod 4.6.7 alias, with actual parser/capped-array/8MiB transport regression checks. CopilotKit direct v3 and other SDK v3 copies remain separately accepted; no all-copies closure is claimed. First-party and standalone v4 lockfile floors remain enforced. See SECURITY.md for scope and expiry."

# The former deepmerge-ts entry (GHSA-ggr8-5vv4-36mx) was removed 2026-09-02:
# the override moved it past the first fixed release (8.0.0). The override
# is now removed because @prisma/config@7.10.1 pins deepmerge-ts 8.0.2 itself;
# the lockfile contains only deepmerge-ts 8.0.2, with no lower version.

# The former @opentelemetry/core entry (GHSA-8988-4f7v-96qf) was removed
# 2026-09-04: `@temporalio/interceptors-opentelemetry` was the only
# top-level introducer of the OpenTelemetry v1 island, and moving to
# `@temporalio/interceptors-opentelemetry-v2` (which requires
# `@opentelemetry/core: ^2.2.0`) removed that island from the lockfile,
# leaving nothing for the ignore to cover.

# Identity 4.14.1 now accepts fixed MSAL 7.x. The separate Microsoft Agents
# parent still pins reviewed 5.1.5; the source/lock guard retains this exception.
# agents-hosting 1.10.2 moves to MSAL 7.1.1 but was published 2026-11-19,
# inside the 24-hour minimumReleaseAge window when this was re-checked.
[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2027-01-19
reason = "MSAL 5.1.5 remains via Microsoft agents-hosting 1.8.1 (re-checked 2026-11-20; 1.10.2 with MSAL 7.1.1 is the planned replacement); Identity 4.14.1 and telemetry resolve fixed MSAL 7.1.2. The installed agents-hosting does not call acquireTokenByCode or acquireTokenInteractive. The dependency-security guard checks locked versions and named first-party auth-code credentials, calls and identity plugin registrations. Reviewed DefaultAzureCredential sites include Log Analytics and Anthropic federation. See SECURITY.md for the remaining third-party risk."

# The former graphql-scalars entry (GHSA-x8rm-f576-gq67) was removed
# 2026-11-20: a CopilotKit-scoped override pins graphql-scalars 1.24.0, which
# predates the vulnerable PhoneNumber regex, so no affected copy remains.

# esbuild <0.25.0 serves cross-origin reads from its development server. The
# dependency-security check limits this ID-wide ignore to the two reviewed
# copies under their reviewed parents and checks that neither starts `serve`.
[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
ignoreUntil = 2027-02-19
reason = "esbuild 0.18.20 (drizzle-kit dev dependency via @esbuild-kit/core-utils, transform-only) and 0.21.5 (partykit 0.0.115 local collab dev CLI, which starts esbuild serve only for a configured serve assets directory; none is configured). Neither parent has a release on esbuild >=0.25. Production collab runs from party-cf. See SECURITY.md § Documented dismissals."

# instrumentation-http <0.222.0 copies raw query strings into server spans.
# auto-instrumentations-node resolves the fixed line; only Azure Monitor's
# unregistered copy remains, and the dependency-security check limits the
# ignore to it and checks first-party code never calls useAzureMonitor.
[[IgnoredVulns]]
id = "GHSA-3v2p-hm54-8qcq"
ignoreUntil = 2027-01-19
reason = "instrumentation-http 0.221.0 remains only under @azure/monitor-opentelemetry 1.20.1 (latest 1.21.0 still declares ^0.221.0). Its instrumentations are registered only by useAzureMonitor; first-party code builds its only TelemetryClient with useGlobalProviders false, whose provider loads no instrumentation. The registered NodeSDK instrumentation resolves fixed 0.223.2. See SECURITY.md § Documented dismissals."

# No fixed picomatch release exists; every version through 4.0.7 is affected.
# The dependency-security check limits this ID-wide ignore to the reviewed
# lockfile versions and fails if first-party source imports a glob compiler.
[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-17
reason = "picomatch 2.3.2/4.0.4/4.0.5 ReDoS needs an attacker-supplied glob pattern. First-party code imports no glob-compiling library; every consumer (build, test, watch and changeset tooling, next-intl's watcher, Vercel microfrontends config, Next.js's bundled copy for images.remotePatterns) compiles patterns from package code or repository config, not from request input (reviewed 2026-11-17). No fixed release exists. See SECURITY.md § Documented dismissals."
