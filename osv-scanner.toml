# Dependency advisory exceptions, including verified local security patches.
#
# This file is the machine-readable half of the dismissal table in
# SECURITY.md § Documented dismissals, which stays the authority for the
# reasoning behind each entry. Add a row there when you add an entry here.

# OSV sees the registry version, not pnpm's installed patch. This exception is
# backed by the mandatory installed-package and patch-integrity check in the
# code-quality workflow; removal or modification of the patch fails that check.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-12-31
reason = "braces@3.0.3 is patched locally with bounded parse/compile/expand/stringify depth. CI verifies reviewed patch bytes, lockfile consumer hashes, effective installed behavior and Docker patch propagation. OSV cannot recognize pnpm patches. Retire when a fixed upstream release exists. See SECURITY.md § Documented dismissals."
#
# `ignoreUntil` is enforced by osv-scanner: once the date passes the advisory
# fails CI again, so a dismissal cannot outlive its quarterly re-evaluation.
# It replaces `pnpm.auditConfig.ignoreGhsas`, which had no expiry — a dismissal
# there was permanent unless somebody remembered to revisit it.
#
# The former undici@5.x entries (GHSA-v9p9-hfj2-hcw8, GHSA-vrm6-8vpv-qv8q,
# GHSA-vxpw-j846-p89q) were removed once undici@5 left the lockfile and
# osv-scanner started flagging them as unused ignores.

# The supported GraphQL consumers require utils 10.x. Version 12.0.1 fixes
# mergeDeep but changes the field-collection variable API used by executor 1.x.
# Backport that security fix only; require reviewed patch integrity and actual
# CJS/ESM consumer behavior in CI until the consumers support a fixed release.
[[IgnoredVulns]]
id = "GHSA-7mx3-vvmw-hjmv"
ignoreUntil = 2026-12-31
reason = "@graphql-tools/utils@10.10.1 is patched locally with the upstream mergeDeep prototype-pollution fix. CI verifies reviewed patch bytes, every lockfile consumer hash, effective CJS/ESM consumer behavior and GraphQL executor variable compatibility. OSV cannot recognize pnpm patches. Retire with a compatible fixed consumer upgrade. See SECURITY.md § Documented dismissals."

# Published 2026-10-22 against the same package and version as the entry above,
# fixed upstream only in 12.0.2. The same pnpm patch now also backports the
# mergeIncrementalResult path-segment fix, and nothing installed or first-party
# calls that function. Same `ignoreUntil` as its sibling, so one consumer
# upgrade retires both in a single re-evaluation.
[[IgnoredVulns]]
id = "GHSA-c4qx-w738-7hr3"
ignoreUntil = 2026-12-31
reason = "@graphql-tools/utils@10.10.1 is patched locally with the upstream mergeIncrementalResult fix rejecting non-primitive and prototype-chain path segments. No installed package or first-party code calls mergeIncrementalResult. CI verifies reviewed patch bytes, every lockfile consumer hash and effective CJS/ESM behavior. OSV cannot recognize pnpm patches. Retire with a compatible fixed consumer upgrade. See SECURITY.md § Documented dismissals."

