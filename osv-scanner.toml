# This ID-level ignore would also hide a vulnerable zod 4 copy. The required
# dependency-security lockfile check limits it to reviewed zod 3 versions and
# zod >= 4.6.6; bundled zod/v4 inside zod 3 remains part of the accepted risk.
[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-12-31
reason = "Temporary risk acceptance for zod 3.25.75 via @microsoft/agents-hosting and @microsoft/agents-activity, and 3.25.76 via CopilotKit runtime/shared/a2ui-renderer/Slack/Teams channels, @ag-ui/core/client, @a2ui/web_core, exa-js, miniflare, zod-from-json-schema and first-party data-analyst/project-document-generator/weave-planners/weave-readers/mcp-server. Oversized capped collections still parse elements; no fixed 3.x release exists. Mounted CopilotKit HTTP parsing is session/organization checked and rate limited to 500/min/user; reviewed RunAgentInput schemas have uncapped collections, and no explicit route byte limit was found. CopilotKit Slack/Teams listeners and Microsoft activity parsing have no first-party mount; reviewed activity schemas have no capped collections. First-party code imports bundled zod/v4 from 3.25.76: the data-analyst Next.js chat route has messages.max(100), reachable with a session and an in-process 10/min/user limit, with no explicit route byte limit; the agent Docker image instead starts unified-server. Other reviewed first-party schemas have no capped collections. This accepts remaining risk, including bundled v4; it is not an unreachability claim. The zod/v3 compatibility subpath inside zod 4.6.7 also retains the behavior and is not separately visible to OSV; imports by openai, @modelcontextprotocol/sdk, @ai-sdk/provider-utils, zod-to-json-schema and zod-validation-error are included in this risk acceptance; no direct first-party zod/v3 import was found. Standalone zod 4 copies moved to 4.6.7 through the override; the required dependency-security lockfile check rejects versions below 4.6.6 except the two reviewed zod 3 versions. Retire per Fizzy #3277. See SECURITY.md § Documented dismissals."

