services:
  postgres:
    image: postgres:16-alpine
    container_name: data-analyst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_analyst_agent
    ports:
      - "5433:5432"  # Using port 5433 to avoid conflicts with existing PostgreSQL
    volumes:
      - data_analyst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data_analyst_pgdata:
